<!doctype html>
<html lang="en">
<head>
<base href="../">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>Blue's Pizza Shop Level 1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Kalam:wght@400;700&family=Nunito:wght@600;700;800&display=swap">

<style>
/* Draft 2 — an Indian kitchen table. A hand block-printed indigo tablecloth fills
   the screen; the pizza sits on a wooden board, toppings wait in steel katoris on
   a thali, and every word lives on one floating card at the bottom.
   One committed light look: indigo, marigold, cream, tomato. */
:root{
  --indigo:#23356F; --indigo-2:#3A55A0; --indigo-ink:#141E45;
  --cream:#FFF8EA; --paper:#FFFDF6;
  --marigold:#F2A62C; --marigold-deep:#B97410;
  --tomato:#C8402E; --leaf:#3F8A3C;
  --ink:#2B2016; --ink-soft:#76604C;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,sans-serif;
  --hand:"Kalam","Comic Sans MS","Segoe Print",cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}   /* also when the file is opened directly, without the page wrapper */
html,body{height:100%}
body{margin:0;overflow:hidden;color:var(--ink);font-family:var(--body);-webkit-user-select:none;user-select:none;
  background:#244D25}
/* the jungle shop from the first scene, softly out of focus behind everything */
body::before{content:"";position:fixed;inset:-40px;z-index:-2;
  background:url("assets/web/backdrop.webp") center 62%/cover;filter:blur(9px) saturate(1.15) brightness(.8)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 44%,rgba(18,48,20,0) 34%,rgba(8,28,10,.55) 100%)}
.frond{position:fixed;top:-30px;width:min(30vw,340px);height:auto;z-index:-1;pointer-events:none;
  filter:drop-shadow(0 10px 12px rgba(0,20,0,.35))}
.frond.l{left:-50px;transform-origin:0 0;animation:frondL 7s ease-in-out infinite}
.frond.r{right:-50px;transform:scaleX(-1);transform-origin:100% 0;animation:frondR 7.6s ease-in-out infinite}
@keyframes frondL{0%,100%{rotate:0deg}50%{rotate:2.2deg}}
@keyframes frondR{0%,100%{rotate:0deg}50%{rotate:-2.2deg}}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,select:focus-visible{outline:3px solid var(--marigold);outline-offset:3px}

#app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:8px;max-width:1360px;margin:0 auto;
  padding-block:10px 12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- header chips ---------- */
.top{display:flex;align-items:center;gap:10px}
.chip{background:rgba(255,253,246,.94);border:2px solid rgba(35,53,111,.16);border-radius:999px;
  box-shadow:0 4px 14px rgba(20,30,70,.16);color:var(--indigo)}
.home{width:44px;height:44px;display:grid;place-items:center;flex:0 0 auto}
.home svg{width:22px;height:22px}
.jump{position:relative;flex:0 1 auto;min-width:0}
.jump select{appearance:none;-webkit-appearance:none;width:100%;max-width:min(48vw,370px);height:44px;
  font-family:var(--display);font-weight:800;font-size:clamp(14px,1.5vw,17px);color:var(--indigo);
  background:rgba(255,253,246,.94);border:2px solid rgba(35,53,111,.16);border-radius:999px;
  box-shadow:0 4px 14px rgba(20,30,70,.16);padding:0 42px 0 18px;cursor:pointer;text-overflow:ellipsis}
.jump::after{content:"";position:absolute;right:18px;top:50%;width:8px;height:8px;pointer-events:none;
  border-right:3px solid var(--indigo);border-bottom:3px solid var(--indigo);transform:translateY(-70%) rotate(45deg)}
.jump option,.jump optgroup{color:var(--ink);background:#fff;font-family:var(--body)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.trail{flex:0 1 auto;margin-inline:auto;display:flex;justify-content:center;gap:6px;min-width:0;
  background:rgba(255,253,246,.94);border:2px solid rgba(35,53,111,.16);border-radius:999px;padding:5px 12px;
  box-shadow:0 4px 14px rgba(20,30,70,.16)}
.tok{width:30px;height:30px;transition:transform .3s}
.tok.now{transform:scale(1.22)}
.stars{height:44px;display:flex;align-items:center;gap:6px;padding:0 16px;font-family:var(--display);font-weight:800;
  font-size:18px;font-variant-numeric:tabular-nums;flex:0 0 auto}

/* ---------- stage ---------- */
.stage{position:relative;min-height:0;display:grid;padding:2.2vh 1.8vw;border-radius:30px;
  background:url("assets/draft2/table.svg") 0 0/400px 240px,#D9A867;
  box-shadow:inset 0 3px 0 rgba(255,240,210,.55),inset 0 -8px 0 rgba(90,50,20,.22),
    0 12px 0 #7A4A22,0 15px 0 #4E2E14,0 30px 42px rgba(6,24,8,.5);grid-template-columns:minmax(190px,.82fr) auto minmax(230px,1fr);
  grid-template-areas:"cust board tray";align-items:center;column-gap:clamp(12px,2.2vw,36px)}
.stage>*{min-width:0}

/* customer + order: a glossy jungle leaf with the animal on it and the fraction as the hero */
.cust{grid-area:cust;align-self:center;display:grid;justify-items:center;position:relative;z-index:3}
.slip{position:relative;isolation:isolate;width:min(100%,292px);padding:74px 34px 62px;display:grid;justify-items:center;
  gap:7px;text-align:center;transform-origin:50% 0;animation:leafSway 6s ease-in-out infinite}
.slip>.leafbg{position:absolute;inset:0;width:100%;height:100%;z-index:-1;overflow:visible;
  filter:drop-shadow(0 18px 14px rgba(8,30,8,.4))}
.slip.enter{animation:leafIn .9s cubic-bezier(.2,1.2,.4,1) both, leafSway 6s ease-in-out .9s infinite}
.slip.shake{animation:shake .5s, leafSway 6s ease-in-out .5s infinite}
@keyframes leafIn{from{transform:translateY(-90px) rotate(-16deg);opacity:0}}
@keyframes leafSway{0%,100%{rotate:-1.4deg}50%{rotate:1.4deg}}
.tag{position:absolute;left:50%;top:10px;translate:-50% 0;rotate:-3deg;display:flex;align-items:baseline;gap:8px;
  white-space:nowrap;background:linear-gradient(180deg,#B07A44,#7A4A22 70%,#6A3F1C);color:#FFF1D6;
  border-radius:10px 13px 9px 12px;padding:5px 22px 4px;font-family:var(--display);font-weight:800;font-size:12px;
  letter-spacing:.16em;box-shadow:0 4px 0 #3E220C,0 7px 10px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.3)}
.tag b{font-size:19px;letter-spacing:.04em}
.tag::before,.tag::after{content:"";position:absolute;top:50%;width:7px;height:7px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#C9CED6,#5E646D);translate:0 -50%}
.tag::before{left:7px}.tag::after{right:7px}
.slip .who{position:relative;width:112px;height:112px;border-radius:50%;display:flex;align-items:flex-end;justify-content:center;
  background:radial-gradient(circle at 50% 32%,#FFFFFF,#EAF7D6 62%,#C6E7A0);
  box-shadow:0 0 0 5px #FFFFFF,0 9px 14px rgba(20,60,20,.38),inset 0 -8px 12px rgba(60,110,40,.22)}
.slip .who img{height:124px;width:auto;display:block;margin-bottom:-4px;filter:drop-shadow(0 6px 4px rgba(30,50,20,.35))}
.slip .who.duo img{height:104px;margin:0 -16px -4px}
.who.enter img{animation:pop .55s .35s cubic-bezier(.3,1.6,.5,1) both}
.who.happy img{animation:hop .55s ease 3}
.who.sad img{animation:shake .5s}
.slip-name{margin-top:-16px;position:relative;z-index:1;font-family:var(--display);font-weight:800;font-size:17px;
  color:#FFFFFF;background:linear-gradient(180deg,#45963F,#2C6B2C);padding:3px 18px;border-radius:999px;
  box-shadow:0 3px 0 #1B451C,0 5px 8px rgba(0,0,0,.25);text-shadow:0 1px 0 rgba(0,0,0,.25)}
.wants{display:grid;justify-items:center;gap:4px;margin-top:2px}
.wants small{font-family:var(--display);font-weight:800;font-size:11px;letter-spacing:.2em;color:#1E4D1F;
  background:rgba(255,255,255,.88);border-radius:999px;padding:1px 12px}
.fracbadge{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 34% 26%,#FF9A7A,#E5523A 42%,#A82A17 100%);
  box-shadow:0 0 0 6px #FFFFFF,0 0 0 10px rgba(229,82,58,.3),0 14px 18px rgba(110,25,10,.4),
    inset 0 -10px 14px rgba(0,0,0,.2),inset 0 8px 12px rgba(255,255,255,.35);
  animation:badgePulse 2.4s ease-in-out infinite}
.fracbadge .fr{font-size:48px;margin:0;color:#FFFFFF;text-shadow:0 3px 0 rgba(110,20,8,.45)}
.fracbadge .fr b:first-child{border-bottom-width:.075em;box-shadow:0 2px 0 rgba(110,20,8,.35)}
@keyframes badgePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.ofpizza{font-family:var(--display);font-weight:800;font-size:14px;color:#7A2A17;background:#FFF3D6;border-radius:999px;
  padding:2px 14px;box-shadow:0 2px 0 rgba(120,60,20,.3)}
.facts{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:2px}
.fact{display:flex;align-items:center;gap:5px;background:rgba(255,253,246,.96);border-radius:12px;padding:3px 10px 3px 6px;
  font-family:var(--display);font-weight:700;font-size:13px;color:#2B2016;box-shadow:0 3px 0 rgba(30,70,25,.3)}
.fact svg,.fact img{width:20px;height:20px;flex:0 0 auto}
.slip-note{margin:2px 0 0;max-width:220px;font-family:var(--hand);font-weight:700;font-size:15px;line-height:1.25;color:#1E4D1F;
  background:rgba(255,255,255,.78);border-radius:12px;padding:4px 12px;text-wrap:balance}
.slip-note .fr{color:var(--tomato)}
.stamp{position:absolute;right:4px;top:150px;rotate:-14deg;font-family:var(--display);font-weight:800;font-size:22px;
  letter-spacing:.14em;color:var(--tomato);border:3px solid currentColor;border-radius:8px;padding:0 10px;
  background:rgba(255,253,246,.88);box-shadow:0 4px 8px rgba(0,0,0,.2);animation:stamp .42s cubic-bezier(.3,1.6,.5,1)}
@keyframes stamp{from{transform:scale(2.6);opacity:0}}
@keyframes hop{50%{transform:translateY(-18px)}}
@keyframes shake{20%{transform:translateX(-8px) rotate(-3deg)}40%{transform:translateX(8px) rotate(3deg)}
  60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* board + pizza */
.boardzone{grid-area:board;display:grid;place-items:center;position:relative;z-index:2}
.boardwrap{--bsz:min(calc(100vh - 262px),40vw);position:relative;width:var(--bsz);aspect-ratio:600/620;max-width:100%}
.boardwrap.in{animation:boardIn .7s cubic-bezier(.25,1.2,.4,1) both}
.boardwrap.thud{animation:thud .32s ease}
.boardwrap.wiggle{animation:shake .55s}
@keyframes boardIn{from{transform:translateY(-70px) rotate(-4deg);opacity:0}}
@keyframes thud{40%{transform:translateY(5px) scale(.995)}}
.boardwrap>img{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 20px 22px rgba(25,20,60,.34))}
#pz{position:absolute;left:6%;top:5.8%;width:88%;height:auto;aspect-ratio:1;overflow:visible;touch-action:none}
#pz.bad{filter:drop-shadow(0 0 16px rgba(225,40,30,.9))}
.part{transition:transform .7s cubic-bezier(.3,1.35,.5,1)}
.part.lifted{filter:drop-shadow(0 12px 10px rgba(30,20,10,.35))}
.hit{fill:rgba(255,255,255,0);cursor:pointer;transition:fill .15s}
.hit.hov{fill:rgba(255,226,120,.45)}
.hit.bad{fill:rgba(225,50,40,.42)}
.cut{stroke:#5A2A0E;stroke-opacity:.85;stroke-width:5;stroke-linecap:round;fill:none}
#cuts{transition:opacity .6s}
.pc{transform-box:fill-box;transform-origin:center}
.spin{transform-box:fill-box;transform-origin:center}
#cutter.rolling .spin{animation:spin .45s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.crumb{animation:crumb .7s ease-out forwards}
@keyframes crumb{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.badge .bi{transform-box:fill-box;transform-origin:center;animation:pop .38s cubic-bezier(.3,1.7,.5,1) both}
.badge circle{fill:var(--indigo);stroke:var(--marigold);stroke-width:6}
.badge text{fill:#fff;font-family:var(--display);font-weight:800;font-size:36px;text-anchor:middle}
.badge.out{opacity:0;transition:opacity .35s}
@keyframes pop{from{transform:scale(0)}}

/* thali of toppings / moulds */
.trayzone{grid-area:tray;display:grid;place-items:center;position:relative;z-index:2}
.tray{--tsz:min(27vw,calc(100vh - 290px),380px);position:relative;width:var(--tsz);aspect-ratio:600/630;max-width:100%}
.tray>img.thali{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 16px 16px rgba(25,20,60,.30))}
.slot{position:absolute;width:31%;translate:-50% -50%;display:grid;justify-items:center;gap:2px;touch-action:none}
.slot.mould{width:36%}
/* the supplied coconut tray: each bowl slot is placed in the tray image's own pixels */
.bowl{position:absolute;display:block;cursor:grab;touch-action:none;transition:transform .18s}
.bowl svg{width:100%;height:100%;display:block;overflow:visible;pointer-events:none}
.bowl:hover{transform:translateY(-4px)}
.bowl.sel{transform:translateY(-6px)}
.bowl.sel svg{filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 12px var(--marigold))}
.bowl.ask svg{animation:hop .5s ease 2}
.bowl-label{position:absolute;translate:-50% 0;font-family:var(--display);font-weight:800;font-size:clamp(11px,1.05vw,14px);
  color:var(--indigo);background:#FFFFFF;border-radius:999px;padding:1px 12px;white-space:nowrap;pointer-events:none;
  box-shadow:0 3px 0 rgba(60,30,10,.35)}
.tray.coco>img.thali{filter:drop-shadow(0 18px 16px rgba(40,20,5,.4))}
.slot.katori{width:35%}
.slot img,.slot svg{width:100%;height:auto;display:block;pointer-events:none;filter:drop-shadow(0 6px 5px rgba(30,30,50,.28))}
.slot span{font-family:var(--display);font-weight:800;font-size:clamp(11px,1vw,13px);color:var(--indigo);
  background:rgba(255,253,246,.95);border-radius:999px;padding:0 9px;white-space:nowrap;margin-top:-6px}
.katori{cursor:grab;transition:transform .18s}
.katori:hover{transform:translateY(-4px)}
.katori.sel{transform:translateY(-6px) scale(1.04)}
.katori.sel img{filter:drop-shadow(0 0 4px #fff) drop-shadow(0 0 14px var(--marigold))}
.katori.ask img{animation:hop .5s ease 2}
.mould{cursor:pointer;transition:transform .22s cubic-bezier(.3,1.5,.5,1),filter .22s}
.mould svg{filter:drop-shadow(0 5px 4px rgba(20,30,60,.28))}
.mould:hover{transform:translateY(-7px) scale(1.04)}
.mould:hover svg{filter:drop-shadow(0 14px 10px rgba(20,30,60,.3))}
.mould.using{opacity:.18;transform:scale(.9)}
.mould.wrong{animation:shake .45s}
.mould.wrong svg{filter:drop-shadow(0 0 10px rgba(200,64,46,.9))}
.flyer{position:fixed;z-index:65;pointer-events:none;transform-origin:0 0}
.flyer svg{width:100%;height:100%;display:block;overflow:visible}
.slot.in{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.plates{position:absolute;inset:8%;display:flex;align-items:center;justify-content:center;gap:4%}
.plates figure{margin:0;display:grid;justify-items:center;gap:6px;width:48%}
.plates svg{width:100%;height:auto;filter:drop-shadow(0 8px 6px rgba(30,20,10,.25))}
.plates figcaption{font-family:var(--display);font-weight:800;font-size:clamp(13px,1.3vw,17px);color:var(--indigo);
  background:#fff;border-radius:999px;padding:2px 12px;white-space:nowrap}
.plates figure{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.plates figure+figure{animation-delay:.15s}

/* ---------- instruction card ---------- */
.card{justify-self:center;width:min(100%,940px);display:flex;align-items:center;gap:14px;background:var(--paper);margin-bottom:6px;
  border-radius:26px;padding:10px 12px 10px 10px;border:2px solid rgba(35,53,111,.14);
  box-shadow:0 12px 28px rgba(20,30,70,.24)}
.guide{position:relative;width:66px;height:66px;flex:0 0 auto;border-radius:50%;background:var(--indigo);
  display:grid;place-items:end center;overflow:visible}
.guide img{height:84px;width:auto;margin-bottom:-2px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.25))}
.guide .spk{position:absolute;right:-6px;bottom:-4px;width:28px;height:28px;border-radius:50%;background:var(--marigold);
  display:grid;place-items:center;color:var(--indigo-ink);box-shadow:0 2px 0 var(--marigold-deep)}
.guide .spk svg{width:16px;height:16px}
.guide.cheer img{animation:hop .5s ease 2}
.guide.hmm img{animation:shake .5s}
.say{flex:1 1 auto;min-width:0;margin:0;font-size:clamp(17px,1.9vw,23px);font-weight:800;line-height:1.3;color:var(--indigo-ink)}
.say .fr{color:var(--tomato)}
.say.bad{color:var(--tomato)}
.say.good{color:var(--leaf)}
.count{font-family:var(--display);font-weight:800;font-size:clamp(20px,2.1vw,26px);color:var(--indigo);background:var(--cream);
  border:2px solid rgba(35,53,111,.18);border-radius:16px;padding:0 16px;font-variant-numeric:tabular-nums;flex:0 0 auto}
.done{flex:0 0 auto;display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;
  font-size:clamp(17px,1.8vw,21px);letter-spacing:.06em;background:var(--marigold);color:var(--indigo-ink);
  border-radius:18px;padding:12px 26px;box-shadow:0 5px 0 var(--marigold-deep);transition:transform .12s,opacity .2s}
.done svg{width:20px;height:20px}
.done:active{transform:translateY(4px);box-shadow:none}
.done[disabled]{opacity:.4;cursor:not-allowed}
.done.ready{animation:ready 1.2s ease-in-out infinite}
@keyframes ready{50%{transform:translateY(-4px);box-shadow:0 9px 0 var(--marigold-deep),0 0 0 6px rgba(242,166,44,.25)}}

.fr{display:inline-grid;vertical-align:middle;text-align:center;line-height:1;font-family:var(--display);font-weight:800;margin:0 .14em}
.fr b{display:block;padding:0 .14em;font-weight:800}
.fr b:first-child{border-bottom:.1em solid currentColor;padding-bottom:.04em}
.fr b:last-child{padding-top:.06em}

.ghost{position:fixed;left:0;top:0;width:90px;height:90px;pointer-events:none;z-index:70}
.ghost img{position:absolute;width:46px;height:46px}
.hand{position:absolute;left:0;top:0;width:60px;height:60px;pointer-events:none;z-index:30}
.fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.fx i{position:absolute;top:-24px;width:16px;height:14px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}

/* ---------- start + end ---------- */
.overlay{position:fixed;inset:0;z-index:90;display:grid;place-items:center;isolation:isolate;overflow:hidden;
  background:#244D25;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.overlay::before{content:"";position:absolute;inset:-40px;z-index:-1;
  background:linear-gradient(rgba(10,32,12,.25),rgba(10,32,12,.45)),url("assets/web/backdrop.webp") center 62%/cover;
  filter:blur(9px) saturate(1.1)}
.start-wrap{display:grid;justify-items:center;gap:18px;width:100%}
.world{position:relative;width:min(100%,calc((100vh - 160px) * 1376 / 768));aspect-ratio:1376/768;border-radius:26px;
  overflow:hidden;container-type:inline-size;box-shadow:0 18px 40px rgba(20,24,60,.38);border:5px solid var(--paper)}
.world>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
.w-sign{position:absolute;left:33.4%;width:34.7%;top:21.9%;height:11.6%;display:flex;align-items:center;justify-content:center;gap:.25em;
  font-family:var(--display);font-weight:800;color:#5C3414;font-size:2.55cqw;white-space:nowrap;text-shadow:0 1px 0 rgba(255,232,196,.7)}
.w-sign img{height:1.4em;width:auto}
.w-billu{position:absolute;left:46%;width:30%;top:34.6%;height:24.2%;clip-path:inset(-120% -60% 0 -60%)}
.w-billu img{position:absolute;top:0;left:50%;height:182%;width:auto;translate:-50% 0;filter:drop-shadow(0 4px 6px rgba(60,30,10,.35))}
.w-noori{position:absolute;left:47.5%;bottom:39.3%;height:17%;translate:-50% 0;transform-origin:50% 100%;animation:sway 3.4s ease-in-out infinite}
.w-noori img{height:100%;width:auto;display:block}
@keyframes sway{0%,100%{rotate:-1.5deg}50%{rotate:1.5deg}}
.w-prop{position:absolute;left:var(--x);bottom:var(--b);width:var(--w);translate:-50% 0}
.w-prop img{width:100%;height:auto;display:block;filter:drop-shadow(0 3px 3px rgba(60,30,10,.3))}

function inPoly(poly,x,y){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const [xi,yi]=poly[i], [xj,yj]=poly[j];
    if(((yi>y)!==(yj>y)) && x < (xj-xi)*(y-yi)/(yj-yi)+xi) inside=!inside;
  }
  return inside;
}
function distToPoly(poly,x,y){
  let best=Infinity;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const [x1,y1]=poly[j], [x2,y2]=poly[i], dx=x2-x1, dy=y2-y1;
    const t=Math.max(0,Math.min(1,((x-x1)*dx+(y-y1)*dy)/(dx*dx+dy*dy||1)));
    best=Math.min(best,Math.hypot(x-(x1+t*dx),y-(y1+t*dy)));
  }
  return best;
}

  const cx=bx+bw/2, cy=by+bh/2, sx=1+2*off/bw, sy=1+2*off/bh;
  return "M"+EDGES[shape].slice(from,to).map(([x,y])=>`${(cx+(x-cx)*sx).toFixed(1)} ${(cy+(y-cy)*sy).toFixed(1)}`).join("L");

const Sound=(()=>{ let ctx=null;
  const ac=()=>{ if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return ctx; };
  function tone(f,t,dur,type,vol){ const c=ac(); if(!c) return; const o=c.createOscillator(), g=c.createGain();
    o.type=type||"triangle"; o.frequency.setValueAtTime(f,c.currentTime+t); g.gain.setValueAtTime(0,c.currentTime+t);
    g.gain.linearRampToValueAtTime(vol||.14,c.currentTime+t+.02); g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t+dur);
    o.connect(g); g.connect(c.destination); o.start(c.currentTime+t); o.stop(c.currentTime+t+dur+.05); }
  return { pick(){tone(760,0,.08,"triangle",.1)}, plop(){tone(440+Math.random()*120,0,.06,"sine",.09)},
    pop(){tone(300,0,.06,"sine",.12)}, tick(i){tone(620+i*40,0,.07,"triangle",.1)},
    cut(){ const c=ac(); if(!c) return; tone(1500,0,.04,"square",.025); tone(1300,.09,.04,"square",.02); },
    thunk(){tone(140,0,.2,"sine",.24);tone(90,.05,.22,"sine",.18)},
    good(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.085,.26,"triangle",.14))},
    bad(){tone(260,0,.18,"sawtooth",.08);tone(190,.13,.26,"sawtooth",.08)},
    win(){[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,i*.1,.45,"triangle",.14))} };
})();
function speak(text){ if(!window.speechSynthesis) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text.replace(/(\d+)\/(\d+)/g,"$1 by $2")); u.rate=.92; speechSynthesis.speak(u); }catch(e){} }

function tween(ms,fn){
  return new Promise(res=>{ const t0=performance.now(), gen=S.gen;
    (function f(now){ if(!live(gen)){ res(); return; }
      const t = S.skip ? 1 : Math.min(1,(now-t0)/ms); fn(t);

const CUTTER = `<g id="cutter"><image href="${HD}pizza_cutter.webp" x="-44" y="-40" width="170" height="83"/>
  <circle class="spin" r="26" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="3" stroke-dasharray="5 9"/></g>`;
async function rollCutter(gen){
  const lines=[...$("cuts").querySelectorAll("line")]; if(!lines.length) return;
  $("over").innerHTML=CUTTER; const cut=$("cutter");
  const per=clamp(8200/lines.length,900,1350);
  let pos={x:690,y:120}, ang=200;
  const place=(x,y,a,s)=>cut.setAttribute("transform",`translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${a.toFixed(1)}) scale(${s})`);
  place(pos.x,pos.y,ang,1.1);
  let lastCrumb=0;
  for(const L of lines){
    if(!live(gen)) return;
    const x1=+L.getAttribute("x1"), y1=+L.getAttribute("y1"), x2=+L.getAttribute("x2"), y2=+L.getAttribute("y2");
    const a=Math.atan2(y2-y1,x2-x1)*180/Math.PI+180, len=Math.hypot(x2-x1,y2-y1);
    const from={...pos}, a0=ang;
    // lift and glide to the start of the next cut
    await tween(520,t=>{ const e=ease(t); place(from.x+(x1-from.x)*e, from.y+(y1-from.y)*e, a0+((a-a0+540)%360-180)*e, 1.1-.1*e); });
    if(!live(gen)) return;
    cut.classList.add("rolling"); Sound.cut();
    // press and roll slowly along the line
    await tween(per,t=>{ const e=ease(t), x=x1+(x2-x1)*e, y=y1+(y2-y1)*e;
      place(x,y,a,1); L.setAttribute("stroke-dashoffset",(len*(1-e)).toFixed(1));
      const now=performance.now(); if(!S.skip && now-lastCrumb>70 && t>.05 && t<.98){ lastCrumb=now; crumb(x,y); } });
    cut.classList.remove("rolling");
    pos={x:x2,y:y2}; ang=a;
    if(!S.skip) await wait(180);
  }
  if(!live(gen)) return;
  const from={...pos};
  await tween(500,t=>{ const e=ease(t); place(from.x+(700-from.x)*e, from.y+(-80-from.y)*e, ang, 1+.1*e); });
  lines.forEach(L=>L.setAttribute("stroke-dashoffset",0));
  $("over").innerHTML="";
}

  const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
  c.setAttribute("cx",x.toFixed(1)); c.setAttribute("cy",y.toFixed(1)); c.setAttribute("r",(2+Math.random()*3).toFixed(1));

}

/* A bowl filled to the brim: the topping covers the whole opening inside the coconut lip,
   mounded a little in the middle, its edge tucked under the lip with a soft shadow

const HEAP_SIZE={tomato:.56, mushroom:.5, corn:.3, onion:.5};
function heapSVG(k, b, box){
  const rnd=rng(k.length*97+k.charCodeAt(1)*7), ix=b.ix, iy=b.iy, s=ix*HEAP_SIZE[k];
  const step=s*(k==="onion"?.42:.56), pts=[];
  for(let y=-iy-s*.3, row=0; y<=iy+s*.3; y+=step*.6, row++){
    for(let x=-ix-s*.3+(row%2)*step/2; x<=ix+s*.3; x+=step){

      const d=(px/ix)**2+(py/iy)**2; if(d>1.15) continue;          // reach right under the lip
      const lift=Math.max(0,1-d)*iy*.16;                             // gentle mound in the middle
      pts.push({x:b.cx+px, y:b.cy+py-lift, s:s*(.9+rnd()*.2), r:rnd()*360});
    }
  }
  pts.sort((p,q)=>p.y-q.y);
  const id="hp"+k;
  const pile=pts.map(q=>`<g transform="translate(${q.x.toFixed(1)} ${q.y.toFixed(1)}) scale(1 .8) rotate(${q.r.toFixed(0)})">

  return `<svg viewBox="${box.x} ${box.y} ${box.w} ${box.h}" aria-hidden="true">

function startLevel(lv){ S.lv=lv; S.i=0; S.stars=0; S.done=[]; S.hinted=false; $("start").hidden=true; $("end").hidden=true; loadOrder(); }
function jumpTo(lv,i){ if(lv!==S.lv){ S.lv=lv; S.stars=0; S.done=[]; } S.i=i; $("start").hidden=true; $("end").hidden=true; loadOrder(); }

async function loadOrder(){
  const o=cur(), gen=++S.gen;
  clearPlateScene();
  document.querySelectorAll(".flyer").forEach(f=>f.remove());
  hideHint(); S.tries=0; S.covered=new Map(); S.topping=null; S.busy=true; S.skip=false;
  renderTop(); showCustomer(); boardFx("in");
  if(!LEVELS[S.lv].cut){
    S.k=o.d; S.phase="cutting"; G=geom(o.shape,S.k); renderWhole(false); showKatoris();
    say(`Cutting the pizza into ${o.d} equal ${pieceName(o).toLowerCase()}…`); setDone("done",false); setCount();
    await wait(1100); if(!live(gen)) return;
    await rollCutter(gen); if(!live(gen)) return;
    await split(gen); if(!live(gen)) return;
    say(`${o.d} equal ${pieceName(o).toLowerCase()}!`, "good");
    await countParts(gen); if(!live(gen)) return;
    beginTopping();
  } else {
    S.k=1; S.phase="mould"; G=geom(o.shape,1); renderWhole(true); showMoulds();
    say("Pick the mould that cuts this pizza for the order."); setDone("done",false); setCount();
    S.busy=false;
  }
}
function beginTopping(){
  const o=cur(); S.phase="top"; S.busy=false;
  say(`Cover ${o.n}/${o.d} of the pizza with the topping.`); setDone("done",false); setCount();
  if(S.i===0 && !S.hinted) setTimeout(showHint,400);
}

/* ---------- moulds (1.2): lift off the thali, arc over, press, cut, fly home ---------- */
async function useMould(k,btn){
  if(S.phase!=="mould"||S.busy) return;
  S.busy=true; const o=cur(), gen=S.gen;
  say(`Using the ${k}-part mould…`);
  const art=btn.querySelector("svg").getBoundingClientRect(), to=PZ.getBoundingClientRect();
  // the button's svg has a 30-unit margin round the 600 box; find where the 600 box sits on screen
  const u=art.width/660, from={left:art.left+30*u, top:art.top+30*u, width:600*u, height:600*u};
  const W=to.width, H=to.height;
  const T=(cx,cy,sx,sy)=>{ sy=sy??sx; return `translate(${(cx+(1-sx)*W/2).toFixed(1)}px,${(cy+(1-sy)*H/2).toFixed(1)}px) scale(${sx.toFixed(4)},${sy.toFixed(4)})`; };
  const home=[(from.left+from.width/2)-(to.left+W/2), (from.top+from.height/2)-(to.top+H/2), from.width/W];
  const fly=document.createElement("div"); fly.className="flyer";
  Object.assign(fly.style,{left:to.left+"px",top:to.top+"px",width:W+"px",height:H+"px"});
  fly.innerHTML=`<svg viewBox="0 0 600 600" aria-hidden="true">${mouldInner(o.shape,k,"fl",false)}</svg>`;
  document.body.appendChild(fly); btn.classList.add("using");
  const sh=(y,b,a)=>`drop-shadow(0 ${y}px ${b}px rgba(20,30,60,${a}))`;
  const go=(kf,ms,ez)=>settle(fly.animate(kf,{duration:ms,easing:ez,fill:"forwards"}));

  // 1. lift off the thali and arc over to the pizza
  await go([
    {transform:T(home[0],home[1],home[2]), filter:sh(5,4,.3)},
    {transform:T(home[0],home[1]-26,home[2]*1.12), filter:sh(20,14,.28), offset:.2},
    {transform:T(home[0]*.42,Math.min(home[1],0)-110,(home[2]+1)/2*1.1), filter:sh(44,26,.22), offset:.62},
    {transform:T(0,-52,1.07), filter:sh(52,30,.22)}], 1250, "cubic-bezier(.45,0,.3,1)");
  if(!live(gen)) return fly.remove();
  await wait(220); if(!live(gen)) return fly.remove();
  // 2. come down and press
  await go([{transform:T(0,-52,1.07), filter:sh(52,30,.22)},{transform:T(0,0,1), filter:sh(6,5,.38)}], 460, "cubic-bezier(.55,0,.8,.2)");
  if(!live(gen)) return fly.remove();
  Sound.thunk(); boardFx("thud");
  const squash=go([{transform:T(0,0,1)},{transform:T(0,5,1.012,.972)},{transform:T(0,0,1)}], 420, "ease-in-out");
  S.k=k; G=geom(o.shape,k); renderWhole(false);
  Sound.cut();
  const lines=[...$("cuts").querySelectorAll("line")];
  lines.forEach(L=>{ const x1=+L.getAttribute("x1"), y1=+L.getAttribute("y1"), x2=+L.getAttribute("x2"), y2=+L.getAttribute("y2");
    for(let q=1;q<=7;q++){ const t=q/8; setTimeout(()=>{ if(live(gen)) crumb(x1+(x2-x1)*t, y1+(y2-y1)*t); }, q*60); } });
  await Promise.all([squash, ...lines.map(L=>{ const len=+L.getAttribute("stroke-dasharray");
    return settle(L.animate([{strokeDashoffset:len},{strokeDashoffset:0}],{duration:850,easing:"ease-in-out",fill:"forwards"})); })]);
  lines.forEach(L=>L.setAttribute("stroke-dashoffset",0));
  if(!live(gen)) return fly.remove();
  await wait(300); if(!live(gen)) return fly.remove();
  // 3. lift and fly back to its place on the thali
  await go([{transform:T(0,0,1), filter:sh(6,5,.38)},{transform:T(0,-56,1.07), filter:sh(52,30,.22), offset:.3},
            {transform:T(home[0],home[1],home[2]), filter:sh(5,4,.3)}], 1100, "cubic-bezier(.45,0,.3,1)");
  fly.remove(); btn.classList.remove("using");
  if(!live(gen)) return;
  await split(gen); if(!live(gen)) return;
  if(k===o.d){
    say(`${o.d} equal ${pieceName(o,k).toLowerCase()}!`,"good"); Sound.good(); guideMood("cheer");
    await countParts(gen); if(!live(gen)) return;
    showKatoris(); beginTopping();
  } else {
    S.tries++; Sound.bad(); btn.classList.add("wrong"); custMood("sad"); guideMood("hmm");
    PZ.classList.add("bad"); boardFx("wiggle");
    say("Hmm, is that how many parts the order needs? Try again.","bad");
    await wait(1600); if(!live(gen)) return;
    btn.classList.remove("wrong"); PZ.classList.remove("bad");
    PZ.querySelectorAll(".part").forEach(p=>p.style.transform="none");      // the pieces close up again
    await wait(700); if(!live(gen)) return;
    S.k=1; G=geom(o.shape,1); renderWhole(true); boardFx("in");               // a fresh whole pizza
    say("Pick the mould that cuts this pizza for the order."); S.busy=false;
  }
}

/* ---------- toppings: drag a katori onto a slice, or pick one and tap slices ---------- */
let drag=null;
function pickTopping(k){ S.topping=k; Sound.pick();
  document.querySelectorAll(".katori").forEach(b=>b.classList.toggle("sel",b.dataset.top===k)); }
function startDrag(e,kind){
  if(S.phase!=="top"||S.busy) return;
  e.preventDefault(); hideHint();
  drag={kind,x:e.clientX,y:e.clientY,moved:false,ghost:null,over:null};
  window.addEventListener("pointermove",moveDrag);
  window.addEventListener("pointerup",endDrag,{once:true});
  window.addEventListener("pointercancel",endDrag,{once:true});
}
function hitAt(x,y){ const el=document.elementFromPoint(x,y); return el&&el.classList&&el.classList.contains("hit")?el:null; }
function moveDrag(e){
  if(!drag) return;
  if(!drag.moved && Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8){
    drag.moved=true;
    const gh=document.createElement("div"); gh.className="ghost";
    gh.innerHTML=[[22,18,0],[44,32,40],[24,44,110],[6,30,200]].map(([x,y,r])=>`<img src="${A}piece_${drag.kind}.webp" alt="" style="left:${x}px;top:${y}px;rotate:${r}deg">`).join("");
    document.body.appendChild(gh); drag.ghost=gh; pickTopping(drag.kind);
  }
  if(drag.moved){
    drag.ghost.style.transform=`translate(${e.clientX-45}px,${e.clientY-62}px)`;
    const h=hitAt(e.clientX,e.clientY);
    if(h!==drag.over){ if(drag.over) drag.over.classList.remove("hov"); if(h) h.classList.add("hov"); drag.over=h; }
  }
}
function endDrag(e){
  window.removeEventListener("pointermove",moveDrag);
  if(!drag) return; const d=drag; drag=null;
  if(d.ghost) d.ghost.remove(); if(d.over) d.over.classList.remove("hov");
  if(!d.moved){ pickTopping(d.kind); say(`Now tap the ${pieceName(cur()).toLowerCase()} to add ${TOPPINGS.find(t=>t.k===d.kind).name.toLowerCase()}.`); return; }
  const h=d.over||hitAt(e.clientX,e.clientY);
  if(h) cover(+h.dataset.i,d.kind,toSvg(e.clientX,e.clientY));
}
function toSvg(x,y){ const m=PZ.getScreenCTM(); return m ? new DOMPoint(x,y).matrixTransform(m.inverse()) : null; }

/* toppings spread out from where they were dropped, one piece after another */
function cover(i,kind,drop){
  if(S.phase!=="top"||S.busy) return;
  const p=G.parts[i], off=S.off[i]||{x:0,y:0};
  const from = drop ? {x:drop.x-off.x, y:drop.y-off.y} : {x:p.cx, y:p.cy};
  S.covered.set(i,kind);
  const g=partEl(i).querySelector(".tops");
  g.innerHTML=piecesSVG(G,i,S.k,kind,false);
  const pts=piecesFor(G,i,S.k), imgs=[...g.querySelectorAll(".pc")];
  const order=pts.map((q,j)=>[j,Math.hypot(q.x-from.x,q.y-from.y)]).sort((a,b)=>a[1]-b[1]);
  order.forEach(([j],rank)=>{
    const q=pts[j], dx=from.x-q.x, dy=from.y-q.y, rot=q.rot.toFixed(0);
    imgs[j].animate([
      {transform:`translate(${dx}px,${dy}px) rotate(0deg) scale(.15)`,opacity:0},
      {opacity:1,offset:.2},
      {transform:`translate(0px,0px) rotate(${rot*1.1}deg) scale(1.18)`,offset:.72},
      {transform:`translate(0px,0px) rotate(${rot}deg) scale(1)`,opacity:1}],
      {duration:780,delay:rank*55,easing:"cubic-bezier(.25,.8,.35,1)",fill:"both"});
    if(rank%3===0) setTimeout(()=>Sound.plop(), rank*55+300);
  });
  hideHint(); afterChange();
}
function uncover(i){
  const g=partEl(i).querySelector(".tops");
  const anims=[...g.querySelectorAll(".pc")].map((im,j)=>settle(im.animate([{opacity:1},{transform:"scale(0)",opacity:0}],{duration:260,delay:j*8,fill:"forwards"})));
  S.covered.delete(i); Sound.pop(); afterChange();
  Promise.all(anims).then(()=>{ if(!S.covered.has(i)) g.innerHTML=""; });
}
function afterChange(){
  const o=cur(); setCount(); setDone("done",S.covered.size>0,S.covered.size===o.n);
  if(/^(Is that|Pick a topping|Now tap)/.test(S.sayPlain)) say(`Cover ${o.n}/${o.d} of the pizza with the topping.`);
}
PZ.addEventListener("click",e=>{
  const h=e.target.closest&&e.target.closest(".hit");
  if(!h||S.phase!=="top"||S.busy) return;
  const i=+h.dataset.i;
  if(S.covered.has(i)){ uncover(i); return; }
  if(!S.topping){ say("Pick a topping first: drag a bowl onto a slice.");
    document.querySelectorAll(".katori").forEach(b=>{ b.classList.remove("ask"); void b.offsetWidth; b.classList.add("ask"); }); return; }
  cover(i,S.topping,toSvg(e.clientX,e.clientY));
});
PZ.addEventListener("pointerdown",()=>{ if(S.phase==="cutting") S.skip=true; });

/* ---------- serve or try again ---------- */
$("done").addEventListener("click",()=>{
  if(S.phase==="served"){ if(!S.busy) next(); return; }
  if(S.phase!=="top"||S.busy||!S.covered.size) return;
  S.covered.size===cur().n ? serve() : miss();
});
async function miss(){
  const o=cur(), gen=S.gen;
  S.tries++; S.busy=true; Sound.bad(); guideMood("hmm"); custMood("sad");
  say(`Is that how much ${custWho(o)} ${o.who?"want":"wants"}? Try again.`,"bad");
  S.covered.forEach((_,i)=>partEl(i).querySelector(".hit").classList.add("bad"));
  boardFx("wiggle"); setDone("done",false);
  await wait(1000); if(!live(gen)) return;
  const anims=[];
  S.covered.forEach((_,i)=>partEl(i).querySelectorAll(".pc").forEach((im,j)=>anims.push(settle(im.animate(
    [{opacity:1},{transform:`translate(${((Math.random()-.5)*40).toFixed(0)}px,70px) rotate(160deg) scale(.4)`,opacity:0}],
    {duration:520,delay:j*14,easing:"ease-in",fill:"forwards"})))));
  await Promise.all(anims); if(!live(gen)) return;
  S.covered.forEach((_,i)=>{ const p=partEl(i); p.querySelector(".tops").innerHTML=""; p.querySelector(".hit").classList.remove("bad"); });
  S.covered.clear(); S.busy=false; setCount();
}
async function serve(){
  const o=cur(), gen=S.gen, first=S.tries===0;
  S.phase="served"; S.busy=true; S.done[S.i]=true; if(first) S.stars++;
  const t=TOPPINGS.find(x=>x.k===[...S.covered.values()][0]).name.toLowerCase();
  Sound.good(); guideMood("cheer"); setDone("next",false); $("count").hidden=true;
  say(`${custName(o)}: “${o.ok.replace("{t}",t)}”${first?" ⭐":""}`,"good");
  await plateScene(gen); if(!live(gen)) return;
  confetti(); renderTop();
  S.busy=false; setDone("next",true,true);
}
/* After a correct serve: the receipt and toppings step away, two wooden plates slide in,
   the topped parts glide onto the Served plate and the rest onto the Left plate,
   each keeping its place in the pizza so the gap shows exactly what was taken. */
async function plateScene(gen){
  const o=cur(), st=$("stage");
  st.classList.add("serving"); hideHint();
  const layer=document.createElement("div"); layer.className="servelayer";
  layer.innerHTML=`
    <figure class="a"><img src="assets/draft2/plate_wood.svg" alt=""><figcaption>Served ${fracify(o.n+"/"+o.d)}</figcaption></figure>
    <figure class="b"><img src="assets/draft2/plate_wood.svg" alt=""><figcaption>Left ${fracify((o.d-o.n)+"/"+o.d)}</figcaption></figure>`;
  // plates as big as the table allows: leave room for the label underneath
  const ph=Math.max(160, Math.min(st.clientHeight-96, st.clientWidth*.36*630/600));
  layer.style.setProperty("--ph", ph+"px");
  st.appendChild(layer);
  // measure the plates only once they have loaded and finished sliding in
  await Promise.all([...layer.querySelectorAll("img")].map(im=>im.decode().catch(()=>{})));
  layer.getBoundingClientRect();
  await wait(60);
  await Promise.all(layer.getAnimations({subtree:true}).map(settle));
  await wait(120); if(!live(gen)) return;
  const m=PZ.getScreenCTM(); if(!m) return;
  const inv=m.inverse(), unit=PZ.getBoundingClientRect().width/600;
  // where each plate comes to rest, from its figure's layout box (the figure never animates,
  // only the image inside slides in), so the result does not depend on animation timing
  const target=fig=>{
    const r=fig.getBoundingClientRect(), w=ph*600/630;
    const c=new DOMPoint(r.left+r.width/2, r.top+ph*302/630).matrixTransform(inv);   // centre of the plate's well
    return {x:c.x, y:c.y, k:(w*.74)/(564*unit), well:w*240/600};                     // well radius in screen px
  };
  const A_=target(layer.querySelector(".a")), B_=target(layer.querySelector(".b"));
  B_.k=A_.k=Math.min(A_.k,B_.k);
  const served=new Set(S.covered.keys());
  // centre each group of pieces on its plate (same scale on both plates, so sizes still compare)
  const centreOf=ids=>{
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    ids.forEach(i=>{ const bb=partEl(i).querySelector(".hit").getBBox(), o=S.off[i]||{x:0,y:0};
      x0=Math.min(x0,bb.x+o.x*.5); y0=Math.min(y0,bb.y+o.y*.5);
      x1=Math.max(x1,bb.x+bb.width+o.x*.5); y1=Math.max(y1,bb.y+bb.height+o.y*.5); });
    return {x:(x0+x1)/2, y:(y0+y1)/2};
  };
  const ids=G.parts.map((_,i)=>i);
  const idsA=ids.filter(i=>served.has(i)), idsB=ids.filter(i=>!served.has(i));
  const cA=centreOf(idsA), cB=centreOf(idsB);
  // how far a group reaches from its centre, traced along the real piece outlines
  const reach=(group,c)=>{ let m=0;
    group.forEach(i=>{ const h=partEl(i).querySelector(".hit"), L=h.getTotalLength(), o=S.off[i]||{x:0,y:0};
      for(let t=0;t<=48;t++){ const q=h.getPointAtLength(L*t/48); m=Math.max(m,Math.hypot(q.x+o.x*.5-c.x,q.y+o.y*.5-c.y)); } });
    return m; };
  // one scale for both plates, small enough that each group sits inside its plate's well
  const fit=(T,group,c)=>T.well*.92/(reach(group,c)*unit);
  A_.k=B_.k=Math.min(A_.k, fit(A_,idsA,cA), fit(B_,idsB,cB));
  // drive the SVG transform attribute directly (CSS transforms on SVG groups can be drawn
  // somewhere other than where they are measured, which knocked the pieces off-centre)
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  const lerp=(a,b,t)=>a+(b-a)*t;
  await Promise.all(G.parts.map((p,i)=>new Promise(done=>{
    const el=partEl(i), off=S.off[i]||{x:0,y:0}, T=served.has(i)?A_:B_, k=T.k, c=served.has(i)?cA:cB;
    el.style.removeProperty("transform"); el.style.transition="none";
    if(served.has(i)) el.parentNode.appendChild(el);                 // served pieces travel on top
    // keyframes as [offset, x, y, scale] for translate(x y) scale(s)
    const fx=T.x-c.x*k+off.x*.5*k, fy=T.y-c.y*k+off.y*.5*k, lift=served.has(i)?-120:-50;
    const K=[[0,off.x,off.y,1],[.18,off.x,off.y-24,1.04],[.58,(fx+off.x)/2,(fy+off.y)/2+lift,(1+k)/2],[1,fx,fy,k]];
    const set=(x,y,sc)=>el.setAttribute("transform",`translate(${x.toFixed(2)} ${y.toFixed(2)}) scale(${sc.toFixed(4)})`);
    set(off.x,off.y,1);
    const delay=(served.has(i)?0:260)+i*40, dur=1500, t0=performance.now()+delay;
    (function f(now){
      if(!live(gen)){ done(); return; }
      const t=Math.min(1,Math.max(0,(now-t0)/dur)), e=ease(t);
      let j=1; while(j<K.length-1 && K[j][0]<e) j++;
      const A=K[j-1], B=K[j], u=(e-A[0])/(B[0]-A[0]||1);
      set(lerp(A[1],B[1],u),lerp(A[2],B[2],u),lerp(A[3],B[3],u));
      if(t<1) requestAnimationFrame(f); else done();
    })(performance.now());
    setTimeout(()=>{ if(live(gen)) set(fx,fy,k); done(); }, delay+dur+400);   // never stall in a throttled tab
  })));
  if(!live(gen)) return;
  layer.classList.add("show");
  await wait(500);
}
function clearPlateScene(){
  $("stage").classList.remove("serving");
  document.querySelectorAll(".servelayer").forEach(e=>e.remove());
}
/* the topped slices lift, arc through the air and land with the customer */
async function flyToCustomer(gen){
  const served=[...S.covered.keys()], m=PZ.getScreenCTM(), who=$("who").getBoundingClientRect();
  const target = m ? new DOMPoint(who.left+who.width/2, who.top+who.height*.55).matrixTransform(m.inverse()) : {x:-420,y:300};
  await Promise.all(served.map((i,k)=>{
    const el=partEl(i), p=G.parts[i], off=S.off[i];
    el.classList.add("lifted"); el.style.transformOrigin=`${p.cx}px ${p.cy}px`; el.style.transition="none";
    el.parentNode.appendChild(el);
    const tx=target.x-p.cx, ty=target.y-p.cy, mx=(off.x+tx)/2, my=Math.min(off.y,ty)-170;
    return settle(el.animate([
      {transform:`translate(${off.x}px,${off.y}px) scale(1)`},
      {transform:`translate(${off.x}px,${off.y-22}px) scale(1.08)`,offset:.2},
      {transform:`translate(${mx}px,${my}px) scale(.6)`,offset:.62},
      {transform:`translate(${tx}px,${ty}px) scale(.18)`,opacity:0}],
      {duration:1500,delay:k*110,easing:"cubic-bezier(.45,0,.35,1)",fill:"forwards"}));
  }));
}
function next(){ S.i++; if(S.i>=LEVELS[S.lv].orders.length){ showEnd(); return; } loadOrder(); }

/* ---------- hint, confetti, end ---------- */
let hintAnim=null;
function showHint(){
  if(S.phase!=="top"||S.covered.size||S.hinted) return;
  const hand=$("hand"), st=$("stage").getBoundingClientRect(), k=$("slots").querySelector(".katori"); if(!k) return;
  const b=k.getBoundingClientRect(), m=PZ.getScreenCTM(); if(!m) return;
  const p=G.parts[0], off=S.off[0]||{x:0,y:0}, pt=new DOMPoint(p.cx+off.x,p.cy+off.y).matrixTransform(m);
  const f=[b.left+b.width/2-st.left-14,b.top+b.height/2-st.top-6], t=[pt.x-st.left-14,pt.y-st.top-6];
  hand.hidden=false;
  hintAnim=hand.animate([{transform:`translate(${f[0]}px,${f[1]}px)`,opacity:0},{transform:`translate(${f[0]}px,${f[1]}px) scale(.88)`,opacity:1,offset:.15},
    {transform:`translate(${t[0]}px,${t[1]}px) scale(.88)`,opacity:1,offset:.7},{transform:`translate(${t[0]}px,${t[1]}px)`,opacity:0}],
    {duration:2100,iterations:Infinity,easing:"ease-in-out"});
}
function hideHint(){ if(S.phase==="top") S.hinted=true; if(hintAnim){ hintAnim.cancel(); hintAnim=null; } $("hand").hidden=true; }
function confetti(){
  const fx=$("fx"), cols=["#F2A62C","#FBD584","#C8402E","#3A55A0","#3F8A3C","#FFF2C8"];
  for(let i=0;i<60;i++){ const s=document.createElement("i");
    s.style.left=Math.random()*100+"%"; s.style.background=cols[i%cols.length];
    s.style.clipPath=i%3?"polygon(50% 0,100% 100%,0 100%)":"circle(50%)";
    s.style.animationDelay=(Math.random()*.35)+"s"; s.style.animationDuration=(1.3+Math.random()*.9)+"s";
    fx.appendChild(s); setTimeout(()=>s.remove(),2600); }
}
function showEnd(){
  const L=LEVELS[S.lv], crowd=L.orders.flatMap(o=>[o.cust].concat(o.duo?[o.duo]:[]));
  $("endcard").innerHTML=`<h2>${L.end[0]}</h2>
    <div class="crowd">${crowd.map((k,i)=>`<img src="${A}${k}.webp" alt="${NAMES[k]}" style="animation-delay:${i*90}ms">`).join("")}</div>
    <div class="hosts"><img src="${A}billu_happy.webp" alt="Chef Billu cheering"><img src="${A}noori_point.webp" alt="Noori"></div>
    <p>${L.end[1]}</p><div class="bigstars">⭐ ${S.stars} / ${L.orders.length}</div>
    <div class="endbtns">${S.lv==="1.1"?`<button class="done" id="goNext">LEVEL 1.2 ${ARROW}</button>`:""}
      ${S.lv==="1.2"?`<button class="done" id="goL2">LEVEL 2 ${ARROW}</button>`:""}
      <button class="done alt" id="again">PLAY AGAIN</button>${S.lv==="1.2"?`<button class="done alt" id="goOther">LEVEL 1.1</button>`:""}</div>`;
  $("end").hidden=false; S.gen++; Sound.win(); speak(L.end.join(" "));
  const n=$("goNext"), g=$("goOther"), l2=$("goL2"); if(n) n.onclick=()=>startLevel("1.2"); if(g) g.onclick=()=>startLevel("1.1");
  if(l2) l2.onclick=()=>goLevel2();
  $("again").onclick=()=>startLevel(S.lv);
}

/* ---------- wiring ---------- */
$("guide").addEventListener("click",()=>speak(S.sayPlain));
$("home").addEventListener("click",()=>{ hideHint(); S.gen++; $("end").hidden=true; $("start").hidden=false; S.phase="idle"; });
/* Level 2 is the next page of the same game: level2/ next to this page */
function goLevel2(){ location.href=new URL("level2/index.html#play",location.href).href; }
document.querySelectorAll(".lvbtn").forEach(b=>b.addEventListener("click",()=>b.dataset.go==="level2"?goLevel2():startLevel(b.dataset.lv)));
$("jump").innerHTML=Object.entries(LEVELS).map(([lv,L])=>`<optgroup label="Level ${lv} · ${L.title}">${L.orders.map((o,i)=>
  `<option value="${lv}:${i}">Level ${lv} · ${i+1}. ${custName(o)} · ${o.n}/${o.d}</option>`).join("")}</optgroup>`).join("")
  +`<optgroup label="Level 2 · Big Eater Contest"><option value="L2">Level 2 · Big Eater Contest ▸</option></optgroup>`;
$("jump").addEventListener("change",e=>{ if(e.target.value==="L2"){ goLevel2(); return; }
  const [lv,i]=e.target.value.split(":"); jumpTo(lv,+i); e.target.blur(); });
/* arriving from Level 2 with #1.1 or #1.2 starts that level straight away */
if(/^#1\.[12]$/.test(location.hash)) startLevel(location.hash.slice(1));
$("ic11").innerHTML=miniPizza("round",4,null,[[0,"tomato"],[1,"tomato"],[2,"tomato"]]);
$("ic12").innerHTML=mouldInner("square",4,"ic",true);
$("ic12").setAttribute("viewBox","-30 -30 660 660");
[...new Set(Object.values(LEVELS).flatMap(L=>L.orders.flatMap(o=>[o.cust].concat(o.duo?[o.duo]:[]))))].map(k=>A+k+".webp")
  .concat(TOPPINGS.map(t=>A+"piece_"+t.k+".webp"))
  .concat(["pizza_round","pizza_square_sharp","pizza_rect_sharp","pizza_cutter"].map(n=>HD+n+".webp"))
  .forEach(src=>{ const im=new Image(); im.src=src; });

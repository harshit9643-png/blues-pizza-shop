<svg xmlns="http://www.w3.org/2000/svg" width="600" height="630" viewBox="0 0 600 630">
  <!-- flat white plate (supplied design): a thin grey outer edge, a broad flat rim, a softly shaded well and a dashed
       yellow ring. Centre (300,302); the well's radius is 240, as the game measures it. -->
  <defs>
    <radialGradient id="rim" cx=".42" cy=".38" r=".75">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".75" stop-color="#FBFAF8"/><stop offset="1" stop-color="#EFEDE9"/>
    </radialGradient>
    <radialGradient id="well" cx=".46" cy=".42" r=".62">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".7" stop-color="#FAF9F7"/><stop offset="1" stop-color="#ECEAE6"/>
    </radialGradient>
    <linearGradient id="step" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4E2DD"/><stop offset="1" stop-color="#F2F1EE"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <ellipse cx="300" cy="318" rx="286" ry="282" fill="#3A2A18" opacity=".22" filter="url(#soft)"/>
  <circle cx="300" cy="302" r="291" fill="#B9B4AB"/>
  <circle cx="300" cy="300" r="286" fill="url(#rim)"/>
  <circle cx="300" cy="302" r="242" fill="url(#step)"/>
  <circle cx="300" cy="304" r="230" fill="url(#well)"/>
  <circle cx="300" cy="302" r="196" fill="none" stroke="#F6E08E" stroke-width="7" stroke-dasharray="22 15" stroke-linecap="round"/>
</svg>

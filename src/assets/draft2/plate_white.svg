<svg xmlns="http://www.w3.org/2000/svg" width="600" height="630" viewBox="0 0 600 630">
  <!-- 3D white porcelain plate, same shape as plate_wood.svg: thick side, raised glazed rim,
       a recessed well with a soft cool inner shadow and a glossy sheen. The well is a touch
       greyer than the rim so the steel cutters and topping bowls still stand out on it. -->
  <defs>
    <radialGradient id="rim" cx=".38" cy=".3" r=".85">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#F4F2EE"/><stop offset="1" stop-color="#D9D6D0"/>
    </radialGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9C5BE"/><stop offset="1" stop-color="#A39E96"/>
    </linearGradient>
    <radialGradient id="well" cx=".42" cy=".36" r=".72">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".65" stop-color="#F1EFEB"/><stop offset="1" stop-color="#DEDAD4"/>
    </radialGradient>
    <radialGradient id="inshadow" cx=".5" cy=".5" r=".5">
      <stop offset=".78" stop-color="#6E6A64" stop-opacity="0"/><stop offset="1" stop-color="#6E6A64" stop-opacity=".32"/>
    </radialGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".1"/>
      <stop offset="1" stop-color="#8E8A84" stop-opacity=".35"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <ellipse cx="304" cy="330" rx="282" ry="276" fill="#3A1A10" opacity=".35" filter="url(#blur)"/>
  <!-- thickness -->
  <circle cx="300" cy="318" r="290" fill="url(#side)"/>
  <!-- rim -->
  <circle cx="300" cy="298" r="290" fill="url(#rim)"/>
  <circle cx="300" cy="298" r="282" fill="none" stroke="url(#bevel)" stroke-width="14"/>
  <!-- well, sunk below the rim -->
  <circle cx="300" cy="300" r="246" fill="#BDB8B0" opacity=".6"/>
  <circle cx="300" cy="302" r="240" fill="url(#well)"/>
  <circle cx="300" cy="302" r="240" fill="url(#inshadow)"/>
  <!-- light catching the lower lip of the well, glossy glaze on the rim -->
  <path d="M110 430a240 240 0 0 0 380 0" fill="none" stroke="#FFFFFF" stroke-opacity=".9" stroke-width="4" stroke-linecap="round"/>
  <path d="M110 150a280 280 0 0 1 150 -112" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
  <path d="M520 420a270 270 0 0 1 -60 70" fill="none" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="6" stroke-linecap="round"/>
  <circle cx="300" cy="298" r="290" fill="none" stroke="#9C978F" stroke-opacity=".8" stroke-width="3"/>
</svg>

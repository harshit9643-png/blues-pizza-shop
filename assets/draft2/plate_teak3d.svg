<svg xmlns="http://www.w3.org/2000/svg" width="600" height="630" viewBox="0 0 600 630">
  <!-- 3D turned teak tray: thick side, raised bevelled rim, a recessed well with an
       inner shadow, grain and a soft sheen. Mid-tone wood so steel cutters and the
       white coconut lips stand out. -->
  <defs>
    <radialGradient id="rim" cx=".38" cy=".3" r=".85">
      <stop offset="0" stop-color="#E2AE6C"/><stop offset=".55" stop-color="#C08043"/><stop offset="1" stop-color="#9A5E2B"/>
    </radialGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A4620"/><stop offset="1" stop-color="#4E2A10"/>
    </linearGradient>
    <radialGradient id="well" cx=".42" cy=".36" r=".72">
      <stop offset="0" stop-color="#D59A5B"/><stop offset=".65" stop-color="#BC7E43"/><stop offset="1" stop-color="#93592A"/>
    </radialGradient>
    <radialGradient id="inshadow" cx=".5" cy=".5" r=".5">
      <stop offset=".8" stop-color="#3A1D08" stop-opacity="0"/><stop offset="1" stop-color="#3A1D08" stop-opacity=".45"/>
    </radialGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF1D8" stop-opacity=".75"/><stop offset=".5" stop-color="#FFF1D8" stop-opacity=".05"/>
      <stop offset="1" stop-color="#2B1404" stop-opacity=".45"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="ringclip"><path d="M300 8a290 290 0 1 1 -.1 0zM300 58a240 240 0 1 0 .1 0z" clip-rule="evenodd" fill-rule="evenodd"/></clipPath>
    <clipPath id="wellclip"><circle cx="300" cy="298" r="240"/></clipPath>
  </defs>

  <ellipse cx="304" cy="330" rx="282" ry="276" fill="#2B1404" opacity=".42" filter="url(#blur)"/>
  <!-- thickness -->
  <circle cx="300" cy="318" r="290" fill="url(#side)"/>
  <!-- rim -->
  <circle cx="300" cy="298" r="290" fill="url(#rim)"/>
  <g clip-path="url(#ringclip)" fill="none" stroke="#7E4A1F" stroke-opacity=".28" stroke-width="2.5" stroke-linecap="round">
    <path d="M30 140c150 40 400 -30 540 20M14 250c190 34 380 -26 572 8M10 360c200 30 390 -24 580 6M30 470c170 26 390 -18 544 12"/>
  </g>
  <circle cx="300" cy="298" r="282" fill="none" stroke="url(#bevel)" stroke-width="14"/>
  <!-- well, sunk below the rim -->
  <circle cx="300" cy="300" r="244" fill="#5A3212" opacity=".55"/>
  <circle cx="300" cy="302" r="240" fill="url(#well)"/>
  <g clip-path="url(#wellclip)" fill="none" stroke="#7E4A1F" stroke-width="2.2">
    <circle cx="300" cy="302" r="70" stroke-opacity=".22"/><circle cx="300" cy="302" r="118" stroke-opacity=".2"/>
    <circle cx="300" cy="302" r="165" stroke-opacity=".18"/><circle cx="300" cy="302" r="208" stroke-opacity=".18"/>
    <path d="M70 220c150 30 320 -20 460 4M64 380c170 26 330 -16 472 6" stroke-opacity=".18"/>
  </g>
  <circle cx="300" cy="302" r="240" fill="url(#inshadow)"/>
  <!-- light catching the lower lip of the well, sheen on the rim -->
  <path d="M110 430a240 240 0 0 0 380 0" fill="none" stroke="#FFE2B8" stroke-opacity=".45" stroke-width="4" stroke-linecap="round"/>
  <path d="M110 150a280 280 0 0 1 150 -112" fill="none" stroke="#FFF4E0" stroke-opacity=".8" stroke-width="10" stroke-linecap="round"/>
  <circle cx="300" cy="298" r="290" fill="none" stroke="#4A2710" stroke-opacity=".75" stroke-width="3"/>
</svg>

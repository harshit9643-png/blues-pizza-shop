<svg xmlns="http://www.w3.org/2000/svg" width="600" height="620" viewBox="0 0 600 620">
  <!-- A square-cut banana leaf to serve on: glossy 3D leaf with thickness, the pale
       midrib strip along the top, parallel veins, slightly wavy cut edges.
       Green under the golden pizza gives the strongest contrast, and it is pure jungle. -->
  <defs>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6CC152"/><stop offset=".5" stop-color="#46A23C"/><stop offset="1" stop-color="#2F7E2E"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B6A27"/><stop offset="1" stop-color="#1A4618"/>
    </linearGradient>
    <linearGradient id="rib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4F2A6"/><stop offset="1" stop-color="#A9D46A"/>
    </linearGradient>
    <radialGradient id="gloss" cx=".25" cy=".2" r=".65">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".38"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4FFE2" stop-opacity=".7"/><stop offset=".5" stop-color="#F4FFE2" stop-opacity="0"/>
      <stop offset="1" stop-color="#0D2E0C" stop-opacity=".4"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <path id="shape" d="M30 46 Q96 30 150 40 Q214 26 300 36 Q384 26 450 40 Q506 30 572 44 Q586 120 578 200 Q590 300 580 400 Q590 480 574 558
      Q506 572 450 564 Q384 578 300 568 Q214 580 150 566 Q92 576 28 560 Q12 480 22 400 Q10 300 20 200 Q12 120 30 46Z"/>
    <clipPath id="clip"><use href="#shape"/></clipPath>
  </defs>

  <!-- contact shadow + leaf thickness -->
  <use href="#shape" fill="#0E2A0C" opacity=".45" filter="url(#blur)" transform="translate(6 30)"/>
  <use href="#shape" fill="url(#side)" transform="translate(0 16)"/>
  <!-- leaf surface -->
  <use href="#shape" fill="url(#leaf)"/>
  <g clip-path="url(#clip)">
    <!-- parallel veins running from the midrib down -->
    <g fill="none" stroke-linecap="round">
      <g stroke="#8FD873" stroke-opacity=".55" stroke-width="2.5">
        <path d="M40 92l-40 560M80 92l-40 560M120 92l-40 560M160 92l-40 560M200 92l-40 560M240 92l-40 560M280 92l-40 560M320 92l-40 560M360 92l-40 560M400 92l-40 560M440 92l-40 560M480 92l-40 560M520 92l-40 560M560 92l-40 560M600 92l-40 560M640 92l-40 560"/>
      </g>
      <g stroke="#1F5E1E" stroke-opacity=".28" stroke-width="2">
        <path d="M44 92l-40 560M84 92l-40 560M124 92l-40 560M164 92l-40 560M204 92l-40 560M244 92l-40 560M284 92l-40 560M324 92l-40 560M364 92l-40 560M404 92l-40 560M444 92l-40 560M484 92l-40 560M524 92l-40 560M564 92l-40 560M604 92l-40 560"/>
      </g>
    </g>
    <!-- the pale midrib strip along the top edge -->
    <path d="M0 40 H600 V88 Q300 100 0 88Z" fill="url(#rib)"/>
    <path d="M0 88 Q300 100 600 88" fill="none" stroke="#5E9E3F" stroke-opacity=".7" stroke-width="3"/>
    <path d="M0 56 H600" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="3"/>
    <!-- gloss -->
    <rect width="600" height="620" fill="url(#gloss)"/>
    <path d="M70 140 Q120 112 200 118" fill="none" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- bevelled cut edge -->
  <use href="#shape" fill="none" stroke="url(#bevel)" stroke-width="10"/>
  <use href="#shape" fill="none" stroke="#1E531C" stroke-opacity=".75" stroke-width="3"/>
</svg>

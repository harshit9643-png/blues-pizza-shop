<svg xmlns="http://www.w3.org/2000/svg" width="600" height="630" viewBox="0 0 600 630">
  <!-- Light wooden chopping board with a handle (lower left) and a hanging hole, for the cutter tray.
       The round part is centred at 330,290 with radius 255 (55%, 46% of the box; radius 42.5% of its width). -->
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3C994"/><stop offset=".55" stop-color="#E4AF74"/><stop offset="1" stop-color="#CF955A"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B57A40"/><stop offset="1" stop-color="#8A5525"/>
    </linearGradient>
    <clipPath id="face"><use href="#shape"/></clipPath>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="12"/></filter>
    <path id="shape" d="M330 35a255 255 0 1 1 -170 445l-62 62a40 40 0 0 1 -57 -57l62 -62A255 255 0 0 1 330 35z"/>
  </defs>

  <use href="#shape" fill="#3A1A08" opacity=".32" filter="url(#blur)" transform="translate(6 22)"/>
  <!-- thickness -->
  <use href="#shape" fill="url(#edge)" transform="translate(0 14)"/>
  <!-- face -->
  <use href="#shape" fill="url(#wood)"/>
  <g clip-path="url(#face)" fill="none" stroke="#B9783C" stroke-linecap="round">
    <g stroke-opacity=".3" stroke-width="2.5">
      <path d="M0 120c140 20 280-30 600 10M0 200c160 18 300-24 600 6M0 285c150 22 310-20 600 8M0 370c170 16 290-26 600 4M0 455c150 20 300-18 600 10M0 540c160 18 290-22 600 6"/>
    </g>
    <g stroke-opacity=".22" stroke-width="2">
      <path d="M40 160c150 14 290-18 560 6M30 330c160 14 300-16 570 4M20 500c150 16 300-18 580 6"/>
      <ellipse cx="420" cy="420" rx="26" ry="12"/><ellipse cx="250" cy="170" rx="18" ry="8"/>
    </g>
  </g>
  <!-- hanging hole -->
  <circle cx="70" cy="571" r="12" fill="#8A5525"/><circle cx="70" cy="569" r="9" fill="#5A3212"/>
  <!-- soft bevel light along the top -->
  <path d="M150 140a250 250 0 0 1 230 -100" fill="none" stroke="#FFF2DC" stroke-opacity=".75" stroke-width="8" stroke-linecap="round"/>
  <use href="#shape" fill="none" stroke="#9A6230" stroke-opacity=".7" stroke-width="3"/>
</svg>

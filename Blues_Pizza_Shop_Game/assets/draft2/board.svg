<svg xmlns="http://www.w3.org/2000/svg" width="600" height="620" viewBox="0 0 600 620">
  <!-- 3D dark-walnut butcher-block board: glued strips in alternating tones, a thick side,
       bevelled top edge and a soft oiled sheen. Dark wood so the golden pizza and the cut
       gaps read clearly, and it stands apart from the honey plank table. -->
  <defs>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A1E0B"/><stop offset="1" stop-color="#1F0F05"/>
    </linearGradient>
    <linearGradient id="stripA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A4524"/><stop offset="1" stop-color="#5E3218"/>
    </linearGradient>
    <linearGradient id="stripB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6A3A1D"/><stop offset="1" stop-color="#4E2912"/>
    </linearGradient>
    <linearGradient id="stripC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#85502B"/><stop offset="1" stop-color="#683B1E"/>
    </linearGradient>
    <radialGradient id="sheen" cx=".28" cy=".18" r=".7">
      <stop offset="0" stop-color="#FFE7C4" stop-opacity=".30"/><stop offset="1" stop-color="#FFE7C4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE1B5" stop-opacity=".6"/><stop offset=".45" stop-color="#FFE1B5" stop-opacity=".05"/>
      <stop offset="1" stop-color="#120700" stop-opacity=".55"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="face"><rect x="18" y="14" width="564" height="564" rx="40"/></clipPath>
  </defs>

  <!-- contact shadow and the slab's thickness, with end-grain strip lines -->
  <rect x="40" y="60" width="520" height="546" rx="50" fill="#120700" opacity=".5" filter="url(#blur)"/>
  <rect x="18" y="40" width="564" height="566" rx="42" fill="url(#side)"/>
  <g stroke="#5A3218" stroke-opacity=".7" stroke-width="2">
    <path d="M65 578v26M112 578v26M159 578v26M206 578v26M253 578v26M300 578v26M347 578v26M394 578v26M441 578v26M488 578v26M535 578v26"/>
  </g>

  <!-- top face: twelve glued strips -->
  <g clip-path="url(#face)">
    <rect x="18" y="14" width="47" height="564" fill="url(#stripA)"/>
    <rect x="65" y="14" width="47" height="564" fill="url(#stripB)"/>
    <rect x="112" y="14" width="47" height="564" fill="url(#stripC)"/>
    <rect x="159" y="14" width="47" height="564" fill="url(#stripA)"/>
    <rect x="206" y="14" width="47" height="564" fill="url(#stripB)"/>
    <rect x="253" y="14" width="47" height="564" fill="url(#stripC)"/>
    <rect x="300" y="14" width="47" height="564" fill="url(#stripB)"/>
    <rect x="347" y="14" width="47" height="564" fill="url(#stripA)"/>
    <rect x="394" y="14" width="47" height="564" fill="url(#stripC)"/>
    <rect x="441" y="14" width="47" height="564" fill="url(#stripB)"/>
    <rect x="488" y="14" width="47" height="564" fill="url(#stripA)"/>
    <rect x="535" y="14" width="47" height="564" fill="url(#stripC)"/>
    <!-- glue lines -->
    <g stroke="#2A1408" stroke-opacity=".6" stroke-width="2">
      <path d="M65 14v564M112 14v564M159 14v564M206 14v564M253 14v564M300 14v564M347 14v564M394 14v564M441 14v564M488 14v564M535 14v564"/>
    </g>
    <!-- grain -->
    <g fill="none" stroke="#B07A4A" stroke-opacity=".22" stroke-width="1.6" stroke-linecap="round">
      <path d="M40 30c6 120-6 250 4 380s-6 120 2 160M88 20c-6 140 6 260-2 380s6 120-2 170M134 30c4 130-4 260 4 390s-4 110 2 150"/>
      <path d="M182 20c-4 130 6 250-2 380s4 120-2 170M230 30c6 120-6 260 2 380s-4 120 2 160M276 20c-6 140 4 250-4 380s6 130 0 170"/>
      <path d="M324 30c4 130-6 250 2 380s-2 120 2 160M370 20c-4 140 6 260-2 380s4 110-2 170M418 30c6 120-4 260 4 390s-6 120 0 150"/>
      <path d="M464 20c-6 130 4 250-4 380s6 130 0 170M512 30c4 140-6 250 2 380s-4 120 2 160M558 20c-4 130 6 260-2 390s4 110-2 160"/>
    </g>
    <g fill="#2A1408" fill-opacity=".35">
      <ellipse cx="230" cy="420" rx="9" ry="14"/><ellipse cx="465" cy="160" rx="7" ry="11"/>
    </g>
    <rect x="18" y="14" width="564" height="564" fill="url(#sheen)"/>
  </g>

  <!-- bevelled edge -->
  <rect x="24" y="20" width="552" height="552" rx="35" fill="none" stroke="url(#bevel)" stroke-width="12"/>
  <rect x="18" y="14" width="564" height="564" rx="40" fill="none" stroke="#120700" stroke-opacity=".75" stroke-width="3"/>
</svg>

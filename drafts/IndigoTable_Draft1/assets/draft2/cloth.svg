<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <!-- Hand block-printed cotton (Sanganeri style): indigo buttis on woven cream. One seamless tile. -->
  <defs>
    <pattern id="weave" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 .5h4M.5 0v4" stroke="#8A6B3C" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <filter id="print" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="1" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.8"/>
    </filter>
    <g id="butti">
      <g fill="#4F6AA8" fill-opacity=".8">
        <ellipse cx="-7" cy="13" rx="3.4" ry="7" transform="rotate(-38 -7 13)"/>
        <ellipse cx="7" cy="13" rx="3.4" ry="7" transform="rotate(38 7 13)"/>
      </g>
      <path d="M0 6v14" stroke="#4F6AA8" stroke-opacity=".8" stroke-width="1.6"/>
      <g fill="#2E4B8F" fill-opacity=".88">
        <ellipse cx="0" cy="-7" rx="4.6" ry="7"/>
        <ellipse cx="0" cy="-7" rx="4.6" ry="7" transform="rotate(72)"/>
        <ellipse cx="0" cy="-7" rx="4.6" ry="7" transform="rotate(144)"/>
        <ellipse cx="0" cy="-7" rx="4.6" ry="7" transform="rotate(216)"/>
        <ellipse cx="0" cy="-7" rx="4.6" ry="7" transform="rotate(288)"/>
      </g>
      <circle r="3.4" fill="#F7EFDD"/>
      <circle r="1.6" fill="#C8402E" fill-opacity=".75"/>
    </g>
    <g id="dots" fill="#2E4B8F" fill-opacity=".62">
      <circle cx="0" cy="-5" r="2"/><circle cx="5" cy="0" r="2"/><circle cx="0" cy="5" r="2"/><circle cx="-5" cy="0" r="2"/>
    </g>
  </defs>
  <rect width="160" height="160" fill="#F7EFDD"/>
  <rect width="160" height="160" fill="url(#weave)"/>
  <g filter="url(#print)">
    <use href="#butti" x="40" y="40"/>
    <use href="#butti" x="120" y="120"/>
    <!-- wrap the second butti's leaves across the tile edges so the repeat stays seamless -->
    <use href="#butti" x="120" y="-40"/>
    <use href="#butti" x="-40" y="120"/>
    <use href="#butti" x="-40" y="-40"/>
    <use href="#dots" x="120" y="40"/>
    <use href="#dots" x="40" y="120"/>
  </g>
</svg>

<title>Blue's Pizza Shop Level 2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">

<style>
/* Level 2 — the Big Eater Contest on the same jungle plank table as Level 1.
   Two contestants face each other across the table: each has a 3D walnut plate,
   a stack of slices to build what they ate, and a spotlight for the winner.
   "Who ate more?" sits between them; a rule only shows, in the instruction card, after a second wrong pick. Palette as Level 1:
   indigo, marigold, cream, tomato, leaf green on honey wood. */
:root{
  --indigo:#23356F; --indigo-2:#3A55A0; --indigo-ink:#141E45;
  --cream:#FFF8EA; --paper:#FFFDF6;
  --marigold:#F2A62C; --marigold-deep:#B97410;
  --tomato:#C8402E; --leaf:#3F8A3C; --good:#2F8A43; --bad:#D4473A;
  --wood:#7C4520; --wood-dark:#4A2508;
  --ink:#2B2016; --ink-soft:#76604C;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}   /* also when the file is opened directly, without the page wrapper */
html,body{height:100%}
body{margin:0;overflow:hidden;color:var(--ink);font-family:var(--body);-webkit-user-select:none;user-select:none;background:#F7FAFE}
/* zoomed in on the table, as in Level 1: a red-and-cream checked tablecloth fills the whole screen */
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    linear-gradient(90deg,rgba(96,150,214,.36) 50%,transparent 0) 50% 50%/56px 56px,
    linear-gradient(rgba(96,150,214,.36) 50%,transparent 0) 50% 50%/56px 56px,
    #F7FAFE}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(ellipse 60% 50% at 50% 45%,rgba(255,255,255,.2),transparent 70%),
    linear-gradient(100deg,transparent 30%,rgba(40,70,120,.05) 45%,transparent 60%),
    linear-gradient(80deg,transparent 62%,rgba(255,255,255,.1) 72%,transparent 82%),
    radial-gradient(ellipse at 50% 50%,transparent 60%,rgba(40,70,120,.14) 100%)}
.frond{display:none;position:fixed;top:-30px;width:min(30vw,340px);height:auto;z-index:-1;pointer-events:none;filter:drop-shadow(0 10px 12px rgba(0,20,0,.35))}
.frond.l{left:-50px;transform-origin:0 0;animation:frondL 7s ease-in-out infinite}
.frond.r{right:-50px;transform:scaleX(-1);transform-origin:100% 0;animation:frondR 7.6s ease-in-out infinite}
@keyframes frondL{0%,100%{rotate:0deg}50%{rotate:2.2deg}}
@keyframes frondR{0%,100%{rotate:0deg}50%{rotate:-2.2deg}}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,select:focus-visible{outline:3px solid var(--marigold);outline-offset:3px}

#app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:8px;margin:0 auto;padding-block:10px 10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:10px}
.chip{background:rgba(255,253,246,.94);border:2px solid rgba(35,53,111,.16);border-radius:999px;box-shadow:0 4px 14px rgba(20,30,70,.16);color:var(--indigo)}
.home{width:44px;height:44px;display:grid;place-items:center;flex:0 0 auto}
.home svg{width:22px;height:22px}
.jump{position:relative;flex:0 1 auto;min-width:0}
.jump select{appearance:none;-webkit-appearance:none;width:100%;max-width:min(48vw,370px);height:44px;font-family:var(--display);font-weight:800;
  font-size:clamp(14px,1.5vw,17px);color:var(--indigo);background:rgba(255,253,246,.94);border:2px solid rgba(35,53,111,.16);
  border-radius:999px;box-shadow:0 4px 14px rgba(20,30,70,.16);padding:0 42px 0 18px;cursor:pointer;text-overflow:ellipsis}
.jump::after{content:"";position:absolute;right:18px;top:50%;width:8px;height:8px;pointer-events:none;border-right:3px solid var(--indigo);
  border-bottom:3px solid var(--indigo);transform:translateY(-70%) rotate(45deg)}
.jump option,.jump optgroup{color:var(--ink);background:#fff;font-family:var(--body)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.trail{flex:0 1 auto;margin-inline:auto;display:flex;justify-content:center;gap:5px;min-width:0;background:rgba(255,253,246,.94);
  border:2px solid rgba(35,53,111,.16);border-radius:999px;padding:5px 12px;box-shadow:0 4px 14px rgba(20,30,70,.16)}
.tok{width:24px;height:24px;transition:transform .3s;flex:0 0 auto}
.tok.now{transform:scale(1.25)}
.stars{height:44px;display:flex;align-items:center;gap:6px;padding:0 16px;font-family:var(--display);font-weight:800;font-size:18px;
  font-variant-numeric:tabular-nums;flex:0 0 auto}

/* ---------- instruction card ---------- */
.card{justify-self:center;width:min(100%,960px);display:flex;align-items:center;gap:14px;background:var(--paper);margin-bottom:6px;
  border-radius:26px;padding:10px 12px 10px 10px;border:2px solid rgba(35,53,111,.14);box-shadow:0 12px 28px rgba(20,30,70,.24)}
.guide{position:relative;width:66px;height:66px;flex:0 0 auto;border-radius:50%;background:var(--indigo);display:grid;place-items:end center}
.guide img{height:82px;width:auto;margin-bottom:-2px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.25))}
.guide .spk{position:absolute;right:-6px;bottom:-4px;width:28px;height:28px;border-radius:50%;background:var(--marigold);display:grid;place-items:center;
  color:var(--indigo-ink);box-shadow:0 2px 0 var(--marigold-deep)}
.guide .spk svg{width:16px;height:16px}
.guide.cheer img{animation:hop .5s ease 2}
.guide.hmm img{animation:shake .5s}
.say{flex:1 1 auto;min-width:0;margin:0;font-size:clamp(16px,1.85vw,22px);font-weight:800;line-height:1.3;color:var(--indigo-ink)}
.say .fr{color:var(--tomato)}
.say.bad{color:var(--tomato)}
.say.good{color:var(--leaf)}
.say.tip{display:flex;align-items:center;gap:12px}
.say .tipart{flex:0 0 auto;width:clamp(70px,7vw,96px);padding:4px 6px;border-radius:12px;background:#FFF3DC;box-shadow:0 0 0 2px #F0D7A6;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.say .tipart svg{display:block;width:100%;height:auto}
.done{flex:0 0 auto;display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:clamp(16px,1.7vw,20px);
  letter-spacing:.05em;background:var(--marigold);color:var(--indigo-ink);border-radius:18px;padding:12px 24px;
  box-shadow:0 5px 0 var(--marigold-deep);transition:transform .12s,opacity .2s;white-space:nowrap}
.done svg{width:20px;height:20px}
.done:active{transform:translateY(4px);box-shadow:none}
.done[disabled]{opacity:.4;cursor:not-allowed}
.done.ready{animation:ready 1.2s ease-in-out infinite}
@keyframes ready{50%{transform:translateY(-4px);box-shadow:0 9px 0 var(--marigold-deep),0 0 0 6px rgba(242,166,44,.25)}}

.fr{display:inline-grid;vertical-align:middle;text-align:center;line-height:1;font-family:var(--display);font-weight:800;margin:0 .14em}
.fr b{display:block;padding:0 .14em;font-weight:800;border-radius:6px}
.fr b:first-child{border-bottom:.1em solid currentColor;padding-bottom:.04em}
.fr b:last-child{padding-top:.06em}
.fr b.blink{animation:blink .55s ease-in-out 5;background:var(--marigold);color:var(--indigo-ink)}
@keyframes blink{50%{transform:scale(1.35)}}

/* ---------- the table ---------- */
.stage{position:relative;min-height:0;padding:2.2vh 1.8vw;isolation:isolate}   /* the table is the whole screen now (see body) */
.stage::after{content:"";position:absolute;inset:0;border-radius:24px;background:rgba(18,8,0,.34);opacity:0;transition:opacity .5s;pointer-events:none;z-index:1}
.stage.dim::after{opacity:1}
.view{position:absolute;inset:2.2vh 1.8vw;display:grid;min-height:0;z-index:2}
.stage.dim .mid .board,.stage.dim .mid .rule:not(.on):not(.flash){filter:brightness(.7)}
.view.enter{animation:viewIn .55s cubic-bezier(.25,1.1,.4,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(18px)}}

/* match layout: contestant | "Who ate more?" | contestant */
.match{grid-template-columns:minmax(0,1fr) minmax(210px,.62fr) minmax(0,1fr);align-items:center;column-gap:clamp(10px,1.6vw,26px)}
.side{position:relative;z-index:2;display:grid;justify-items:center;align-content:center;gap:8px;min-width:0;border-radius:28px;padding:6px 4px;transition:transform .3s}
.side.a{animation:inL .6s cubic-bezier(.25,1.2,.4,1) both}
.side.b{animation:inR .6s cubic-bezier(.25,1.2,.4,1) both}
@keyframes inL{from{opacity:0;transform:translateX(-60px)}}
@keyframes inR{from{opacity:0;transform:translateX(60px)}}
.side.spot::before{content:"";position:absolute;inset:-4% -6%;z-index:-1;border-radius:50%;
  background:radial-gradient(ellipse at 50% 42%,rgba(255,246,206,.82),rgba(255,236,160,.35) 45%,transparent 70%);animation:spot 2.2s ease-in-out infinite}
@keyframes spot{50%{opacity:.75}}
.side.pick{cursor:pointer}
.side.pick:hover{transform:translateY(-4px)}
.who{display:flex;align-items:center;gap:10px}
/* each contestant sits big in its top corner, with how much it ate and how much is left;
   the board and the slice button sit higher in the middle of the side */
.match .side{align-content:start;padding-top:var(--top)}
.match{--top:clamp(96px,17vh,150px)}
.match .side .who{position:absolute;top:0;z-index:3}
.match .side.a .who{left:0}
.match .side.b .who{right:0;flex-direction:row-reverse}
.match .side.b .info{justify-items:end}
.info{display:grid;gap:6px;justify-items:start}
.eat{display:flex;gap:6px}
.eat>span{display:flex;align-items:center;gap:4px;background:var(--paper);border-radius:12px;padding:2px 10px;white-space:nowrap;
  font-family:var(--display);font-weight:800;font-size:clamp(14px,1.45vw,18px);color:var(--ink);box-shadow:0 0 0 2px #F0D7A6,0 4px 8px rgba(80,40,10,.2)}
.eat .ate .fr{color:var(--tomato)}
.eat .left .fr{color:var(--indigo-2)}
.ava{position:relative;width:clamp(100px,19vh,160px);aspect-ratio:1;border-radius:50%;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;
  background:radial-gradient(circle at 50% 38%,#F2FBE6,#C9EBA9 60%,#94CF72);box-shadow:0 0 0 5px #FFFFFF,0 6px 10px rgba(60,40,10,.3);flex:0 0 auto}
.ava img{width:90%;height:90%;object-fit:contain;object-position:50% 100%;margin-bottom:4%}
.side.win .ava img,.fin.win .ava img{animation:hop .55s ease 3}
.side.bad .ava img{animation:shake .5s}
.tag{display:flex;align-items:center;gap:8px;white-space:nowrap;font-family:var(--display);font-weight:800;font-size:clamp(16px,1.75vw,21px);color:#FFFFFF;
  padding:4px 16px;border-radius:14px;background:linear-gradient(180deg,#A8683A,#7C4520 60%,#64361A);-webkit-text-stroke:3px var(--wood-dark);paint-order:stroke fill;
  box-shadow:0 0 0 3px var(--wood-dark),inset 0 3px 0 rgba(255,220,170,.35),0 6px 10px rgba(0,0,0,.28)}
.tag .fr{color:#FFE08A;font-size:1.15em;-webkit-text-stroke-width:0;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.plate{position:relative;width:var(--pw);aspect-ratio:600/630;transition:filter .3s}
.plate>img{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 14px 12px rgba(40,20,5,.35))}
.plate>.pie{position:absolute;inset:0}
.plate>.pie>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.plate .sl{cursor:pointer}
.plate .sl.pop{transform-box:fill-box;transform-origin:50% 100%;animation:slIn .45s cubic-bezier(.3,1.5,.5,1) both}
@keyframes slIn{from{transform:translateY(80px) scale(.3);opacity:0}}
.side.ok .plate{filter:drop-shadow(0 0 16px rgba(60,200,90,.95))}
.side.bad .plate{filter:drop-shadow(0 0 16px rgba(225,50,40,.95));animation:shake .5s}
.side.glow .plate,.side.glow .fcard{filter:drop-shadow(0 0 18px rgba(255,214,90,1))}
.stack{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 6px;border-radius:16px;background:var(--paper);
  box-shadow:0 4px 0 rgba(90,50,20,.35),0 8px 12px rgba(40,20,5,.2);font-family:var(--display);font-weight:800;color:var(--indigo);
  font-size:clamp(14px,1.4vw,17px);transition:transform .12s}
.stack svg{width:clamp(44px,6.4vh,58px);height:auto}
.stack:active{transform:translateY(3px)}
.stack.off{opacity:.35;pointer-events:none}
.stack.hint{animation:ready 1.1s ease-in-out infinite}
.medal{position:absolute;top:-8px;right:12%;width:clamp(52px,8vh,72px);z-index:5;animation:medalDrop .8s cubic-bezier(.3,1.5,.5,1) both;
  filter:drop-shadow(0 6px 6px rgba(0,0,0,.3))}
@keyframes medalDrop{from{transform:translateY(-160px) rotate(-30deg);opacity:0}}
.who{position:relative}
.side.win .who:has(.medal.neck) .ava img{animation:none}   /* keep still so the medal stays on the neck */
.medal.neck{right:auto;translate:-50% 0;transform-origin:50% 0;animation:medalNeck 1.2s cubic-bezier(.3,1.1,.5,1) both}
@keyframes medalNeck{0%{transform:translateY(-280px) rotate(-30deg) scale(1.6);opacity:0}25%{opacity:1}
  62%{transform:translateY(0) rotate(12deg) scale(1)}80%{transform:rotate(-6deg)}92%{transform:rotate(2deg)}100%{transform:none}}

/* centre column */
.mid{position:relative;z-index:2;display:grid;justify-items:center;align-content:center;gap:10px;min-width:0}
.board{width:100%;max-width:280px;border-radius:18px;padding:10px 12px 12px;background:linear-gradient(180deg,#8A5229,#6A3A18);
  box-shadow:0 0 0 4px var(--wood-dark),inset 0 3px 0 rgba(255,220,170,.3),0 10px 16px rgba(0,0,0,.3);color:#FFF4DC;display:grid;gap:6px}
.board h3{margin:0;text-align:center;font-family:var(--display);font-weight:800;font-size:clamp(14px,1.4vw,17px);letter-spacing:.14em;color:#FFE08A}
.board .row{display:flex;align-items:center;gap:8px;background:rgba(255,245,225,.12);border-radius:12px;padding:4px 8px;
  font-family:var(--display);font-weight:800;font-size:clamp(14px,1.45vw,18px)}
.board .row img{width:30px;height:30px;object-fit:contain;border-radius:50%;background:#E6F5D6}
.board .row .fr{margin-left:auto;font-size:1.2em;color:#FFE08A}
.ask{font-family:var(--display);font-weight:800;font-size:clamp(20px,2.4vw,30px);color:#FFFFFF;-webkit-text-stroke:4px var(--wood-dark);
  paint-order:stroke fill;text-align:center;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.rule{width:100%;max-width:280px;border-radius:16px;padding:8px 10px;background:var(--paper);display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;
  box-shadow:0 0 0 3px #F0D7A6,0 6px 10px rgba(80,40,10,.22);transition:opacity .3s,transform .3s}
.rule.dim{opacity:.45;transform:scale(.94)}
.rule.on{box-shadow:0 0 0 4px var(--marigold),0 0 18px rgba(242,166,44,.7),0 6px 10px rgba(80,40,10,.22)}
.rule.flash{animation:flash .5s ease-in-out 4}
@keyframes flash{50%{transform:scale(1.06);box-shadow:0 0 0 6px var(--tomato),0 0 26px rgba(200,64,46,.8)}}
.rule svg{width:clamp(58px,7vw,84px);height:auto}
.rule b{display:block;font-family:var(--display);font-weight:800;font-size:clamp(13px,1.3vw,16px);color:var(--indigo)}
.rule span{display:block;font-size:clamp(12px,1.15vw,14px);font-weight:700;line-height:1.25;color:var(--ink)}
.rule .cmp{font-family:var(--display);font-weight:800;color:var(--tomato);font-size:clamp(12px,1.2vw,15px)}

/* Set C: fraction cards */
.fcard{width:clamp(110px,17vh,150px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;transition:filter .3s;
  background:radial-gradient(circle at 36% 26%,#FF8A68,#EA4E32 45%,#C2321C);
  box-shadow:0 0 0 7px #FFF4DC,0 0 0 11px #F3DDB0,0 12px 16px rgba(110,25,10,.35),inset 0 -10px 14px rgba(0,0,0,.2),inset 0 8px 12px rgba(255,255,255,.3)}
.fcard .fr{font-size:clamp(34px,5.4vh,48px);color:#FFFFFF;text-shadow:0 3px 0 rgba(110,20,8,.45)}
.side.ok .fcard{filter:drop-shadow(0 0 16px rgba(60,200,90,.95))}
.side.bad .fcard{animation:shake .5s}
.diag{width:clamp(120px,19vh,170px);height:auto;opacity:0;transform:translateY(10px) scale(.9);transition:opacity .45s,transform .5s cubic-bezier(.3,1.5,.5,1)}
.diag.show{opacity:1;transform:none}
.side.glow .diag{filter:drop-shadow(0 0 14px rgba(255,214,90,1))}

/* intro screens */
.intro{place-items:center;align-content:center;gap:14px;z-index:2}
.intro .big{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.intro .rule{max-width:360px;padding:12px 14px}
.intro .rule svg{width:110px}
.intro .rule b{font-size:clamp(17px,1.8vw,22px)}
.intro .rule span{font-size:clamp(14px,1.4vw,17px)}
.lineup{display:flex;gap:10px;align-items:flex-end;justify-content:center;flex-wrap:wrap}
.lineup img{height:clamp(70px,13vh,120px);width:auto;animation:hop .8s ease infinite;filter:drop-shadow(0 6px 5px rgba(60,30,10,.3))}
.trophy{width:clamp(90px,17vh,150px);height:auto;filter:drop-shadow(0 10px 10px rgba(80,50,0,.4));animation:shine 2.4s ease-in-out infinite}
@keyframes shine{50%{transform:translateY(-6px) scale(1.04)}}

/* the final: finalists, diagrams, five slots */
.final{grid-template-rows:auto auto auto;align-content:center;justify-items:center;gap:clamp(8px,1.6vh,16px);z-index:2}
:root{--sq:clamp(96px,min(12vw,19vh),140px)}
.row5{display:grid;grid-template-columns:repeat(5,var(--sq));gap:clamp(8px,1.4vw,18px);justify-content:center}
.home5 .cell{display:grid;place-items:center;width:var(--sq);height:var(--sq)}
.fin{width:calc(var(--sq) - 10px);height:calc(var(--sq) - 10px);display:grid;justify-items:center;align-content:center;gap:2px;padding:4px;border-radius:18px;background:var(--paper);touch-action:none;cursor:grab;
  box-shadow:0 5px 0 rgba(90,50,20,.35),0 10px 14px rgba(40,20,5,.22);transition:box-shadow .2s}
.fin .ava{width:38%}
.fin .mini{width:40%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 36% 26%,#FF8A68,#EA4E32 45%,#C2321C);box-shadow:0 0 0 4px #FFF4DC,0 0 0 6px #F3DDB0}
.fin .mini .fr{font-size:clamp(14px,2.2vh,20px);color:#FFFFFF}
.fin .nm{font-family:var(--display);font-weight:800;font-size:13px;color:var(--indigo)}
.fin.sel{box-shadow:0 0 0 4px var(--marigold),0 10px 18px rgba(242,166,44,.5)}
.fin.dragging{position:relative;z-index:50;cursor:grabbing;box-shadow:0 18px 26px rgba(40,20,5,.4);pointer-events:none}
.fin.lock{box-shadow:0 0 0 4px var(--good),0 0 16px rgba(60,200,90,.8);cursor:default}
.fin.bad{animation:shake .5s;box-shadow:0 0 0 4px var(--bad),0 0 16px rgba(225,50,40,.8)}
.fin.pick{cursor:pointer}
.fin.pick:hover{transform:translateY(-4px)}
.fin.win{box-shadow:0 0 0 5px var(--marigold),0 0 24px rgba(242,166,44,.9)}
.diags5 .cell{display:grid;place-items:center;height:clamp(60px,10vh,92px)}
.diags5 svg{height:100%;width:auto;opacity:0;transform:scale(.6);transition:opacity .4s,transform .45s cubic-bezier(.3,1.5,.5,1)}
.diags5.show svg{opacity:1;transform:none}
.slot{width:var(--sq);height:var(--sq);border-radius:20px;border:3px dashed rgba(74,37,8,.45);background:rgba(255,248,230,.35);
  display:grid;place-items:center;position:relative;transition:background .2s,border-color .2s}
.slot.over{background:rgba(255,236,170,.75);border-color:var(--marigold)}
.slot.glow{box-shadow:0 0 0 4px var(--marigold),0 0 20px rgba(242,166,44,.8)}
.slot i{position:absolute;bottom:-26px;font-style:normal;font-family:var(--display);font-weight:800;font-size:14px;color:var(--wood-dark);white-space:nowrap}
.scale{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;color:var(--wood-dark);font-size:15px;margin-top:22px}
.scale span.line{width:clamp(160px,40vw,520px);height:4px;border-radius:4px;background:linear-gradient(90deg,#B07A44,#4A2508);position:relative}
.scale span.line::after{content:"";position:absolute;right:-4px;top:-6px;border:8px solid transparent;border-left:12px solid #4A2508;border-right:0}

/* champion podium */
.podium{place-items:center;align-content:center;gap:10px;z-index:2}
.steps{display:flex;align-items:flex-end;gap:clamp(6px,1vw,14px)}
.step{display:grid;justify-items:center;gap:4px}
.step img.a{height:clamp(64px,12vh,110px);width:auto;filter:drop-shadow(0 6px 5px rgba(60,30,10,.3))}
.step .blk{width:clamp(80px,11vw,140px);border-radius:12px 12px 4px 4px;display:grid;place-items:center;font-family:var(--display);font-weight:800;
  color:#FFFFFF;-webkit-text-stroke:3px var(--wood-dark);paint-order:stroke fill;font-size:clamp(20px,2.6vw,32px);
  background:linear-gradient(180deg,#A8683A,#7C4520 60%,#64361A);box-shadow:0 0 0 3px var(--wood-dark),inset 0 3px 0 rgba(255,220,170,.35)}
.step.top img.a{height:clamp(90px,17vh,150px)}
.step .med{position:relative;margin-top:-28px;width:40px}
.step.top .trophy{width:clamp(56px,9vh,84px);margin-bottom:-10px}

.fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.fx i{position:absolute;top:-24px;width:16px;height:14px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
@keyframes hop{50%{transform:translateY(-14px)}}
@keyframes shake{20%{transform:translateX(-8px) rotate(-3deg)}40%{transform:translateX(8px) rotate(3deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* ---------- start + end ---------- */
.overlay{position:fixed;inset:0;z-index:90;display:grid;place-items:center;isolation:isolate;overflow:hidden;background:#244D25;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.overlay::before{content:"";position:absolute;inset:-40px;z-index:-1;
  background:linear-gradient(rgba(10,32,12,.25),rgba(10,32,12,.45)),url("assets/web/backdrop.webp") center 62%/cover;filter:blur(9px) saturate(1.1)}
.start-wrap{display:grid;justify-items:center;gap:18px;width:100%}
.world{position:relative;width:min(100%,calc((100vh - 170px) * 1376 / 768));aspect-ratio:1376/768;border-radius:26px;overflow:hidden;
  container-type:inline-size;box-shadow:0 18px 40px rgba(20,24,60,.38);border:5px solid var(--paper)}
.world>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
.w-sign{position:absolute;left:33.4%;width:34.7%;top:21.9%;height:11.6%;display:flex;align-items:center;justify-content:center;gap:.25em;
  font-family:var(--display);font-weight:800;color:#5C3414;font-size:2.55cqw;white-space:nowrap;text-shadow:0 1px 0 rgba(255,232,196,.7)}
.w-sign img{height:1.4em;width:auto}
.w-billu{position:absolute;left:46%;width:30%;top:34.6%;height:24.2%;clip-path:inset(-120% -60% 0 -60%)}
.w-billu img{position:absolute;top:0;left:50%;height:182%;width:auto;translate:-50% 0;filter:drop-shadow(0 4px 6px rgba(60,30,10,.35))}
.w-noori{position:absolute;left:47.5%;bottom:39.3%;height:17%;translate:-50% 0;transform-origin:50% 100%;animation:sway 3.4s ease-in-out infinite}
.w-noori img{height:100%;width:auto;display:block}
@keyframes sway{0%,100%{rotate:-1.5deg}50%{rotate:1.5deg}}
.w-trophy{position:absolute;left:61%;bottom:39%;width:7%}
.w-trophy img{width:100%;height:auto;display:block;filter:drop-shadow(0 4px 4px rgba(60,30,10,.35))}
.lvbtn{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:22px;padding:10px 26px 10px 12px;
  box-shadow:0 6px 0 rgba(35,53,111,.35),0 12px 24px rgba(20,30,70,.2);font-family:var(--display);font-weight:800;
  font-size:clamp(18px,2vw,24px);color:var(--indigo);text-align:left;line-height:1.1;transition:transform .15s}
.lvbtn:hover{transform:translateY(-3px)}
.lvbtn img{width:60px;height:auto}
.lvbtn small{display:block;font-family:var(--body);font-weight:700;font-size:.62em;color:var(--ink-soft)}
.endcard{background:var(--paper);border-radius:30px;padding:24px clamp(16px,3vw,44px) 28px;display:grid;justify-items:center;gap:14px;
  width:min(100%,920px);box-shadow:0 18px 40px rgba(20,24,60,.35);position:relative}
.endcard::before{content:"";position:absolute;inset:10px;border:2px dashed rgba(58,85,160,.25);border-radius:22px;pointer-events:none}
.endcard h2{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(28px,3.8vw,44px);color:var(--indigo);text-align:center;text-wrap:balance}
.endcard p{margin:0;font-weight:800;font-size:clamp(16px,1.8vw,20px);color:var(--ink-soft);text-align:center}
.crowd{display:flex;align-items:flex-end;justify-content:center;flex-wrap:wrap;gap:4px 8px}
.crowd img{height:clamp(60px,10vh,100px);width:auto;animation:hop .7s ease infinite}
.bigstars{font-family:var(--display);font-weight:800;font-size:clamp(22px,2.6vw,30px);color:var(--indigo);background:var(--cream);border-radius:999px;padding:2px 24px}
.endbtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* ---------- smaller and portrait screens ---------- */
@media (max-aspect-ratio: 5/6){
  .match{grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;row-gap:10px}
  .match .mid{grid-column:1 / -1;grid-row:1}
  .match .rule{display:none}
  .who{flex-direction:column;gap:4px}
  .match .side{padding-top:6px}
  .match .side .who{position:relative}
  .ava{width:clamp(54px,8vh,70px)}
  .tag{font-size:14px;padding:3px 10px;-webkit-text-stroke-width:2px}
  .card{flex-wrap:wrap;gap:8px}
  .say{flex-basis:calc(100% - 80px)}
  .done{margin-left:auto}
  .board{max-width:none}
  .row5{grid-template-columns:repeat(5,minmax(0,1fr))}
  .fin .nm{display:none}
}
@media (max-width:640px){ .trail{display:none} }
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important} }

<script>
"use strict";
/* ============================================================
   CONTENT — Level 2_Final sheet (Tutorial 2, Sets A–C, the Golden Trophy Final)
   ============================================================ */
const A="assets/web/", HD="assets/web/hd/";
const NAMES={tez:"Tez",monty:"Monty",ant:"Ant",squirrel:"Squirrel",bijli:"Bijli",badal:"Badal",madhu:"Madhu",peacock:"Peacock",
  jhumru:"Jhumru",mouse:"Mouse",hippo:"Hippo"};
const THE={ant:"the ant",squirrel:"the squirrel",peacock:"the peacock",mouse:"the mouse",hippo:"the hippo"};
const who=k=>THE[k]||NAMES[k], Who=k=>{const w=who(k);return w[0].toUpperCase()+w.slice(1)};
const MEDAL=`<svg class="medal" viewBox="0 0 80 110" role="img" aria-label="Medal">
  <path d="M22 0h14l10 40H32z" fill="#D4473A"/><path d="M58 0H44L34 40h14z" fill="#3A55A0"/>
  <path d="M26 0h4l10 40h-4zM50 0h4L44 40h-4z" fill="#FFFFFF" opacity=".8"/>
  <circle cx="40" cy="72" r="30" fill="#B97410"/><circle cx="40" cy="70" r="30" fill="#F2A62C"/>
  <circle cx="40" cy="70" r="22" fill="#FBD584" stroke="#D99415" stroke-width="3"/>
  <path d="M40 56l4.2 8.6 9.5 1.4-6.9 6.7 1.6 9.4L40 77.6l-8.4 4.5 1.6-9.4-6.9-6.7 9.5-1.4z" fill="#F2A62C" stroke="#B97410" stroke-width="1.5"/>
  <path d="M22 58a20 20 0 0 1 12-12" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8"/></svg>`;
/* the winner's medal drops from above, swings, and settles with its ribbon round the animal's neck */
/* where each animal's neck is in its own picture: [x, y] as fractions of the image, and how wide
   its chest is (fraction of the image width) so the medal is sized to the animal */
const NECK={tez:[.55,.45,.42],monty:[.5,.42,.3],ant:[.52,.46,.22],squirrel:[.34,.33,.28],bijli:[.44,.34,.2],badal:[.4,.38,.2],
  madhu:[.45,.55,.36],peacock:[.5,.39,.2],hippo:[.5,.41,.38],jhumru:[.5,.47,.3],mouse:[.5,.48,.24]};
function hangMedal(side,k){
  const who=side.querySelector(".who"), ava=who&&who.querySelector(".ava"), img=ava&&ava.querySelector("img");
  if(!img||!img.naturalWidth){ side.insertAdjacentHTML("beforeend",MEDAL); return; }
  who.insertAdjacentHTML("beforeend",MEDAL.replace('class="medal"','class="medal neck"'));
  const m=who.lastElementChild, [nx,ny,cw]=NECK[k]||[.5,.42,.3];
  // the picture is drawn with object-fit:contain, bottom-centred, inside the img box
  const r=img.getBoundingClientRect(), w0=who.getBoundingClientRect();
  const sc=Math.min(r.width/img.naturalWidth, r.height/img.naturalHeight), iw=img.naturalWidth*sc, ih=img.naturalHeight*sc;
  const x=r.left+(r.width-iw)/2+nx*iw-w0.left, y=r.top+(r.height-ih)+ny*ih-w0.top;
  const mw=Math.max(26,cw*iw/.75);                                  // the medal disc is 3/4 of the svg width
  Object.assign(m.style,{left:x+"px", top:(y-mw*.08)+"px", width:mw+"px"});
}
const RULE_SAME_D="Same denominator? The parts are the same size. Compare the numerators.";
const RULE_SAME_N="Same numerator? Compare the size of the parts. The smaller denominator means bigger parts.";

const STEPS=[
  {kind:"match",set:"T",label:"Tutorial",guided:true,a:{k:"squirrel",n:2,d:7},b:{k:"peacock",n:5,d:7},win:"b",
    intro:"Next match: the squirrel and the peacock! Let's find the winner together.",
    yes:"Yes! 5 parts are more than 2 parts. The peacock ate more!"},
  {kind:"match",set:"A",label:"Match 1",a:{k:"tez",n:3,d:5},b:{k:"monty",n:1,d:5},win:"a",intro:"Match 1: Tez and Monty! Show how much each one ate.",
    quotes:[["tez","Slow and steady wins!"]]},
  {kind:"match",set:"A",label:"Match 2",a:{k:"madhu",n:2,d:9},b:{k:"ant",n:7,d:9},win:"b",intro:"Match 2: Madhu and the ant!",quotes:[["ant","Small ant, big appetite!"]]},
  {kind:"match",set:"A",label:"Match 3",a:{k:"bijli",n:5,d:6},b:{k:"badal",n:1,d:6},win:"a",intro:"Match 3: twin against twin!",
    quotes:[["bijli","Sssorry, twin!"],["badal","Next time!"]]},
  {kind:"match",set:"A",label:"Match 4",a:{k:"jhumru",n:3,d:10},b:{k:"hippo",n:7,d:10},win:"b",intro:"Match 4: the two biggest eaters, Jhumru and the hippo!",
    quotes:[["hippo","Hip hip hooray!"],["jhumru","Well eaten, hippo!"]]},
  {kind:"intro",set:"B",label:"Set B",text:"Now the pizzas are cut into different numbers of parts. Watch the size of the slices!",rules:["n"]},
  {kind:"match",set:"B",label:"Match 5",a:{k:"ant",n:1,d:3},b:{k:"madhu",n:1,d:10},win:"a",intro:"Match 5: the ant and Madhu!",quotes:[["ant","One big slice for me!"]]},
  {kind:"match",set:"B",label:"Match 6",a:{k:"monty",n:2,d:9},b:{k:"tez",n:2,d:5},win:"b",intro:"Match 6: Monty and Tez!",quotes:[["tez","Slow… but steady!"]]},
  {kind:"match",set:"B",label:"Match 7",a:{k:"squirrel",n:3,d:4},b:{k:"mouse",n:3,d:8},win:"a",intro:"Match 7: the squirrel and the mouse!",
    quotes:[["squirrel","Quick, quick, I win!"],["mouse","Squeak! Good match!"]]},
  {kind:"match",set:"B",label:"Match 8",a:{k:"peacock",n:5,d:12},b:{k:"bijli",n:5,d:6},win:"b",intro:"Match 8: the peacock and Bijli!",
    quotes:[["bijli","Hisss-tory made!"],["peacock","Hmph! Well done."]]},
  {kind:"intro",set:"C",label:"Set C",text:"Now just the fractions, no pizza! Use the rules to find who ate more.",rules:["d","n"]},
  {kind:"cards",set:"C",label:"Round 9",shape:"round",a:{k:"monty",n:4,d:7},b:{k:"peacock",n:6,d:7},win:"b",intro:"Monty or the peacock: who ate more?",
    yes:"Yes! Same denominator, and 6 is more than 4."},
  {kind:"cards",set:"C",label:"Round 10",shape:"square",a:{k:"mouse",n:1,d:6},b:{k:"ant",n:1,d:4},win:"b",intro:"The mouse or the ant: who ate more?",
    yes:"Yes! Same numerator, and fourths are bigger than sixths."},
  {kind:"cards",set:"C",label:"Round 11",shape:"round",a:{k:"hippo",n:5,d:9},b:{k:"jhumru",n:2,d:9},win:"a",intro:"The hippo or Jhumru: who ate more?",
    yes:"Yes! Same denominator, and 5 is more than 2."},
  {kind:"cards",set:"C",label:"Round 12",shape:"rect",a:{k:"madhu",n:3,d:10},b:{k:"squirrel",n:3,d:5},win:"b",intro:"Madhu or the squirrel: who ate more?",
    yes:"Yes! Same numerator, and fifths are bigger than tenths."},
  {kind:"cards",set:"C",label:"Round 13",shape:"round",a:{k:"bijli",n:7,d:12},b:{k:"badal",n:7,d:8},win:"b",intro:"Last one! Bijli or Badal: who ate more?",
    yes:"Yes! Same numerator, and eighths are bigger than twelfths.",quotes:[["badal","My turn to win!"]]},
  {kind:"finalIntro",set:"F",label:"The Final"},
  {kind:"final",set:"F",label:"Final: order"},
  {kind:"champion",set:"F",label:"Champion"}
];
const FINALISTS=[{k:"ant",n:1,d:2},{k:"tez",n:1,d:4},{k:"bijli",n:1,d:6},{k:"hippo",n:1,d:3},{k:"squirrel",n:1,d:5}];
const SCORED=STEPS.map((s,i)=>i).filter(i=>["match","cards","final"].includes(STEPS[i].kind));

/* ============================================================
   DRAWING — painted pizza pieces (viewBox units)
   ============================================================ */
let _id=0; const uid=p=>p+(++_id);
const sector=(cx,cy,r,a0,a1)=>{
  if(a1-a0>=Math.PI*2-1e-6) return `M${cx} ${cy-r}A${r} ${r} 0 1 1 ${cx-.01} ${cy-r}Z`;
  const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0), x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
  return `M${cx} ${cy}L${x0.toFixed(1)} ${y0.toFixed(1)}A${r} ${r} 0 ${a1-a0>Math.PI?1:0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}Z`;
};
/* one painted wedge: the round pizza clipped to a sector */
function wedge(cx,cy,r,a0,a1,attrs){
  const id=uid("w"), d=sector(cx,cy,r,a0,a1);
  return `<clipPath id="${id}"><path d="${d}"/></clipPath>
    <image href="${HD}pizza_round.webp" x="${cx-r}" y="${cy-r}" width="${2*r}" height="${2*r}" clip-path="url(#${id})" preserveAspectRatio="none"/>
    <path ${attrs||""} d="${d}" fill="rgba(255,255,255,0)" stroke="#5A2A0E" stroke-opacity=".75" stroke-width="${Math.max(1.5,r/70)}" stroke-linejoin="round"/>`;
}
/* the pie on a plate: `count` slices of 1/d from twelve o'clock, inside a dashed whole */
const PC={x:300,y:302,r:208};
function plateOverlay(count,d,popLast){
  const step=2*Math.PI/d, start=-Math.PI/2;
  let s=`<circle cx="${PC.x}" cy="${PC.y}" r="${PC.r}" fill="rgba(255,240,215,.06)" stroke="rgba(255,236,200,.7)" stroke-width="4" stroke-dasharray="16 12"/>`;
  for(let i=0;i<count;i++) s+=`<g class="sl${popLast&&i===count-1?' pop':''}" data-i="${i}">${wedge(PC.x,PC.y,PC.r,start+i*step,start+(i+1)*step)}</g>`;
  return `<svg viewBox="0 0 600 630" aria-hidden="true">${s}</svg>`;
}
/* a stack of three loose 1/d slices for the "add a slice" button */
function stackIcon(d){
  const r=46, th=2*Math.PI/d, a0=-Math.PI/2-th/2, a1=-Math.PI/2+th/2, hw=r*Math.sin(Math.min(th/2,Math.PI/2));
  let g="";
  for(let k=2;k>=0;k--) g+=`<g transform="translate(0 ${k*7})" opacity="${1-k*.18}">${wedge(0,0,r,a0,a1)}</g>`;
  return `<svg viewBox="${-Math.max(hw,22)-4} ${-r-6} ${2*Math.max(hw,22)+8} ${r+26}" aria-hidden="true">${g}</svg>`;
}
/* Set C diagrams in the round's pizza shape: eaten parts painted, the rest a faint outline */
const GRID={4:[2,2],5:[1,5],6:[2,3],10:[2,5]};
function diagram(shape,n,d){
  if(shape==="round"){
    const step=2*Math.PI/d, start=-Math.PI/2; let s=`<circle cx="100" cy="100" r="92" fill="rgba(255,248,230,.85)" stroke="#B07A44" stroke-width="3"/>`;
    for(let i=0;i<d;i++){ const a0=start+i*step,a1=a0+step;
      s+= i<n ? wedge(100,100,92,a0,a1) : `<path d="${sector(100,100,92,a0,a1)}" fill="none" stroke="#B07A44" stroke-width="2"/>`; }
    return `<svg class="diag" viewBox="0 0 200 200" aria-hidden="true">${s}</svg>`;
  }
  const [rows,cols]=GRID[d]||[1,d], W=shape==="rect"?220:170, H=shape==="rect"?110:170, img=shape==="rect"?"pizza_rect_sharp":"pizza_square_sharp";
  const cw=W/cols, ch=H/rows; let s=`<rect x="0" y="0" width="${W}" height="${H}" rx="8" fill="rgba(255,248,230,.85)" stroke="#B07A44" stroke-width="3"/>`;
  const clip=uid("c"); let cells=""; let k=0;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++,k++){
    if(k<n) cells+=`<rect x="${c*cw}" y="${r*ch}" width="${cw}" height="${ch}"/>`; }
  s+=`<clipPath id="${clip}">${cells}</clipPath><image href="${HD}${img}.webp" x="0" y="0" width="${W}" height="${H}" preserveAspectRatio="none" clip-path="url(#${clip})"/>`;
  for(let c=1;c<cols;c++) s+=`<line x1="${c*cw}" y1="0" x2="${c*cw}" y2="${H}" stroke="#7A4A20" stroke-width="2.5"/>`;
  for(let r=1;r<rows;r++) s+=`<line x1="0" y1="${r*ch}" x2="${W}" y2="${r*ch}" stroke="#7A4A20" stroke-width="2.5"/>`;
  return `<svg class="diag" viewBox="-4 -4 ${W+8} ${H+8}" aria-hidden="true">${s}</svg>`;
}
/* rule-card pictures */
function ruleArt(kind){
  if(kind==="d"){   // 3/8 and 5/8: same size parts, count them
    const pie=(x,n)=>{const step=Math.PI/4,st=-Math.PI/2;let s=`<circle cx="${x}" cy="40" r="34" fill="#FFF3DC" stroke="#B07A44" stroke-width="2"/>`;
      for(let i=0;i<n;i++) s+=wedge(x,40,34,st+i*step,st+(i+1)*step); return s;};
    return `<svg viewBox="0 0 160 82" aria-hidden="true">${pie(38,3)}<text x="80" y="47" text-anchor="middle" font-family="Baloo 2" font-weight="800" font-size="22" fill="#C8402E">&lt;</text>${pie(122,5)}</svg>`;
  }
  // 1/8 and 1/4: one part each, the quarter is bigger
  return `<svg viewBox="0 0 160 82" aria-hidden="true">${wedge(40,64,56,-Math.PI/2-Math.PI/8,-Math.PI/2+Math.PI/8)}
    <text x="80" y="54" text-anchor="middle" font-family="Baloo 2" font-weight="800" font-size="22" fill="#C8402E">&lt;</text>
    ${wedge(122,66,56,-Math.PI/2-Math.PI/4,-Math.PI/2+Math.PI/4)}</svg>`;
}
const RULES={
  d:{title:"Same denominator?",body:"The parts are the same size. Compare the numerators.",cmp:"3/8 < 5/8"},
  n:{title:"Same numerator?",body:"The smaller denominator means bigger parts.",cmp:"1/8 < 1/4"}
};
const ruleCard=(k,cls)=>`<div class="rule ${cls||""}" id="rule-${k}">${ruleArt(k)}<div><b>${RULES[k].title}</b><span>${RULES[k].body}</span>
  <span class="cmp">${RULES[k].cmp.replace(/(\d+)\/(\d+)/g,"$1/$2")}</span></div></div>`;

/* ============================================================
   SOUND + VOICE
   ============================================================ */
const Sound=(()=>{ let ctx=null;
  const ac=()=>{ if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return ctx; };
  function tone(f,t,dur,type,vol){ const c=ac(); if(!c) return; const o=c.createOscillator(), g=c.createGain();
    o.type=type||"triangle"; o.frequency.setValueAtTime(f,c.currentTime+t); g.gain.setValueAtTime(0,c.currentTime+t);
    g.gain.linearRampToValueAtTime(vol||.14,c.currentTime+t+.02); g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t+dur);
    o.connect(g); g.connect(c.destination); o.start(c.currentTime+t); o.stop(c.currentTime+t+dur+.05); }
  return { plop(){tone(440+Math.random()*120,0,.07,"sine",.11)}, pop(){tone(300,0,.06,"sine",.12)}, pick(){tone(760,0,.08,"triangle",.1)},
    drum(){ for(let i=0;i<10;i++) tone(110+(i%2)*20,i*.06,.07,"sine",.18); },
    good(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.085,.26,"triangle",.14))},
    bad(){tone(260,0,.18,"sawtooth",.08);tone(190,.13,.26,"sawtooth",.08)},
    win(){[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,i*.1,.45,"triangle",.14))} };
})();
function speak(text){ if(!window.speechSynthesis) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text.replace(/(\d+)\/(\d+)/g,"$1 by $2")); u.rate=.92; speechSynthesis.speak(u); }catch(e){} }

const $=id=>document.getElementById(id);
const S={i:0,stars:0,done:{},gen:0,tries:0,phase:"",cnt:{a:0,b:0},g:0,sayPlain:""};
const live=g=>g===S.gen;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const fracify=s=>s.replace(/(\d+)\/(\d+)/g,'<span class="fr"><b>$1</b><b>$2</b></span>');
const frac=(n,d,id)=>`<span class="fr"><b${id?` id="${id}"`:""}>${n}</b><b>${d}</b></span>`;
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const ARROW='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>';
let onDone=null;
function say(text,tone,speaker){
  S.sayPlain=text; $("say").innerHTML=fracify(text); $("say").className="say"+(tone?" "+tone:"");
  $("guideImg").src = speaker==="billu" ? A+"billu_happy.webp" : A+"noori.webp";
}
/* after a second wrong pick the rule shows up inside the instruction card, with its little picture */
function sayRule(k){
  say(k==="d"?RULE_SAME_D:RULE_SAME_N,"bad","noori");
  $("say").insertAdjacentHTML("afterbegin",`<span class="tipart">${ruleArt(k)}</span>`); $("say").classList.add("tip");
}
function guideMood(c){ const g=$("guide"); g.classList.remove("cheer","hmm"); void g.offsetWidth; g.classList.add(c); }
function button(label,enabled,ready,fn){ const b=$("done");
  b.innerHTML = label==="next" ? `NEXT ${ARROW}` : label==="check" ? `CHECK PLATES ${CHECK}` : label==="order" ? `CHECK ORDER ${CHECK}` : label;
  b.disabled=!enabled; b.classList.toggle("ready",!!ready); onDone=fn||null; }
$("done").addEventListener("click",()=>{ if(onDone && !$("done").disabled) onDone(); });
function confetti(){ const fx=$("fx"), cols=["#F2A62C","#FBD584","#C8402E","#3A55A0","#3F8A3C","#FFF2C8"];
  for(let i=0;i<60;i++){ const s=document.createElement("i"); s.style.left=Math.random()*100+"%"; s.style.background=cols[i%cols.length];
    s.style.clipPath=i%3?"polygon(50% 0,100% 100%,0 100%)":"circle(50%)"; s.style.animationDelay=(Math.random()*.35)+"s";
    s.style.animationDuration=(1.3+Math.random()*.9)+"s"; fx.appendChild(s); setTimeout(()=>s.remove(),2600); } }
function bump(el,cls,ms){ if(!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); if(ms) setTimeout(()=>el.classList.remove(cls),ms); }
function renderTop(){
  $("trail").innerHTML=SCORED.map(i=>`<svg class="tok ${i===S.i?'now':''}" viewBox="0 0 32 32">
    <circle cx="16" cy="16" r="13" fill="${S.done[i]?'#F6C34A':'#FFFDF6'}" stroke="${i===S.i?'#F2A62C':'#23356F'}" stroke-width="${i===S.i?3.4:2.2}" opacity="${S.done[i]||i===S.i?1:.6}"/>
    ${S.done[i]?'<path d="M10 16.5l4 4 8-9" fill="none" stroke="#8A5508" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>':''}</svg>`).join("");
  $("stars").textContent="⭐ "+S.stars; $("jump").value=String(S.i);
}
function setView(cls,html){ const v=$("view"); v.className="view "+cls+" enter"; v.innerHTML=html; $("stage").classList.remove("dim"); }
function plateWidth(){ const v=$("view"), portrait=innerWidth<innerHeight*.84;
  const top=Math.min(150,Math.max(96,innerHeight*.17));              // the contestant row above (see .match --top)
  const h=v.clientHeight-(portrait?260:top)-66-30;                    // who-row, stack button, gaps
  return Math.max(110,Math.min(330, h*600/630, v.clientWidth*(portrait?.44:.27))); }
function rulesFor(set){ return set==="T"||set==="A" ? ["d"] : set==="B" ? ["d","n"] : ["d","n"]; }
function activeRule(st){ return st.a.d===st.b.d ? "d" : "n"; }

/* ============================================================
   FLOW
   ============================================================ */
function go(i){
  S.i=i; S.gen++; S.tries=0; S.phase=""; S.g=0; renderTop();
  $("start").hidden=true; $("end").hidden=true;
  const st=STEPS[i];
  ({match:showMatch,cards:showCards,intro:showIntro,finalIntro:showFinalIntro,final:showFinal,champion:showChampion})[st.kind](st);
}
function next(){ if(S.i+1<STEPS.length) go(S.i+1); else showEnd(); }
function award(i){ if(S.done[i]) return; S.done[i]=true; if(S.tries===0) S.stars++; renderTop(); }

/* ---------- a build-and-pick match (Tutorial, Sets A and B) ---------- */
function sideHTML(sd,o,canBuild){
  return `<section class="side ${sd}" id="side-${sd}">
    <div class="who"><div class="ava"><img src="${A}${o.k}.webp" alt="${NAMES[o.k]}"></div>
      <div class="info"><div class="tag">${NAMES[o.k]}</div>
        <div class="eat"><span class="ate">Ate ${frac(o.n,o.d,"num-"+sd)}</span><span class="left">Left ${frac(o.d-o.n,o.d)}</span></div></div></div>
    <div class="plate" style="--pw:${plateWidth()}px"><img src="assets/draft2/board_round.svg" alt=""><div class="pie" id="pie-${sd}">${plateOverlay(0,o.d)}</div></div>
    ${canBuild?`<button class="stack" id="stack-${sd}" aria-label="Add a one ${o.d}th slice to ${NAMES[o.k]}'s plate">${stackIcon(o.d)}<span>+ ${frac(1,o.d)} slice</span></button>`:""}
  </section>`;
}
function midHTML(st){
  return `<section class="mid"><div id="askbox"></div></section>`;
}
function showMatch(st){
  setView("match",sideHTML("a",st.a,true)+midHTML(st)+sideHTML("b",st.b,true));
  S.cnt={a:0,b:0}; S.phase="build";
  ["a","b"].forEach(sd=>{
    $("stack-"+sd).addEventListener("click",()=>addSlice(st,sd));
    $("pie-"+sd).addEventListener("click",e=>{ if(e.target.closest(".sl")) removeSlice(st,sd); });
  });
  if(st.guided){ S.g=1; guideStep(st); }
  else { say(st.intro,"","billu"); speak(st.intro); button("check",false,false,()=>checkPlates(st)); }
}
function drawPie(st,sd,popLast){ $("pie-"+sd).innerHTML=plateOverlay(S.cnt[sd],st[sd].d,popLast); }
function addSlice(st,sd){
  if(S.phase!=="build"||S.cnt[sd]>=st[sd].d) return;
  S.cnt[sd]++; drawPie(st,sd,true); Sound.plop(); afterChange(st);
}
function removeSlice(st,sd){
  if(S.phase!=="build"||S.cnt[sd]<=0) return;
  S.cnt[sd]--; drawPie(st,sd,false); Sound.pop(); afterChange(st);
}
function afterChange(st){
  if(st.guided) return guideStep(st);
  button("check",S.cnt.a>0&&S.cnt.b>0,S.cnt.a===st.a.n&&S.cnt.b===st.b.n,()=>checkPlates(st));
}
/* the tutorial walks one stack at a time, as in Tutorial 2 */
function guideStep(st){
  // both stacks stay open: kids may add too many or too few and learn from the feedback
  const done=S.cnt.a>0&&S.cnt.b>0;
  ["a","b"].forEach(sd=>{ const n=$("num-"+sd); if(n) n.classList.toggle("blink",S.cnt[sd]===0); });
  $("stack-a").classList.toggle("hint",S.cnt.a===0); $("stack-b").classList.toggle("hint",S.cnt.a>0&&S.cnt.b===0);
  if(S.keepMsg) {}                                       // keep the try-again / hint message on screen
  else if(S.cnt.a===0&&S.cnt.b===0) say(`${st.intro} The squirrel ate 2/7 and the peacock ate 5/7. Tap a stack to put slices on its plate.`,"","noori");
  else if(!done) say("Put slices on both plates. Tap a slice on a plate to take it off.","","noori");
  else say("When both plates look right, tap Check plates.","","noori");
  button("check",done,S.cnt.a===st.a.n&&S.cnt.b===st.b.n,()=>checkPlates(st));
}
async function checkPlates(st){
  if(S.phase!=="build") return;
  const g=S.gen, okA=S.cnt.a===st.a.n, okB=S.cnt.b===st.b.n;
  if(okA&&okB){
    S.phase="checked"; button("check",false,false);
    ["a","b"].forEach(sd=>{ $("side-"+sd).classList.add("ok"); const s=$("stack-"+sd); if(s) s.classList.add("off"); });
    Sound.good(); guideMood("cheer"); say("Both plates are right!","good","noori");
    await wait(1300); if(!live(g)) return;
    const act=activeRule(st); const r=$("rule-"+act); if(r){ r.classList.add("on"); r.classList.remove("dim"); }
    if(st.guided || S.tries===0 && st.set==="T"){
      say(`Both pizzas were cut into ${st.a.d} equal parts, so the parts are the same size. Compare the numerators.`,"","noori");
      speak(S.sayPlain); await wait(3200); if(!live(g)) return;
    }
    ["a","b"].forEach(sd=>$("side-"+sd).classList.remove("ok"));
    winnerPhase(st);
    return;
  }
  S.tries++; Sound.bad(); guideMood("hmm");
  const bad=!okA?"a":"b", o=st[bad], first=S.tries===1;
  const side=$("side-"+bad); bump(side,"bad",600);
  if(first) say(st.label==="Match 1"?"Oops! Try again.":`Is that how much ${who(o.k)} ate? Try again.`,"bad","noori");
  else { say(st.label==="Match 1"?"Check the numerator. How many slices did each one eat?":`Check the numerator. That's how many slices ${who(o.k)} ate.`,"bad","noori");
    bump($("num-"+bad),"blink",2800); }
  await wait(650); if(!live(g)) return;
  S.cnt[bad]=0; drawPie(st,bad,false); S.keepMsg=true; afterChange(st); S.keepMsg=false;
}
function winnerPhase(st){
  S.phase="winner"; S.wTries=0; Sound.drum();
  $("stage").classList.add("dim");
  $("askbox").innerHTML=`<div class="ask">Who ate more?</div>`;
  say("And the winner is…?","","billu"); button("Tap the winner",false,false);
  ["a","b"].forEach(sd=>{ const s=$("side-"+sd); s.classList.add("spot","pick"); s.tabIndex=0; s.setAttribute("role","button");
    const fn=()=>pickWinner(st,sd); s.onclick=e=>{ if(e.target.closest(".stack")) return; fn(); };
    s.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); fn(); } }; });
}
async function pickWinner(st,sd){
  if(S.phase!=="winner") return;
  const g=S.gen;
  if(sd===st.win){
    S.phase="won"; award(S.i); $("stage").classList.remove("dim");
    ["a","b"].forEach(x=>{ const s=$("side-"+x); s.classList.remove("pick","glow"); s.onclick=null; if(x!==sd) s.classList.remove("spot"); });
    const s=$("side-"+sd); s.classList.add("win"); hangMedal(s,st[sd].k);
    Sound.win(); confetti(); guideMood("cheer");
    const lines=(st.quotes||[]).map(([k,q])=>`${NAMES[k]}: “${q}”`).join("  ");
    say(st.yes || lines || `${Who(st[sd].k)} ate more!`,"good",st.yes?"noori":"billu");
    if(st.yes && lines) setTimeout(()=>{ if(live(g)) say(lines,"good","billu"); },2600);
    speak(S.sayPlain); button("next",true,true,next); return;
  }
  S.wTries++; S.tries++; Sound.bad(); guideMood("hmm");
  bump($("side-"+sd),"bad",600);
  if(S.wTries===1) say("Hmm, look at the plates again. Who ate more?","bad","noori");
  else { sayRule(activeRule(st)); $("side-"+st.win).classList.add("glow"); }
}

  S.wTries++; S.tries++; Sound.bad(); guideMood("hmm"); bump($("side-"+sd),"bad",600);
  document.querySelectorAll(".diag").forEach(d=>d.classList.add("show"));
  if(S.wTries===1) say("Oops! Try again. Look at the pictures.","bad","noori");

function showFinalIntro(){
  setView("intro",`<img class="trophy" src="${A}trophy.svg" alt="The golden trophy">
    <div class="lineup">${FINALISTS.map((f,i)=>`<img src="${A}${f.k}.webp" alt="${NAMES[f.k]}" style="animation-delay:${i*120}ms">`).join("")}</div>`);
  Sound.drum(); say("The Golden Trophy Final! Our top medal winners eat one more time!","","billu"); speak(S.sayPlain);
  button("next",true,true,next);
}
const finCard=(f,i)=>`<div class="fin" id="fin-${i}" data-i="${i}" tabindex="0" role="button" aria-label="${NAMES[f.k]} ate ${f.n} out of ${f.d}">
  <div class="ava"><img src="${A}${f.k}.webp" alt=""></div><div class="mini">${frac(f.n,f.d)}</div><div class="nm">${NAMES[f.k]}</div></div>`;
function finDiag(f){ const s=diagram("round",1,f.d); return s.replace('class="diag"','class=""'); }
function showFinal(){
  setView("final",`
    <div class="row5 home5">${FINALISTS.map((f,i)=>`<div class="cell" id="home-${i}">${finCard(f,i)}</div>`).join("")}</div>
    <div class="row5 diags5" id="diags">${FINALISTS.map((_,i)=>`<div class="cell" id="dg-${i}"></div>`).join("")}</div>
    <div>
      <div class="row5">${[0,1,2,3,4].map(i=>`<div class="slot" id="slot-${i}" data-s="${i}"></div>`).join("")}</div>
      <div class="scale" style="justify-content:center"><span>smallest</span><span class="line"></span><span>greatest</span></div>
    </div>`);
  S.phase="order"; S.sel=null; S.oTries=0;
  say("They each ate one piece, but from pizzas cut differently. Put them in order, from smallest to greatest!","","noori"); speak(S.sayPlain);
  button("order",false,false,checkOrder);
  wireFinal();
}
function placed(){ return [0,1,2,3,4].map(s=>{ const c=$("slot-"+s).querySelector(".fin"); return c?+c.dataset.i:null; }); }
function putIn(card,slot){
  const home=$("home-"+card.dataset.i);
  if(slot){ const prev=slot.querySelector(".fin"); if(prev&&prev!==card) $("home-"+prev.dataset.i).appendChild(prev); slot.appendChild(card); }
  else home.appendChild(card);
  card.classList.remove("sel","bad"); S.sel=null; Sound.pick();
  button("order",placed().every(x=>x!==null),placed().every(x=>x!==null),checkOrder);
}
function wireFinal(){
  const view=$("view");
  view.querySelectorAll(".fin").forEach(card=>{
    card.addEventListener("pointerdown",e=>{
      if(S.phase!=="order"||card.classList.contains("lock")) return;
      e.preventDefault();
      const sx=e.clientX, sy=e.clientY; let moved=false, over=null;
      const move=ev=>{
        const dx=ev.clientX-sx, dy=ev.clientY-sy;
        if(!moved && Math.hypot(dx,dy)>8){ moved=true; card.classList.add("dragging"); }
        if(moved){ card.style.transform=`translate(${dx}px,${dy}px) scale(1.06)`;
          const el=document.elementFromPoint(ev.clientX,ev.clientY), sl=el&&el.closest&&el.closest(".slot");
          if(sl!==over){ if(over) over.classList.remove("over"); if(sl) sl.classList.add("over"); over=sl; } }
      };
      const up=()=>{
        window.removeEventListener("pointermove",move);
        card.classList.remove("dragging"); card.style.transform="";
        if(over) over.classList.remove("over");
        if(!moved){                                                   // a tap: select, or send back home
          if(card.parentNode.classList.contains("slot")){ putIn(card,null); return; }
          view.querySelectorAll(".fin.sel").forEach(c=>c.classList.remove("sel"));
          card.classList.add("sel"); S.sel=card; Sound.pick(); return; }
        if(over) putIn(card,over);
      };
      window.addEventListener("pointermove",move);
      window.addEventListener("pointerup",up,{once:true});
      window.addEventListener("pointercancel",up,{once:true});
    });
  });
  view.querySelectorAll(".slot").forEach(sl=>sl.addEventListener("click",e=>{
    if(S.phase!=="order"||!S.sel||e.target.closest(".fin")) return; putIn(S.sel,sl); }));
}
async function checkOrder(){
  if(S.phase!=="order") return;
  const g=S.gen, p=placed(), want=[...FINALISTS.keys()].sort((x,y)=>FINALISTS[x].n/FINALISTS[x].d-FINALISTS[y].n/FINALISTS[y].d);
  if(p.every((v,s)=>v===want[s])){
    S.phase="ordered"; award(S.i);
    p.forEach(i=>$("fin-"+i).classList.add("lock")); Sound.good(); guideMood("cheer");
    say("Perfect! The more parts a pizza is cut into, the smaller each part.","good","noori"); speak(S.sayPlain);
    button("check",false,false); await wait(2600); if(!live(g)) return;
    finalWinner(); return;
  }
  S.oTries++; S.tries++; Sound.bad(); guideMood("hmm");
  const wrong=p.map((v,s)=>v!==want[s]?v:null).filter(v=>v!==null);
  wrong.forEach(i=>bump($("fin-"+i),"bad",600));
  if(S.oTries===1) say("Oops! Try again.","bad","noori");
  else { say("Same numerator? The smaller denominator means bigger parts. Start with the biggest denominator: that's the smallest piece.","bad","noori");
    FINALISTS.forEach((f,i)=>{ $("dg-"+i).innerHTML=finDiag(f); }); $("diags").classList.add("show"); }
  await wait(650); if(!live(g)) return;
  wrong.forEach(i=>putIn($("fin-"+i),null));
  p.forEach((v,s)=>{ if(v!==null&&!wrong.includes(v)) $("fin-"+v).classList.add("lock"); });
}
function finalWinner(){
  S.phase="finalPick"; S.wTries=0; $("stage").classList.add("dim"); Sound.drum();
  say("And the golden trophy goes to…? Tap the winner!","","billu"); button("Tap the champion",false,false);
  placed().forEach(i=>{ const c=$("fin-"+i); c.classList.remove("lock"); c.classList.add("pick");
    c.onclick=()=>pickChampion(i); c.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); pickChampion(i); } }; });
  document.querySelectorAll(".slot").forEach(s=>s.style.zIndex=2);
}
function pickChampion(i){
  if(S.phase!=="finalPick") return;
  const best=[...FINALISTS.keys()].reduce((a,b)=>FINALISTS[b].n/FINALISTS[b].d>FINALISTS[a].n/FINALISTS[a].d?b:a,0);
  if(i===best){
    S.phase="champ"; $("stage").classList.remove("dim"); const c=$("fin-"+i); c.classList.add("win");
    c.insertAdjacentHTML("beforeend",`<img class="medal" src="${A}trophy.svg" alt="Golden trophy" style="right:-14px;top:-30px">`);
    Sound.win(); confetti(); say("Ant: “One big piece, one golden trophy!”","good","billu"); speak(S.sayPlain);
    button("next",true,true,next); return;
  }
  S.wTries++; Sound.bad(); guideMood("hmm"); bump($("fin-"+i),"bad",600);
  if(S.wTries===1) say("Hmm, look at the order again. Who ate the most?","bad","noori");
  else { say("The greatest fraction is at the end of the row.","bad","noori"); bump($("slot-4"),"glow",2400); bump($("fin-"+best),"sel",2400); }
}
function showChampion(){
  const order=[["squirrel",4],["hippo",2],["ant",1],["tez",3],["bijli",5]];      // 1/2 > 1/3 > 1/4 > 1/5 > 1/6
  const H={1:"clamp(90px,17vh,150px)",2:"clamp(70px,12vh,110px)",3:"clamp(56px,9vh,86px)",4:"clamp(42px,6vh,60px)",5:"clamp(32px,4.6vh,46px)"};
  setView("podium",`<div class="steps">${order.map(([k,p])=>`<div class="step ${p===1?'top':''}">
      ${p===1?`<img class="trophy" src="${A}trophy.svg" alt="Golden trophy">`:""}
      <img class="a" src="${A}${k}.webp" alt="${NAMES[k]}">
      <div class="blk" style="height:${H[p]}">${p}</div></div>`).join("")}</div>`);
  Sound.win(); confetti(); say("The ant is our Big Eater Champion!  Monty (from the crowd): “Beaten by an ant… again!”","good","noori"); speak("The ant is our Big Eater Champion!");
  button("next",true,true,showEnd);
}
function showEnd(){
  const winners=["peacock","tez","ant","bijli","hippo","squirrel","badal"];
  $("endcard").innerHTML=`<h2>What a contest! You found every winner!</h2>
    <div class="crowd">${winners.map((k,i)=>`<img src="${A}${k}.webp" alt="${NAMES[k]}" style="animation-delay:${i*90}ms">`).join("")}</div>
    <p>You compared fractions like a champion!</p><div class="bigstars">⭐ ${S.stars} / ${SCORED.length}</div>
    <div class="endbtns"><button class="done" id="again">PLAY AGAIN</button><button class="done" id="toL1" style="background:var(--cream);box-shadow:0 5px 0 rgba(35,53,111,.25)">LEVEL 1</button></div>`;
  $("end").hidden=false; S.gen++; Sound.win(); speak("What a contest! You found every winner! You compared fractions like a champion!");
  $("again").onclick=()=>{ S.stars=0; S.done={}; go(0); };
  $("toL1").onclick=()=>goLevel1("1.1");
}

/* ---------- wiring ---------- */
$("guide").addEventListener("click",()=>speak(S.sayPlain));
$("home").addEventListener("click",()=>{ S.gen++; $("end").hidden=true; $("start").hidden=false; });
$("play").addEventListener("click",()=>go(0));
/* Level 1 is the previous page of the same game: the folder above this one */
function goLevel1(lv){ location.href=new URL("../index.html#"+lv,location.href).href; }
document.querySelectorAll("[data-l1]").forEach(b=>b.addEventListener("click",()=>goLevel1(b.dataset.l1)));
$("jump").innerHTML=`<optgroup label="Level 1"><option value="L1:1.1">Level 1.1 · Top and serve ◂</option><option value="L1:1.2">Level 1.2 · Cut, top and serve ◂</option></optgroup>`+[["Tutorial",["T"]],["Set A · Same denominator",["A"]],["Set B · Same numerator",["B"]],["Set C · Fractions only",["C"]],["Golden Trophy Final",["F"]]]
  .map(([lab,sets])=>`<optgroup label="${lab}">${STEPS.map((s,i)=>sets.includes(s.set)?`<option value="${i}">${s.label}${s.a?` · ${NAMES[s.a.k]} vs ${NAMES[s.b.k]}`:""}</option>`:"").join("")}</optgroup>`).join("");
$("jump").addEventListener("change",e=>{ const v=e.target.value; if(v.startsWith("L1:")){ goLevel1(v.slice(3)); return; } go(+v); e.target.blur(); });
let _rz; window.addEventListener("resize",()=>{ clearTimeout(_rz); _rz=setTimeout(()=>document.querySelectorAll(".plate").forEach(p=>p.style.setProperty("--pw",plateWidth()+"px")),150); });
[...new Set(STEPS.flatMap(s=>s.a?[s.a.k,s.b.k]:[]).concat(FINALISTS.map(f=>f.k)))].map(k=>A+k+".webp")
  .concat([A+"trophy.svg",A+"billu_happy.webp",HD+"pizza_round.webp",HD+"pizza_square_sharp.webp",HD+"pizza_rect_sharp.webp","assets/draft2/board_round.svg"])
  .forEach(src=>{ const im=new Image(); im.src=src; });
renderTop();
/* arriving from the end of Level 1.2: start the Level 2 tutorial straight away */
if(location.hash==="#play") go(0);
</script>

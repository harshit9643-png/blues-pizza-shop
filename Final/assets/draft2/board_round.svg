<svg xmlns="http://www.w3.org/2000/svg" width="600" height="630" viewBox="0 0 600 630">
  <!-- Round wooden pizza board, same box and centre as plate_wood.svg (centre 300,302): a flat oak
       board made of planks, a thick edge, a soft bevel and grain. The pizza (r 208) sits on it with
       a wide ring of wood showing round it. -->
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E2A868"/><stop offset=".5" stop-color="#C98A4B"/><stop offset="1" stop-color="#A86C33"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A4A20"/><stop offset="1" stop-color="#4E2D10"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE7C4" stop-opacity=".8"/><stop offset=".5" stop-color="#FFE7C4" stop-opacity="0"/>
      <stop offset="1" stop-color="#4E2D10" stop-opacity=".45"/>
    </linearGradient>
    <radialGradient id="shade" cx=".5" cy=".5" r=".5">
      <stop offset=".72" stop-color="#5A3212" stop-opacity="0"/><stop offset="1" stop-color="#5A3212" stop-opacity=".35"/>
    </radialGradient>
    <clipPath id="face"><circle cx="300" cy="300" r="282"/></clipPath>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <ellipse cx="304" cy="334" rx="284" ry="276" fill="#3A1A08" opacity=".38" filter="url(#blur)"/>
  <!-- thickness -->
  <circle cx="300" cy="318" r="286" fill="url(#side)"/>
  <!-- face -->
  <circle cx="300" cy="300" r="286" fill="url(#top)"/>
  <g clip-path="url(#face)">
    <!-- planks -->
    <g fill="#8E5626" opacity=".1">
      <rect x="18" y="0" width="94" height="630"/><rect x="206" y="0" width="94" height="630"/><rect x="394" y="0" width="94" height="630"/>
    </g>
    <g stroke="#7A4618" stroke-opacity=".45" stroke-width="3">
      <path d="M112 0V630M206 0V630M300 0V630M394 0V630M488 0V630"/>
    </g>
    <!-- grain -->
    <g fill="none" stroke="#9A5E2A" stroke-opacity=".28" stroke-width="2.5" stroke-linecap="round">
      <path d="M60 40c10 120-12 240 6 360s-6 160 2 230M150 10c-14 140 14 260-4 380s10 150 0 240M248 20c12 120-10 230 8 350s-8 170 2 260"/>
      <path d="M342 0c-10 130 12 250-6 370s8 160-2 260M438 30c12 120-10 240 6 360s-6 150 4 240M530 60c-8 120 10 230-4 350s4 150-2 200"/>
      <ellipse cx="170" cy="470" rx="16" ry="28"/><ellipse cx="430" cy="150" rx="12" ry="22"/>
    </g>
    <circle cx="300" cy="300" r="286" fill="url(#shade)"/>
  </g>
  <!-- bevelled edge and sheen -->
  <circle cx="300" cy="300" r="279" fill="none" stroke="url(#bevel)" stroke-width="12"/>
  <path d="M96 150a270 270 0 0 1 160 -116" fill="none" stroke="#FFF1DA" stroke-opacity=".7" stroke-width="9" stroke-linecap="round"/>
  <circle cx="300" cy="300" r="286" fill="none" stroke="#4E2D10" stroke-opacity=".8" stroke-width="3"/>
</svg>

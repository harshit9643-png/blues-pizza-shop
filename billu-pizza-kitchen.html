<title>Blue's Pizza Shop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap">

<style>
/* Layout: a jungle stage — backdrop band behind, a scene strip on top,
   a working counter in the middle, and a dialogue bar pinned to the bottom. */
:root{
  --sky:#8FD6F2; --sky2:#CFEFFA;
  --jungle:#3E8F46; --jungle-deep:#2B6A33;
  --wood:#B07A45; --wood-deep:#7E5128; --wood-light:#D7A572;
  --crust:#E3A356; --crust-deep:#BE7E35; --cheese:#FBD584; --cheese-hi:#FFE6AC;
  --sauce:#DC5B3B;
  --ink:#3B2414; --ink-soft:#7A5B42;
  --paper:#FFF6E6; --paper-2:#FBEBD2; --line:#E2C89F;
  --gold:#F3B713; --leaf:#5BBE52;
  --good:#3F9B4D; --bad:#D4503C;
  --shadow:rgba(80,45,15,.18);
  --panel:rgba(255,255,255,.55);
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:#1E3A52; --sky2:#2C5570;
    --jungle:#255C2C; --jungle-deep:#163A1C;
    --wood:#7A542F; --wood-deep:#4C321A; --wood-light:#9A6E42;
    --ink:#FBEEDC; --ink-soft:#C9AE8E;
    --paper:#2A1D12; --paper-2:#372618; --line:#56402A;
    --shadow:rgba(0,0,0,.45);
    --panel:rgba(42,29,18,.62);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --sky:#1E3A52; --sky2:#2C5570;
  --jungle:#255C2C; --jungle-deep:#163A1C;
  --wood:#7A542F; --wood-deep:#4C321A; --wood-light:#9A6E42;
  --ink:#FBEEDC; --ink-soft:#C9AE8E;
  --paper:#2A1D12; --paper-2:#372618; --line:#56402A;
  --shadow:rgba(0,0,0,.45);
  --panel:rgba(42,29,18,.62);
  color-scheme: dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:var(--body); color:var(--ink);
  background:linear-gradient(180deg,var(--sky2) 0%,var(--sky) 42%,var(--jungle) 100%);
  overflow:hidden;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:10px}

#app{
  height:100%; display:flex; flex-direction:column;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:10px 12px;
  gap:10px; max-width:1180px; margin:0 auto; position:relative;
}

/* ---------- HUD ---------- */
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex:0 0 auto}
.hud .chip{
  background:var(--paper); border:2px solid var(--line); border-radius:999px;
  padding:5px 13px; font-family:var(--display); font-weight:700; font-size:.92rem;
  box-shadow:0 2px 0 var(--shadow); white-space:nowrap;
}
.hud .bar{flex:1 1 120px;min-width:90px;height:12px;border-radius:999px;background:var(--paper-2);
  border:2px solid var(--line);overflow:hidden;box-shadow:0 2px 0 var(--shadow)}
.hud .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--crust));
  width:0;transition:width .45s cubic-bezier(.2,.8,.3,1)}
.iconbtn{width:38px;height:38px;border-radius:50%;background:var(--paper);border:2px solid var(--line);
  display:grid;place-items:center;font-size:1.05rem;box-shadow:0 2px 0 var(--shadow)}
.iconbtn[aria-pressed="false"]{opacity:.45}

/* ---------- STAGE ---------- */
.stage{
  flex:1 1 auto; min-height:0; position:relative; border-radius:22px; overflow:hidden;
  border:3px solid var(--wood-deep); box-shadow:0 8px 0 var(--shadow), inset 0 0 0 3px rgba(255,255,255,.14);
  background:linear-gradient(180deg,var(--sky2),var(--sky) 55%, #A9DC8F 100%);
  display:flex; flex-direction:column;
}
.backdrop{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.stage-inner{position:relative;z-index:2;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
  padding:10px 14px;gap:8px;overflow:auto}

/* scene strip */
.scene{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex:0 0 auto;min-height:86px}
.cast{display:flex;align-items:flex-end;gap:6px}
.actor{display:grid;justify-items:center;gap:2px;line-height:1}
.actor .face{font-size:2.5rem;filter:drop-shadow(0 3px 2px rgba(0,0,0,.2))}
.actor .nm{font-family:var(--display);font-weight:700;font-size:.68rem;background:var(--paper);
  border:2px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap}
.actor.talking .face{animation:bob .7s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.svgchar{width:64px;height:72px;display:block;filter:drop-shadow(0 3px 2px rgba(0,0,0,.22))}
.charimg{height:clamp(52px,9.5vh,98px);width:auto;max-width:100%;display:block;
  filter:drop-shadow(0 5px 4px rgba(0,0,0,.28))}
.charimg.big{height:clamp(84px,17vh,160px)}
.charimg.sm{height:46px}
.medal .propimg{height:44px}
.propimg{height:clamp(70px,14vh,130px);width:auto;display:block;
  filter:drop-shadow(0 5px 5px rgba(0,0,0,.25))}
img.backdrop{object-fit:fill}

/* The world keeps the backdrop's exact 1376:768 ratio and covers the stage,
   bottom-anchored, framed slightly right of centre so Billu stays in view on
   narrow screens. Actor positions are percentages measured off the painting. */
.stage{container-type:size}
.world{
  --ww:max(100cqw, calc(100cqh * 1376 / 768));
  --wh:max(100cqh, calc(100cqw * 768 / 1376));
  position:absolute; bottom:0; width:var(--ww); height:var(--wh);
  left:max(calc(100cqw - var(--ww)), min(0px, calc(50cqw - var(--ww) * .57)));
  pointer-events:none;
}
.world .backdrop{position:absolute;inset:0;width:100%;height:100%}
/* Billu stands behind the counter: the box ends at the counter's back edge
   (58.8%) and clips only downward, so raised paws can still poke out above. */
.w-billu{position:absolute;left:46%;width:30%;top:34.6%;height:24.2%;
  clip-path:inset(-120% -60% 0 -60%)}
.w-billu img{position:absolute;top:0;left:50%;height:182%;width:auto;
  transform:translateX(-50%);transform-origin:50% 100%;
  filter:drop-shadow(0 4px 6px rgba(60,30,10,.35))}
.w-billu.talking img{animation:billuTalk 1.4s ease-in-out infinite}
@keyframes billuTalk{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-2.5%)}}
.w-sign{position:absolute;left:33.4%;width:34.7%;top:21.9%;height:11.6%;display:flex;align-items:center;
  justify-content:center;gap:.25em;
  font-family:var(--display);font-weight:800;color:#5C3414;font-size:calc(var(--wh) * .045);
  letter-spacing:.01em;white-space:nowrap;text-shadow:0 1px 0 rgba(255,232,196,.7), 0 -1px 0 rgba(70,35,10,.35)}
/* Noori, the granny owl, stands on the counter top between the oven and Billu */
.w-sign img{height:1.4em;width:auto;filter:drop-shadow(0 2px 2px rgba(60,30,10,.3))}
.w-prop{position:absolute;left:var(--x);bottom:var(--b);width:var(--w);translate:-50% 0}
.w-prop img{width:100%;height:auto;display:block;filter:drop-shadow(0 3px 3px rgba(60,30,10,.3))}
.w-noori{position:absolute;left:47.5%;bottom:39.3%;height:17%;translate:-50% 0;
  transform-origin:50% 100%;animation:owlsway 3.4s ease-in-out infinite}
.w-noori img{height:100%;width:auto;display:block;filter:drop-shadow(0 4px 4px rgba(60,30,10,.3))}
@keyframes owlsway{0%,100%{rotate:-1.5deg}50%{rotate:1.5deg}}
.w-guest{position:absolute;bottom:6%;height:30%;transform:translateX(-50%)}
.w-guest.r{left:80%}
.w-guest.l{left:20%}
.w-guest img{height:100%;width:auto;display:block;filter:drop-shadow(0 8px 6px rgba(60,30,10,.3))}
.w-guest.talking img,.w-noori.talking img{animation:bob .7s ease-in-out infinite}
.w-guest.enter{animation:walkin .6s cubic-bezier(.2,.9,.3,1.2)}
@keyframes walkin{from{transform:translateX(30%);opacity:0}to{transform:translateX(-50%);opacity:1}}
.worldview .scene{min-height:0}
.world{transition:filter .35s}
.world.busy{filter:blur(3px) saturate(.9) brightness(.97)}
.world.busy .w-prop,.world.busy .w-sign{visibility:hidden}
.world::after{content:"";position:absolute;inset:0;background:rgba(255,246,228,0);transition:background .35s}
.world.busy::after{background:rgba(255,246,228,.30)}

/* order card */
.ordercard{
  background:var(--paper);border:3px solid var(--crust-deep);border-radius:16px;padding:7px 14px;
  box-shadow:0 4px 0 var(--shadow);display:grid;justify-items:center;gap:1px;min-width:104px;
  transform:rotate(-2deg)
}
.ordercard .who{font-size:.66rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft)}
.frac{display:grid;justify-items:center;font-family:var(--display);font-weight:800;line-height:1}
.frac .num,.frac .den{font-size:1.65rem;padding:0 4px;border-radius:7px;transition:all .25s}
.frac .bar{width:100%;min-width:34px;height:4px;background:currentColor;border-radius:3px;margin:2px 0}
.frac.sm .num,.frac.sm .den{font-size:1.1rem}
.frac.xl .num,.frac.xl .den{font-size:3.1rem}
.glow{background:var(--gold);color:#4A3000;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}

/* work area */
.work{flex:1 1 auto;display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;
  padding:4px 0}
.panel{background:var(--panel);border:3px solid var(--wood);border-radius:18px;padding:10px 14px;
  backdrop-filter:blur(2px);box-shadow:0 5px 0 var(--shadow)}
.pizza{width:min(44vh,250px);max-width:100%;height:auto;display:block;touch-action:manipulation}
.pizza.small{width:min(30vh,165px)}
.pizza .part{cursor:pointer;transition:transform .14s, filter .14s}
.pizza .part:hover{filter:brightness(1.07)}
.pizza .part.locked{cursor:default}
.pizza.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0) rotate(0)}20%{transform:translateX(-7px) rotate(-3deg)}
  40%{transform:translateX(7px) rotate(3deg)}60%{transform:translateX(-5px) rotate(-2deg)}80%{transform:translateX(5px) rotate(2deg)}}

/* trays & buttons */
.tray{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.topbtn{width:64px;height:64px;border-radius:14px;background:var(--paper);border:3px solid var(--line);
  display:grid;place-items:center;box-shadow:0 3px 0 var(--shadow);transition:transform .12s}
.topbtn:active{transform:translateY(3px);box-shadow:none}
.topbtn[aria-pressed="true"]{border-color:var(--gold);background:#FFF2C9;transform:translateY(-3px);
  box-shadow:0 6px 0 var(--shadow)}
.topbtn svg{width:30px;height:30px}
.topbtn .topimg{width:52px;height:auto;display:block}
.btn{font-family:var(--display);font-weight:800;font-size:1.02rem;padding:10px 24px;border-radius:14px;
  background:var(--gold);color:#4A3000;border:3px solid #C7920A;box-shadow:0 4px 0 #9C7208;transition:transform .12s}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.btn.green{background:var(--good);color:#fff;border-color:#2E7A3A;box-shadow:0 4px 0 #226029}
.btn.ghost{background:var(--paper);color:var(--ink);border-color:var(--line);box-shadow:0 4px 0 var(--shadow)}
.btn.nudge{animation:nudge 1.1s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

.counter{font-family:var(--display);font-weight:800;font-size:1.3rem;background:var(--paper);
  border:3px solid var(--line);border-radius:12px;padding:3px 16px;box-shadow:0 3px 0 var(--shadow);
  font-variant-numeric:tabular-nums}

.moulds{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.mould{background:var(--paper);border:3px solid var(--line);border-radius:16px;padding:8px;
  box-shadow:0 4px 0 var(--shadow);display:grid;justify-items:center;gap:3px;transition:transform .12s}
.mould:active{transform:translateY(4px);box-shadow:none}
.mould:hover{border-color:var(--gold)}
.mould svg{width:62px;height:62px}
.mould span{font-family:var(--display);font-weight:800;font-size:.8rem}
.mould.wrong{animation:shake .45s;border-color:var(--bad);background:#FFE2DC}

/* duel */
.duel{display:flex;gap:clamp(10px,3vw,36px);align-items:flex-start;justify-content:center;flex-wrap:wrap}
.side{display:grid;justify-items:center;gap:6px;min-width:150px}
.side .score{font-family:var(--display);font-weight:800;font-size:.95rem;background:var(--paper);
  border:3px solid var(--line);border-radius:12px;padding:3px 12px;box-shadow:0 3px 0 var(--shadow)}
.plate{width:min(32vh,170px);height:auto;display:block}
.stackbtn{background:var(--paper);border:3px dashed var(--line);border-radius:14px;padding:5px 10px;
  display:grid;justify-items:center;gap:2px;box-shadow:0 3px 0 var(--shadow)}
.stackbtn:hover{border-color:var(--gold);border-style:solid}
.stackbtn svg{width:46px;height:46px}
.stackbtn span{font-family:var(--display);font-weight:800;font-size:.78rem}
.side.correct .plate{filter:drop-shadow(0 0 10px var(--good))}
.side.wrong{animation:shake .45s}
.side.wrong .plate{filter:drop-shadow(0 0 10px var(--bad))}
.pickable{cursor:pointer;border-radius:18px;padding:8px;border:3px solid transparent;transition:all .15s}
.pickable:hover{border-color:var(--gold);background:rgba(255,255,255,.45)}
.spot{background:radial-gradient(ellipse at 50% 30%, rgba(255,240,180,.75), transparent 68%)}
.fcard{background:var(--paper);border:4px solid var(--crust-deep);border-radius:18px;padding:12px 22px;
  box-shadow:0 5px 0 var(--shadow)}
.medal{display:block;animation:drop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes drop{from{transform:translateY(-40px) scale(.4);opacity:0}to{transform:none;opacity:1}}

/* rule card */
.rule{background:var(--paper);border:3px solid var(--gold);border-radius:18px;padding:10px 16px;
  max-width:420px;box-shadow:0 5px 0 var(--shadow);display:grid;gap:6px;justify-items:center;text-align:center}
.rule b{font-family:var(--display);font-size:1.02rem}
.rule p{margin:0;font-size:.9rem;line-height:1.4}

/* dialogue */
.say{flex:0 0 auto;display:flex;gap:10px;align-items:stretch;background:var(--paper);
  border:3px solid var(--wood-deep);border-radius:18px;padding:9px 12px;box-shadow:0 5px 0 var(--shadow);
  min-height:76px}
.say .av{flex:0 0 auto;width:58px;display:grid;place-items:center}
.say .av .face{font-size:2.1rem}
.say .txt{flex:1 1 auto;min-width:0;display:grid;align-content:center;gap:2px}
.say .spk{font-family:var(--display);font-weight:800;font-size:.76rem;letter-spacing:.06em;
  text-transform:uppercase;color:var(--crust-deep)}
.say .line{font-size:clamp(.94rem,2.2vw,1.08rem);line-height:1.38;margin:0;max-width:65ch}
.say .go{flex:0 0 auto;display:grid;place-items:center}

/* toast */
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:40;
  font-family:var(--display);font-weight:800;padding:9px 20px;border-radius:999px;
  border:3px solid;box-shadow:0 4px 0 var(--shadow);animation:pop .3s cubic-bezier(.2,1.5,.4,1);
  max-width:90%;text-align:center}
.toast.ok{background:#DCF5DD;color:#1E5E2A;border-color:var(--good)}
.toast.no{background:#FFE2DC;color:#8E2D1D;border-color:var(--bad)}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}

/* confetti */
.fx{position:absolute;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.fx i{position:absolute;width:11px;height:11px;border-radius:3px;animation:fall 1.5s ease-in forwards}
@keyframes fall{from{transform:translateY(-20px) rotate(0);opacity:1}
  to{transform:translateY(80vh) rotate(640deg);opacity:0}}

/* start / finale */
.cover{position:absolute;inset:0;z-index:30;display:grid;place-content:end center;justify-items:center;gap:12px;
  text-align:center;padding:24px 24px 5%;background:none}
.cover.chmenu{place-content:center;background:rgba(40,22,8,.55)}
.cover h1{font-family:var(--display);font-weight:800;font-size:clamp(2rem,7vw,3.4rem);margin:0;
  color:var(--paper);text-shadow:0 4px 0 var(--wood-deep),0 7px 14px rgba(0,0,0,.35);text-wrap:balance}
.cover p{margin:0;max-width:46ch;font-weight:700;font-size:1rem;color:#fff;
  text-shadow:0 2px 6px rgba(0,0,0,.6)}
.skills{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.skills span{background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:4px 12px;
  font-size:.82rem;font-weight:700}
.menu{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:620px}
.menu button{background:var(--paper);border:3px solid var(--line);border-radius:14px;padding:7px 14px;
  font-family:var(--display);font-weight:700;font-size:.85rem;box-shadow:0 3px 0 var(--shadow)}
.menu button:hover{border-color:var(--gold)}

.hint{font-size:.84rem;color:var(--ink-soft);font-weight:700;text-align:center;margin:0}
.twoplates{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.plabel{font-family:var(--display);font-weight:800;font-size:.9rem;text-align:center;margin-top:2px}

@media (max-width:620px){
  .say{flex-wrap:wrap}
  .say .av{width:40px}
  .say .av .face{font-size:1.6rem}
  .say .go{width:100%;justify-content:flex-end}
  .work{gap:10px}
  .scene{min-height:70px}
  .actor .face{font-size:1.9rem}
  .svgchar{width:50px;height:58px}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>

<div id="app">
  <div class="hud">
    <span class="chip" id="chapter">Blue's Pizza Shop</span>
    <div class="bar"><i id="prog"></i></div>
    <span class="chip" id="stars">⭐ 0</span>
    <button class="iconbtn" id="sfx" aria-pressed="true" title="Sound effects">🔔</button>
    <button class="iconbtn" id="voice" aria-pressed="false" title="Read aloud">🗣️</button>
    <button class="iconbtn" id="menu" title="Jump to a chapter">☰</button>
  </div>

  <div class="stage" id="stage">
    <!-- the painted shop: a fixed-ratio "world" so actors stay pinned to the art -->
    <div class="world" id="world">
      <div class="backdrop" id="backdrop"></div>
      <div class="w-sign" aria-hidden="true"><span>Blue's Pizza Shop</span><img src="assets/web/pizza_slice.webp" alt=""></div>
      <div class="w-noori" id="wNoori" hidden><img src="assets/web/noori.webp" alt="Noori"></div>
      <div class="w-billu" id="wBillu" hidden><img id="wBilluImg" src="assets/web/billu_idle.webp" alt="Chef Billu behind the counter"></div>
      <!-- on the counter: topping box, two pizzas, plates (positions measured off the painting) -->
      <div class="w-prop" style="--x:34.5%;--b:36.8%;--w:10.5%"><img src="assets/web/topping_box.webp" alt=""></div>
      <div class="w-prop" style="--x:55.2%;--b:36.4%;--w:8.6%"><img src="assets/web/pizza_board_1.webp" alt=""></div>
      <div class="w-prop" style="--x:65.4%;--b:36.4%;--w:8%"><img src="assets/web/pizza_board_2.webp" alt=""></div>
      <div class="w-prop" style="--x:71.3%;--b:37%;--w:4%"><img src="assets/web/plates_stack.webp" alt=""></div>
      <div class="w-guest r" id="wGuestR" hidden></div>
      <div class="w-guest l" id="wGuestL" hidden></div>
    </div>
    <div class="stage-inner" id="inner"></div>
    <div class="fx" id="fx"></div>
  </div>

  <div class="say" id="say"></div>
</div>

<script>
"use strict";

/* ============================================================
   1. ART — characters, backdrop, pizzas
   ============================================================ */

const BILLU_SVG = `<svg class="svgchar" viewBox="0 0 100 112" aria-label="Chef Billu">
  <ellipse cx="50" cy="106" rx="26" ry="5" fill="rgba(0,0,0,.15)"/>
  <!-- chef hat -->
  <path d="M26 36c-9 0-14-7-11-14 2-6 9-8 13-5 1-8 9-13 17-11 5-7 16-7 21 1 8-2 15 4 14 12 5 2 7 9 3 13-3 4-8 4-8 4z" fill="#F4E7C8" stroke="#D9CEBE" stroke-width="2"/>
  <rect x="26" y="33" width="48" height="11" rx="5" fill="#EADBB8" stroke="#D9CEBE" stroke-width="2"/>

/* ---- pizza geometry ---- */
const GRIDS = {1:[1,1],2:[1,2],3:[1,3],4:[2,2],5:[1,5],6:[2,3],7:[1,7],8:[2,4],9:[3,3],10:[2,5],11:[1,11],12:[3,4]};

function roundParts(n, cx, cy, R){
  const out=[];
  if(n<=1) return [{d:`M ${cx} ${cy-R} A ${R} ${R} 0 1 1 ${cx-0.01} ${cy-R} Z`, cx, cy}];
  const step = 2*Math.PI/n, start = -Math.PI/2;
  for(let i=0;i<n;i++){
    const a0=start+i*step, a1=start+(i+1)*step, mid=(a0+a1)/2;
    const x0=(cx+R*Math.cos(a0)).toFixed(2), y0=(cy+R*Math.sin(a0)).toFixed(2);
    const x1=(cx+R*Math.cos(a1)).toFixed(2), y1=(cy+R*Math.sin(a1)).toFixed(2);
    out.push({
      d:`M ${cx} ${cy} L ${x0} ${y0} A ${R} ${R} 0 ${step>Math.PI?1:0} 1 ${x1} ${y1} Z`,
      cx: cx + R*0.58*Math.cos(mid), cy: cy + R*0.58*Math.sin(mid)
    });
  }
  return out;
}
function gridOf(n, shape){
  let [rows, cols] = GRIDS[n] || [1,n];
  if(shape==="rect" && n<=5){ rows=1; cols=n; }
  if(shape==="rect" && n===12){ rows=2; cols=6; }
  return [rows, cols];
}
function boxParts(n, x0, y0, W, H, shape){
  const [rows, cols] = gridOf(n, shape);
  const w=W/cols, h=H/rows, out=[];
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++)
    out.push({ d:`M ${x0+c*w} ${y0+r*h} h ${w} v ${h} h ${-w} Z`, cx:x0+c*w+w/2, cy:y0+r*h+h/2 });
  return out;
}

let _uid = 0;

/* The painted pizza fills box bx; slices are cut over exactly the same area. */
function pizzaGeom(shape, n){
  if(shape==="square") return {parts: boxParts(n,23,23,214,214,"square"), base:"box", bx:[23,23,214,214]};
  if(shape==="rect")   return {parts: boxParts(n,5,65,250,130,"rect"),   base:"box", bx:[5,65,250,130]};
  return {parts: roundParts(n,130,130,108), base:"round", bx:[22,22,216,216]};
}

/* painted topping pieces, scattered on a part with stable pseudo-random spots */
function marksFor(kind, cx, cy, idx, n){
  const rad = Math.max(6, Math.min(22, 48/Math.sqrt(n)));
  const count = n<=4 ? 6 : n<=8 ? 4 : 3;
  const s = Math.max(.65, Math.min(1.25, 2.6/Math.sqrt(n)));
  const size = 19*s;
  let out="";
  for(let k=0;k<count;k++){
    const r1 = Math.sin((idx+1)*12.9898 + k*78.233)*43758.5453;
    const r2 = Math.sin((idx+1)*39.3468 + k*11.135)*24634.6345;
    const a  = (r1 - Math.floor(r1)) * Math.PI*2;
    const d  = (r2 - Math.floor(r2)) * rad;
    const x = cx + Math.cos(a)*d, y = cy + Math.sin(a)*d, rot = Math.round((r1 - Math.floor(r1))*360);
    out += `<image href="${ART}piece_${kind}.webp" x="${(x-size/2).toFixed(1)}" y="${(y-size/2).toFixed(1)}"
      width="${size.toFixed(1)}" height="${size.toFixed(1)}" transform="rotate(${rot} ${x.toFixed(1)} ${y.toFixed(1)})"/>`;
  }
  return out;
}

/* moulds: painted metal rim, exact blades drawn over the empty middle */
function blade(x1,y1,x2,y2){
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#5E646D" stroke-width="2.8" stroke-linecap="round"/>
          <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#E8ECF1" stroke-width=".9" stroke-linecap="round"/>`;
}
function mouldSVG(k){
  const cx=31, cy=31, r=23.6;                      // rim hole measured at 75% of the ring
  let blades="";
  if(k>1){
    for(let i=0;i<k;i++){
      const a=-Math.PI/2+i*2*Math.PI/k;
      blades += blade(cx,cy,(cx+r*Math.cos(a)).toFixed(2),(cy+r*Math.sin(a)).toFixed(2));
    }
    blades += `<circle cx="${cx}" cy="${cy}" r="2.6" fill="#9AA1AB" stroke="#5E646D" stroke-width="1"/>`;

function mouldBoxSVG(k, shape){
  // image box and measured hole inside it, in the 62×62 button space
  const img  = shape==="rect" ? [1,16.85,60,28.3] : [1,1,60,60];
  const hole = shape==="rect" ? [6.6,21.3,48.8,19.35] : [9.5,9.5,43,43];

  for(let c=1;c<cols;c++){ const x=(hx+hw*c/cols).toFixed(2); blades += blade(x,hy-1,x,hy+hh+1); }
  for(let r=1;r<rows;r++){ const y=(hy+hh*r/rows).toFixed(2); blades += blade(hx-1,y,hx+hw+1,y); }
  return `<svg viewBox="0 0 62 62" aria-hidden="true">
    <rect x="${hx}" y="${hy}" width="${hw}" height="${hh}" fill="rgba(255,236,200,.35)"/>
    ${blades}<image href="${ART}mould_${shape}.webp" x="${img[0]}" y="${img[1]}" width="${img[2]}" height="${img[3]}" preserveAspectRatio="none"/></svg>`;
}

   ============================================================ */
const Sound = (()=>{
  let ctx=null, on=true, voice=false;
  const ac=()=>{ if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return ctx; };
  function tone(f,t,dur,type,vol){
    const c=ac(); if(!c||!on) return;
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||"sine"; o.frequency.setValueAtTime(f,c.currentTime+t);
    g.gain.setValueAtTime(0,c.currentTime+t);
    g.gain.linearRampToValueAtTime(vol||.16,c.currentTime+t+.02);
    g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t+dur);
    o.connect(g); g.connect(c.destination); o.start(c.currentTime+t); o.stop(c.currentTime+t+dur+.05);
  }
  return {
    set on(v){on=v}, get on(){return on},
    set voice(v){voice=v; if(!v&&window.speechSynthesis) speechSynthesis.cancel()}, get voice(){return voice},
    tap(){ tone(620,0,.08,"triangle",.10) },
    pick(){ tone(840,0,.09,"triangle",.11) },
    good(){ [523,659,784,1047].forEach((f,i)=>tone(f,i*.085,.26,"triangle",.14)) },
    bad(){ tone(260,0,.18,"sawtooth",.09); tone(190,.13,.26,"sawtooth",.09) },
    win(){ [523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.09,.4,"triangle",.15)) },
    say(text, who){
      if(!voice || !window.speechSynthesis) return;
      try{
        speechSynthesis.cancel();
        const u=new SpeechSynthesisUtterance(String(text).replace(/(\d+)\/(\d+)/g,"$1 upon $2"));
        u.rate = .95; u.pitch = who==="noori" ? 1.45 : who==="billu" ? 1.15 : 1;
        speechSynthesis.speak(u);
      }catch(e){}
    }
  };
})();

function AV(k, cls, mood){
  const c = who(k), file = mood || c.img;
  if(!file) return `<span class="face">${c.face}</span>`;
  return `<img class="charimg ${cls||''}" src="assets/web/${file}.webp" alt="${c.name}"
    onerror="this.replaceWith(Object.assign(document.createElement('span'),
      {className:'face',textContent:'${c.face}'}))">`;
}
function PROP(file, alt, emoji){
  return `<img class="propimg" src="assets/web/${file}.webp" alt="${alt}"
    onerror="this.replaceWith(Object.assign(document.createElement('span'),
      {style:'font-size:3.4rem',textContent:'${emoji}'}))">`;
}

const el = id => document.getElementById(id);
const S = { i:0, stars:0, tries:0, started:false, local:{} };

/* Painted backdrop, with the hand-drawn SVG scene as a fallback. */

  probe.onload  = ()=>{ el("backdrop").outerHTML =
    `<img class="backdrop" id="backdrop" src="assets/web/backdrop.webp" alt="">`; };
  probe.onerror = ()=>{ el("backdrop").outerHTML = backdropSVG(); };
  probe.src = "assets/web/backdrop.webp";
})();

function save(){
  try{ localStorage.setItem("billu", JSON.stringify({i:S.i, stars:S.stars})); }catch(e){}
}
function load(){
  try{ const d=JSON.parse(localStorage.getItem("billu")||"{}");
    if(typeof d.i==="number" && d.i>0 && d.i<FLOW.length){ return d; } }catch(e){}
  return null;
}

function toast(msg, ok){
  const t=document.createElement("div");
  t.className="toast "+(ok?"ok":"no"); t.textContent=msg;
  el("stage").appendChild(t);
  setTimeout(()=>t.remove(), 2100);
}
function confetti(){
  const fx=el("fx"), cols=["#F3B713","#DC5B3B","#5BBE52","#FFE6AC","#8FD6F2","#FBD584"];
  for(let i=0;i<46;i++){
    const s=document.createElement("i");
    s.style.left = Math.random()*100+"%";
    s.style.background = cols[i%cols.length];
    s.style.animationDelay = (Math.random()*.35)+"s";
    s.style.animationDuration = (1.1+Math.random()*.8)+"s";
    fx.appendChild(s);
    setTimeout(()=>s.remove(), 2200);
  }
}
function score(firstTry){
  if(firstTry){ S.stars++; }
  el("stars").textContent = "⭐ " + S.stars;
}

function next(){ S.i = Math.min(S.i+1, FLOW.length-1); S.local={}; S.tries=0; render(); save(); }
function jump(chapter){
  const idx = FLOW.findIndex(s=>s.ch===chapter);
  if(idx>=0){ S.i=idx; S.local={}; S.tries=0; render(); save(); }
}

function setSay(speaker, text, btn){
  const c = who(speaker);
  el("say").innerHTML = `
    <div class="av">${AV(speaker,"sm")}</div>
    <div class="txt"><span class="spk">${c.name}</span><p class="line">${text}</p></div>
    <div class="go">${btn||""}</div>`;
  Sound.say(text, speaker);
}

function castRow(keys, talking, text){
  return `<div class="cast">${keys.map(k=>{
    const c=who(k);
    // Billu and Noori switch pose with the beat
    const confused = /\?|^Oh/.test(text||"");
    const mood = k==="billu" && talking==="billu" ? (confused ? "billu_puzzled" : "billu_happy")
               : k==="noori" && talking==="noori" ? "noori_point" : null;
    return `<div class="actor ${k===talking?'talking':''}">
      ${AV(k, "", mood)}
      <span class="nm">${c.name}</span></div>`;
  }).join("")}</div>`;
}

/* ---------- the painted shop: Billu behind the counter, guests out front ----------
   w = null hides everyone; otherwise {billu:pose, noori:bool, guests:[right,left], talking} */
function setWorld(w){
  const show = (id, on) => { el(id).hidden = !on; };
  el("world").classList.toggle("busy", !w);   // play screens: shop softens behind the UI
  if(!w){ ["wBillu","wNoori","wGuestR","wGuestL"].forEach(id=>show(id,false)); return; }
  const img = el("wBilluImg"), src = `assets/web/${w.billu||"billu_idle"}.webp`;
  if(!img.src.endsWith(src)) img.src = src;
  show("wBillu", true);
  el("wBillu").classList.toggle("talking", w.talking==="billu");
  show("wNoori", !!w.noori);
  el("wNoori").classList.toggle("talking", w.talking==="noori");
  [["wGuestR", w.guests && w.guests[0]], ["wGuestL", w.guests && w.guests[1]]].forEach(([id,k])=>{
    const box = el(id);
    if(!k){ box.hidden = true; box.dataset.k = ""; return; }
    if(box.dataset.k !== k){
      box.dataset.k = k;
      box.innerHTML = AV(k);
      box.classList.remove("enter"); void box.offsetWidth; box.classList.add("enter");
    }
    box.hidden = false;
    box.classList.toggle("talking", w.talking===k);
  });
}
/* guests only stand out front when the stage is wide enough to show the tables */
function roomyStage(){ const s=el("stage"); return s.clientWidth / Math.max(1,s.clientHeight) >= 1.25; }
function billuPose(speaker, text){
  if(speaker!=="billu") return "billu_idle";
  return /\?|^Oh/.test(text||"") ? "billu_puzzled" : "billu_happy";
}

/* ---------- art renderer for story beats ---------- */
function renderArt(a){
  if(!a) return "";
  switch(a.t){
    case "scene":  return "";  // the painted shop shows through
    case "board":  return `<div class="panel" style="max-width:340px;text-align:center">
        <div style="font-family:var(--display);font-weight:800;font-size:1.25rem">Order a whole pizza —<br>or just a part!</div>
        <div style="font-size:2.2rem;margin-top:6px">🍕 🍕 🍕</div></div>`;
    case "guest":  return `<div class="panel" style="text-align:center;display:grid;justify-items:center;gap:4px">
        <div style="display:flex;gap:14px;align-items:flex-end">${AV(a.g,"big")}${a.g2?AV(a.g2,"big"):""}</div>
        <p class="hint" style="margin:0">${who(a.g).name}${a.g2?" vs "+who(a.g2).name:" is here"}</p></div>`;
    case "pizza":  return pizzaSVG({shape:a.shape,n:a.n,dotted:a.dotted,highlight:a.highlight,topped:a.topped,topping:a.topping});
    case "unequal":return unequalPizzaSVG();
    case "pizzafrac": return pizzaSVG({shape:a.shape,n:a.n,highlight:a.highlight,topped:a.topped,topping:a.topping,dotted:a.dotted})
        + `<div class="panel" style="display:grid;justify-items:center;gap:2px">
             ${fracHTML(a.fn,a.fd,"xl")}
             <span class="hint">${readFrac(a.fn,a.fd)}</span></div>`;
    case "twofrac":return `<div class="panel">${fracHTML(a.a[0],a.a[1],"xl")}</div>
        <div class="panel">${fracHTML(a.b[0],a.b[1],"xl")}</div>`;
    case "denom":  return `<div class="panel" style="display:grid;justify-items:center">
          ${fracHTML(1,2,"xl","den")}<span class="hint">denominator = number of equal parts</span></div>`
        + [3,5,8].map(n=>`<div style="display:grid;justify-items:center;gap:3px">
            ${pizzaSVG({shape:"round",n,cls:"small"})}
            <span class="counter" style="font-size:1rem">?/${n}</span></div>`).join("");
    case "numer":  return `<div class="panel" style="display:grid;justify-items:center">
          ${fracHTML(1,2,"xl","num")}<span class="hint">numerator = parts we serve</span></div>`
        + `<div style="display:grid;justify-items:center;gap:3px">
            ${pizzaSVG({shape:"round",n:3,topped:[0,1],topping:"corn",cls:"small"})}
            <span class="counter" style="font-size:1rem">2/3</span></div>`
        + `<div style="display:grid;justify-items:center;gap:3px">
            ${pizzaSVG({shape:"round",n:5,topped:[0,1,2],topping:"tomato",cls:"small"})}
            <span class="counter" style="font-size:1rem">3/5</span></div>`;
    case "trophy": return `<div class="panel" style="display:grid;justify-items:center;gap:4px">
        ${PROP("trophy","The golden trophy","🏆")}<p class="hint" style="margin:0">The golden trophy</p></div>`;
    case "contest":return ["a","b"].map(s=>{
        const k=a[s+"s"], n=a[s==="a"?"an":"bn"], d=a[s==="a"?"ad":"bd"];
        return `<div class="side">
          ${AV(k)}
          ${pizzaSVG({shape:"round",n:d,topped:a.plain?[]:Array.from({length:n},(_,i)=>i),topping:"tomato",cls:"small"})}
          ${a.hide||a.plain?`<span class="score">${who(k).name}</span>`
            :`<span class="score">${who(k).name} ate ${n}/${d}</span>`}
        </div>`;
      }).join("");
    case "slices": return ["a","b"].map(s=>{
        const [n,d,k]=a[s];
        return `<div class="side">${AV(k)}
          ${sliceBig(d)}<span class="score">${who(k).name}: ${n}/${d}</span></div>`;
      }).join("");
    case "rule":   return `<div class="rule"><b>${a.title}</b>
        <div style="display:flex;align-items:center;gap:12px">
          <div style="display:grid;justify-items:center;gap:3px">${pizzaSVG({shape:"round",n:a.a[1],topped:Array.from({length:a.a[0]},(_,i)=>i),topping:"tomato",cls:"small"})}${fracHTML(a.a[0],a.a[1],"sm")}</div>

          <div style="display:grid;justify-items:center;gap:3px">${pizzaSVG({shape:"round",n:a.b[1],topped:Array.from({length:a.b[0]},(_,i)=>i),topping:"tomato",cls:"small"})}${fracHTML(a.b[0],a.b[1],"sm")}</div>

        <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:460px">

    default: return "";

}
function sliceBig(d){
  const p = roundParts(d,80,80,74)[0];
  return `<svg viewBox="0 0 160 160" style="width:min(26vh,145px);height:auto" role="img" aria-label="One slice of a pizza cut into ${d}">
    ${paintedPiece(p.d,80,80,74)}<g>${marksFor("tomato",p.cx,p.cy,0,Math.max(2,d/2))}</g></svg>`;
}
const ORD = {2:"half",3:"third",4:"quarter",5:"fifth",6:"sixth",7:"seventh",8:"eighth",9:"ninth",10:"tenth",12:"twelfth"};
function readFrac(n,d){
  if(n===d) return `${n} ${ORD[d]||d+"th"}s make one whole`;
  return `read as “${n} upon ${d}” or “${n} by ${d}”`;
}

/* ============================================================
   6. SCREENS
   ============================================================ */
function render(){
  const s = FLOW[S.i];
  el("chapter").textContent = s.ch;
  el("prog").style.width = Math.round((S.i/(FLOW.length-1))*100) + "%";
  el("stars").textContent = "⭐ " + S.stars;
  setWorld(null);
  ({beat:drawBeat, order:drawOrder, cut:drawCut, duel:drawDuel, finale:drawFinale})[s.k](s);
}

/* ---- beat ---- */
function drawBeat(s){
  const a = s.art || {};
  // establishing shots play out in the painted shop itself
  if(a.t==="scene" || a.t==="guest"){
    let guests = a.t==="guest" ? [a.g, a.g2].filter(Boolean) : [];
    if(!["narr","billu","noori"].includes(s.who) && !guests.includes(s.who)) guests.unshift(s.who);
    const roomy = roomyStage();
    setWorld({billu:billuPose(s.who, s.text), noori:true, guests: roomy ? guests : [], talking:s.who});
    el("inner").innerHTML = `<div class="scene"></div>
      <div class="work">${!roomy && guests.length ? renderArt({t:"guest", g:guests[0], g2:guests[1]}) : ""}</div>`;
    setSay(s.who, s.text, `<button class="btn" id="nx">Next ▸</button>`);
    el("nx").onclick = ()=>{ Sound.tap(); next(); };
    return;
  }
  const actors = [];
  if(s.who!=="narr" && s.who!=="billu" && s.who!=="noori") actors.push(s.who);
  el("inner").innerHTML = `
    <div class="scene">${castRow(["billu","noori"].concat(actors), s.who, s.text)}
      ${s.art && s.art.order ? orderCardHTML(s.art.guest, s.art.order[0], s.art.order[1]) : ""}</div>
    <div class="work">${renderArt(s.art)}</div>`;
  setSay(s.who, s.text, `<button class="btn" id="nx">Next ▸</button>`);
  el("nx").onclick = ()=>{ Sound.tap(); next(); };
}

function orderCardHTML(custKey, n, d, glow){
  return `<div class="ordercard"><span class="who">${who(custKey).name}'s order</span>
    ${fracHTML(n,d,"",glow)}<span class="who">of a pizza</span></div>`;
}

/* ---- order screen (pre-cut pizza: choose topping, top n parts, serve) ---- */
function drawOrder(s){
  const L = S.local;
  if(L.init !== S.i){ Object.assign(L, {init:S.i, topping:null, topped:[], step:"topping"}); }
  const glow = s.guided ? (L.step==="parts" ? "num" : null) : null;

  el("inner").innerHTML = `
    <div class="scene">
      ${castRow(["billu","noori", s.cust], s.cust)}
      ${orderCardHTML(s.cust, s.n, s.d, glow)}
    </div>
    <div class="work">
      <div style="display:grid;justify-items:center;gap:6px">
        ${pizzaSVG({shape:s.shape, n:s.d, topped:L.topped, topping:L.topping, onPart:!!L.topping,
                    highlight: s.guided && L.step==="parts" ? [] : []})}
        <span class="counter">${L.topped.length}/${s.d}</span>
      </div>
      <div style="display:grid;gap:10px;justify-items:center">
        <p class="hint">Pick a topping</p>
        <div class="tray">${Object.keys(TOPPINGS).map(k=>
          `<button class="topbtn" data-top="${k}" aria-pressed="${L.topping===k}" title="${TOPPINGS[k].label}">${toppingIcon(k)}</button>`).join("")}</div>
        <button class="btn green ${L.topped.length===s.n?'nudge':''}" id="serve" ${L.topped.length?'':'disabled'}>Serve 🍽️</button>
      </div>
    </div>`;

  const line = L.step==="topping"
      ? (s.guided ? "Now choose any topping you like!" : (s.line || `${who(s.cust).name} wants ${s.n}/${s.d} of a pizza.`))
    : L.step==="parts"
      ? `The numerator is ${s.n}. Tap ${s.n} part${s.n>1?"s":""} to add the topping.`
      : `Great! ${L.topped.length} part${L.topped.length>1?"s are":" is"} ready. Tap Serve!`;
  setSay(L.step==="topping" && !s.guided ? s.cust : "noori", line);

  el("inner").querySelectorAll("[data-top]").forEach(b=>b.onclick=()=>{
    Sound.pick(); L.topping=b.dataset.top; if(L.step==="topping") L.step="parts"; render();
  });
  el("inner").querySelectorAll(".part").forEach(p=>p.onclick=()=>{
    if(!L.topping) return;
    const i=+p.dataset.i, at=L.topped.indexOf(i);
    if(at>=0) L.topped.splice(at,1); else L.topped.push(i);
    Sound.tap();
    L.step = L.topped.length===s.n ? "serve" : "parts";
    render();
  });
  const serve = el("serve");
  if(serve) serve.onclick=()=>{
    if(L.topped.length === s.n){
      Sound.good(); confetti(); score(S.tries===0);
      toast(`${s.n} of ${s.d} parts — exactly right!`, true);
      setSay(s.cust, servedLine(s), `<button class="btn" id="nx">Next ▸</button>`);
      el("nx").onclick=()=>{ Sound.tap(); next(); };
      el("inner").querySelectorAll(".part").forEach(p=>p.onclick=null);
      if(serve) serve.disabled = true;
    } else {
      S.tries++; Sound.bad();
      toast(`Is that how much ${who(s.cust).name} wants? Try again.`, false);
      const pz = el("inner").querySelector(".pizza");
      pz.classList.add("shake");
      setTimeout(()=>{ L.topped=[]; L.step="parts"; render(); }, 520);
    }
  };
}
function servedLine(s){
  return `${s.n} of ${s.d} parts — just what I ordered! Thank you, Chef! 🎉`;
}

/* ---- cut screen (choose mould first, then top and serve) ---- */
function drawCut(s){
  const L = S.local;
  if(L.init !== S.i){ Object.assign(L, {init:S.i, phase:"mould", topping:null, topped:[], step:"topping"}); }

  if(L.phase !== "mould"){ return drawCutTop(s, L); }

  const mouldArt = k => s.shape==="round" ? mouldSVG(k) : mouldBoxSVG(k, s.shape);
  el("inner").innerHTML = `
    <div class="scene">${castRow(["billu","noori", s.cust], s.cust)}
      ${orderCardHTML(s.cust, s.n, s.d, "den")}</div>
    <div class="work">
      ${pizzaSVG({shape:s.shape, n:1})}
      <div style="display:grid;gap:10px;justify-items:center">
        <p class="hint">Choose the mould</p>
        <div class="moulds">${s.moulds.map(k=>
          `<button class="mould" data-m="${k}">${mouldArt(k)}<span>${k} parts</span></button>`).join("")}</div>
      </div>

  el("inner").querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{
    const k=+b.dataset.m;
    if(k===s.d){
      Sound.good(); L.phase="top"; L.cutFirstTry = S.tries===0;
      toast(`${s.d} equal parts!`, true);
      setTimeout(render, 420);
    } else {
      S.tries++; Sound.bad(); b.classList.add("wrong");
      toast("Hmm, is that how many parts the order needs? Try again.", false);
      setTimeout(()=>b.classList.remove("wrong"), 500);
    }
  });
}
function drawCutTop(s, L){
  if(L.phase==="done") return drawCutDone(s, L);
  el("inner").innerHTML = `
    <div class="scene">${castRow(["billu","noori", s.cust], s.cust)}
      ${orderCardHTML(s.cust, s.n, s.d, L.step==="parts"?"num":null)}</div>
    <div class="work">
      <div style="display:grid;justify-items:center;gap:6px">
        ${pizzaSVG({shape:s.shape, n:s.d, topped:L.topped, topping:L.topping, onPart:!!L.topping})}
        <span class="counter">${L.topped.length}/${s.d}</span>
      </div>
      <div style="display:grid;gap:10px;justify-items:center">
        <p class="hint">Pick a topping</p>
        <div class="tray">${Object.keys(TOPPINGS).map(k=>
          `<button class="topbtn" data-top="${k}" aria-pressed="${L.topping===k}" title="${TOPPINGS[k].label}">${toppingIcon(k)}</button>`).join("")}</div>
        <button class="btn green ${L.topped.length===s.n?'nudge':''}" id="serve" ${L.topped.length?'':'disabled'}>Serve 🍽️</button>
      </div>
    </div>`;
  setSay("noori", L.step==="topping"
    ? `Pick a topping, then top ${who(s.cust).name}'s share.`
    : L.topped.length===s.n ? "Looks perfect. Now serve it!"
    : `The numerator is ${s.n}. Tap ${s.n} part${s.n>1?"s":""}.`);

    if(!L.topping) return;
    const i=+p.dataset.i, at=L.topped.indexOf(i);

      toast(`Is that how much ${who(s.cust).name} wants? Try again.`, false);

function drawCutDone(s, L){
  const left = s.d - s.n;
  el("inner").innerHTML = `
    <div class="scene">${castRow(["billu","noori", s.cust], s.cust)}
      ${orderCardHTML(s.cust, s.n, s.d)}</div>
    <div class="work twoplates">
      <div class="side">
        ${pizzaSVG({shape:s.shape, n:s.d, topped:L.topped, topping:L.topping, cls:"small"})}
        <span class="score">Served: ${s.n}/${s.d}</span>
      </div>
      <div class="side">
        ${pizzaSVG({shape:s.shape, n:s.d, cls:"small"})}
        <span class="score">Left: ${left}/${s.d}</span>
      </div>
    </div>`;

    `<button class="btn" id="nx">Next ▸</button>`);

}

/* ---- duel screen ---- */
function drawDuel(s){
  const L = S.local;
  if(L.init !== S.i){
    Object.assign(L, {init:S.i, phase: s.mode==="build" ? "build" : "winner", a:0, b:0, reveal:false});
  }
  if(s.mode==="cards")  return drawCards(s, L);
  if(s.mode==="pizza")  return drawPizzaPick(s, L);
  if(L.phase==="build") return drawBuild(s, L);
  return drawWinner(s, L, true);
}

function drawBuild(s, L){
  const col = (side)=>{
    const o = s[side], c = who(o.key), have = L[side];
    return `<div class="side" id="side-${side}">
      ${AV(o.key)}
      <span class="score">${c.name} ate ${o.n}/${o.d}</span>
      ${plateSVG(have, o.d)}
      <button class="stackbtn" data-add="${side}">${sliceSVG(o.d)}<span>+ one 1/${o.d}</span></button>
    </div>`;
  };
  el("inner").innerHTML = `
    <div class="scene">${castRow(["billu","noori"], "billu")}
      <div class="ordercard"><span class="who">Scoreboard</span>
        <div style="display:flex;gap:10px">${fracHTML(s.a.n,s.a.d,"sm")}${fracHTML(s.b.n,s.b.d,"sm")}</div></div></div>
    <div class="work duel">${col("a")}${col("b")}</div>
    <div style="display:grid;place-items:center;padding-bottom:4px">
      <button class="btn" id="check" ${(L.a||L.b)?"":"disabled"}>Check plates</button></div>`;
  setSay("noori", s.guided
      ? `Tap a stack to put a slice on the plate. ${who(s.a.key).name} ate ${s.a.n}/${s.a.d}, ${who(s.b.key).name} ate ${s.b.n}/${s.b.d}.`
      : `Show how much each one ate, then tap Check plates.`);

  el("inner").querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{
    const side=b.dataset.add;
    if(L[side] < s[side].d){ L[side]++; Sound.tap(); render(); }
  });
  el("inner").querySelectorAll(".slice").forEach(p=>p.onclick=(ev)=>{
    const side = ev.target.closest(".side").id.replace("side-","");
    if(L[side]>0){ L[side]--; Sound.tap(); render(); }
  });
  el("check").onclick=()=>{
    const okA = L.a===s.a.n, okB = L.b===s.b.n;
    if(okA && okB){
      Sound.good();
      el("side-a").classList.add("correct"); el("side-b").classList.add("correct");
      toast("Both plates are right!", true);
      setTimeout(()=>{ L.phase="winner"; render(); }, 900);
    } else {
      S.tries++; Sound.bad();
      const bad = !okA ? "a" : "b";
      el("side-"+bad).classList.add("wrong");
      toast(`Is that how much ${who(s[bad].key).name} ate? Try again.`, false);
      setTimeout(()=>{ L[bad]=0; render(); }, 650);
    }
  };
}

function drawWinner(s, L, withPlates){
  const col = (side)=>{
    const o=s[side], c=who(o.key), win = L.done && s.correct===side;
    return `<div class="side pickable spot" data-pick="${side}" id="side-${side}" role="button" tabindex="0">
      ${win?'<span class="medal">'+PROP("medal","Winner","🏅")+'</span>':'<span style="font-size:1.4rem">&nbsp;</span>'}
      ${AV(o.key,"big")}
      <span class="score">${c.name}</span>
      ${withPlates ? plateSVG(L[side], o.d) : ""}
      ${fracHTML(o.n,o.d,"sm")}
    </div>`;
  };
  el("inner").innerHTML = `
    <div class="scene">${castRow(["billu","noori"], "billu")}
      <div class="ordercard"><span class="who">Who ate more?</span>
        <div style="font-size:1.5rem">🔦 🏆 🔦</div></div></div>
    <div class="work duel">${col("a")}${col("b")}</div>`;

  if(L.done){
    setSay("noori", s.whyText, `<button class="btn" id="nx">Next ▸</button>`);
    el("nx").onclick=()=>{ Sound.tap(); next(); };
    return;
  }
  setSay("billu", "And the winner is…?");
  el("inner").querySelectorAll("[data-pick]").forEach(b=>{
    const go = ()=>{
      const side=b.dataset.pick;
      if(side===s.correct){
        Sound.win(); confetti(); score(S.tries===0);
        L.done = true;
        s.whyText = explain(s);
        render();
      } else {
        S.tries++; Sound.bad(); b.classList.add("wrong");
        toast("Hmm, look at the plates again. Who ate more?", false);
        setTimeout(()=>b.classList.remove("wrong"), 520);
      }
    };
    b.onclick = go;
    b.onkeydown = e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } };
  });
}
function explain(s){
  const w = s[s.correct], l = s[s.correct==="a"?"b":"a"];
  if(s.a.d === s.b.d)
    return `Yes! Same denominator, so the parts are the same size — and ${w.n} parts are more than ${l.n}. ${who(w.key).name} ate more.`;
  if(s.a.n === s.b.n)
    return `Yes! Same numerator — and ${ORD[w.d]||w.d+"th"}s are bigger than ${ORD[l.d]||l.d+"th"}s. ${who(w.key).name} ate more.`;
  return `Yes! ${who(w.key).name} ate more.`;
}

function drawPizzaPick(s, L){
  const col = side => {
    const o=s[side], c=who(o.key), win = L.done && s.correct===side;
    return `<div class="side pickable" data-pick="${side}" id="side-${side}" role="button" tabindex="0">
      ${win?'<span class="medal">🏅</span>':'<span style="font-size:1.4rem">&nbsp;</span>'}
      ${AV(o.key)}
      ${pizzaSVG({shape:"round", n:o.d, topped:Array.from({length:o.n},(_,i)=>i), topping:"tomato", cls:"small"})}
      <span class="score">${c.name} ate ${o.n}/${o.d}</span></div>`;
  };
  el("inner").innerHTML = `
    <div class="scene">${castRow(["billu","noori"],"noori")}</div>
    <div class="work duel">${col("a")}${col("b")}</div>`;
  if(L.done){
    setSay("noori", s.whyText, `<button class="btn" id="nx">Next ▸</button>`);
    el("nx").onclick=()=>{ Sound.tap(); next(); };
    return;
  }
  setSay("noori", s.line || "Who ate the bigger portion? Tap their plate.");
  el("inner").querySelectorAll("[data-pick]").forEach(b=>{
    const go=()=>{
      if(b.dataset.pick===s.correct){
        Sound.win(); confetti(); score(S.tries===0);
        L.done=true; s.whyText = explain(s); render();
      } else {
        S.tries++; Sound.bad(); b.classList.add("wrong");
        toast("Look again — whose slice is bigger?", false);
        setTimeout(()=>b.classList.remove("wrong"),520);
      }
    };
    b.onclick=go; b.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();go();} };
  });
}

function drawCards(s, L){
  const col = side => {
    const o=s[side], c=who(o.key), win = L.done && s.correct===side;
    return `<div class="side pickable" data-pick="${side}" id="side-${side}" role="button" tabindex="0">
      ${win?'<span class="medal">🏅</span>':'<span style="font-size:1.4rem">&nbsp;</span>'}
      ${AV(o.key,"big")}
      <div class="fcard">${fracHTML(o.n,o.d,"xl")}</div>
      <span class="score">${c.name}</span>
      ${L.reveal ? pizzaSVG({shape:"round", n:o.d, topped:Array.from({length:o.n},(_,i)=>i), topping:"tomato", cls:"small"}) : ""}
    </div>`;
  };
  el("inner").innerHTML = `
    <div class="scene">${castRow(["billu","noori"],"billu")}
      <div class="ordercard"><span class="who">No pizza this time</span>
        <span style="font-family:var(--display);font-weight:800">Use the rules!</span></div></div>
    <div class="work duel">${col("a")}${col("b")}</div>`;
  if(L.done){
    setSay("noori", s.whyText, `<button class="btn" id="nx">Next ▸</button>`);
    el("nx").onclick=()=>{ Sound.tap(); next(); };
    return;
  }
  setSay("billu", `${who(s.a.key).name} or ${who(s.b.key).name} — who ate more?`);
  el("inner").querySelectorAll("[data-pick]").forEach(b=>{
    const go=()=>{
      if(b.dataset.pick===s.correct){
        Sound.win(); confetti(); score(S.tries===0);
        L.done=true; s.whyText = "Yes! " + (s.why || explain(s)); render();
      } else {
        S.tries++; Sound.bad(); b.classList.add("wrong");
        L.reveal = true;
        toast("Oops! Try again — look at the pictures.", false);
        setTimeout(render, 560);
      }
    };
    b.onclick=go; b.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();go();} };
  });
}

/* ---- finale ---- */
function drawFinale(){
  const max = FLOW.filter(s=>s.k==="order"||s.k==="cut"||s.k==="duel").length;

/* ============================================================
   7. COVER + CONTROLS
   ============================================================ */
function cover(){
  const saved = load();
  const c = document.createElement("div");
  c.className="cover";
  c.innerHTML = `
    <div class="tray">
      <button class="btn" id="play">${saved ? "Continue" : "Start cooking 🍕"}</button>
      ${saved ? '<button class="btn ghost" id="fresh">Start over</button>' : ""}
    </div>`;
  el("stage").appendChild(c);
  el("say").innerHTML = `<div class="av"><span class="face">🍕</span></div>
    <div class="txt"><span class="spk">Blue's Pizza Shop</span>
    <p class="line">A fractions adventure with Chef Billu and Noori. Tap <b>Start cooking</b> to open the shop.</p></div>`;
  el("play").onclick = ()=>{
    if(saved){ S.i=saved.i; S.stars=saved.stars||0; }
    c.remove(); S.started=true; Sound.tap(); render();
  };
  const f = el("fresh");
  if(f) f.onclick = ()=>{ S.i=0; S.stars=0; c.remove(); S.started=true; Sound.tap(); render(); };
  // the open shop sits behind the cover so the page is complete at rest
  el("inner").innerHTML = "";
  setWorld({billu:"billu_idle", noori:true});
}

    <button class="btn ghost" id="close">Close</button>`;
  el("stage").appendChild(c);
  c.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{ c.remove(); jump(b.dataset.ch); });
  c.querySelector("#close").onclick=()=>c.remove();
};

document.addEventListener("keydown", e=>{
  if(e.key==="Enter" && S.started){
    const n=el("nx"); if(n){ e.preventDefault(); n.click(); }
  }
});

function boot(){ cover(); }

/* survive a live republish without losing progress */
try{
  if(window.claude && window.claude.hot){
    window.claude.hot.snapshot(()=>({i:S.i, stars:S.stars, started:S.started}));
    window.claude.hot.ready(d=>{
      if(d && d.started){ S.i=d.i||0; S.stars=d.stars||0; S.started=true; render(); }
      else boot();
    });
  } else boot();
}catch(e){ boot(); }
</script>
